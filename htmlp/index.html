<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Preview</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --accent-red: #ff2e63;
            --accent-blue: #08d9d6;
            --text-dark: #1a1a1a;
            --text-light: #f5f0e6;
            --border-weight: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            padding: 1rem 1.5rem;
            border-bottom: var(--border-weight) solid var(--text-dark);
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: var(--bg-primary);
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.5rem;
            color: var(--text-dark);
            position: relative;
        }

        .logo::before {
            content: 'HTML';
            position: absolute;
            left: 2px;
            top: 2px;
            color: var(--accent-red);
            z-index: -1;
        }

        .logo-sub {
            font-size: 0.8rem;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.2rem 0.5rem;
            margin-left: 0.5rem;
        }

        .actions {
            display: flex;
            gap: 0.5rem;
        }

        .btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            padding: 0.5rem 1rem;
            border: 3px solid var(--text-dark);
            background: white;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--text-dark);
        }

        main {
            flex: 1;
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: 0;
        }

        @media (max-width: 768px) {
            main {
                grid-template-columns: 1fr;
                grid-template-rows: 1fr 1fr;
            }
        }

        .editor-panel {
            display: flex;
            flex-direction: column;
            border-right: var(--border-weight) solid var(--text-dark);
            min-height: 0;
        }

        .panel-header {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.5rem 1rem;
        }

        textarea {
            flex: 1;
            font-family: 'DM Mono', monospace;
            font-size: 0.9rem;
            padding: 1rem;
            border: none;
            background: #1e1e1e;
            color: #d4d4d4;
            outline: none;
            resize: none;
            line-height: 1.6;
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            min-height: 0;
        }

        .preview-header {
            background: var(--accent-blue);
            color: var(--text-dark);
        }

        iframe {
            flex: 1;
            border: none;
            background: white;
        }

        .toast {
            position: fixed;
            bottom: 1.5rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.8rem 1.5rem;
            font-size: 0.85rem;
            border: 3px solid var(--accent-blue);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<header>
    <div>
        <span class="logo">HTML</span>
        <span class="logo-sub">PREVIEW</span>
    </div>
    <div class="actions">
        <button class="btn" id="copy-btn">Copy</button>
        <button class="btn" id="clear-btn">Clear</button>
    </div>
</header>

<main>
    <div class="editor-panel">
        <div class="panel-header">Code</div>
        <textarea id="editor" placeholder="HTMLを入力..." spellcheck="false"><div style="font-family: system-ui; padding: 2rem; max-width: 600px; margin: 0 auto;">
  <h1 style="color: #ff2e63;">Hello World</h1>
  <p>HTMLをリアルタイムでプレビュー</p>

  <button onclick="alert('Clicked!')" style="
    background: #08d9d6;
    border: none;
    padding: 0.8rem 1.5rem;
    font-size: 1rem;
    cursor: pointer;
    border-radius: 4px;
  ">Click me</button>
</div></textarea>
    </div>

    <div class="preview-panel">
        <div class="panel-header preview-header">Preview</div>
        <iframe id="preview"></iframe>
    </div>
</main>

<div class="toast" id="toast"></div>

<script>
    const editor = document.getElementById('editor');
    const preview = document.getElementById('preview');
    const copyBtn = document.getElementById('copy-btn');
    const clearBtn = document.getElementById('clear-btn');
    const toast = document.getElementById('toast');

    function updatePreview() {
        const doc = preview.contentDocument;
        doc.open();
        doc.write(editor.value);
        doc.close();

        // Auto save
        localStorage.setItem('htmlp-code', editor.value);
    }

    // Load saved code
    const saved = localStorage.getItem('htmlp-code');
    if (saved) {
        editor.value = saved;
    }

    editor.addEventListener('input', updatePreview);

    copyBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(editor.value);
            showToast('Copied!');
        } catch (e) {
            showToast('Copy failed');
        }
    });

    clearBtn.addEventListener('click', () => {
        editor.value = '';
        updatePreview();
        showToast('Cleared');
    });

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
    }

    // Initial render
    updatePreview();
</script>
</body>
</html>
