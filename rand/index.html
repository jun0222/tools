<!DOCTYPE html>
<html>
  <head>
    <title>Password Generator</title>
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
        background-color: #0d1117;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .terminal {
        background-color: #161b22;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        width: 100%;
        max-width: 520px;
        overflow: hidden;
        border: 1px solid #30363d;
      }

      .terminal-header {
        background: linear-gradient(180deg, #2d333b 0%, #22272e 100%);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #30363d;
      }

      .terminal-buttons {
        display: flex;
        gap: 8px;
      }

      .terminal-btn {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .btn-close { background-color: #f85149; }
      .btn-minimize { background-color: #f0883e; }
      .btn-maximize { background-color: #3fb950; }

      .terminal-title {
        flex: 1;
        text-align: center;
        color: #8b949e;
        font-size: 13px;
        font-weight: 500;
      }

      .terminal-body {
        padding: 24px;
      }

      .prompt-line {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        color: #c9d1d9;
        font-size: 14px;
      }

      .prompt {
        color: #3fb950;
        margin-right: 8px;
      }

      .command {
        color: #79c0ff;
      }

      .output-box {
        background-color: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
      }

      .output-label {
        color: #8b949e;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      .password-display {
        font-size: 24px;
        color: #58a6ff;
        word-break: break-all;
        cursor: pointer;
        transition: color 0.2s;
        font-weight: 500;
      }

      .password-display:hover {
        color: #79c0ff;
      }

      .options-section {
        margin-bottom: 20px;
      }

      .option-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #21262d;
      }

      .option-row:last-child {
        border-bottom: none;
      }

      .option-label {
        color: #c9d1d9;
        font-size: 14px;
      }

      .option-input {
        background-color: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #c9d1d9;
        padding: 6px 12px;
        font-size: 16px;
        width: 80px;
        text-align: center;
        font-family: inherit;
      }

      .option-input:focus {
        outline: none;
        border-color: #58a6ff;
        box-shadow: 0 0 0 3px rgba(88, 166, 255, 0.2);
      }

      .toggle-switch {
        position: relative;
        width: 44px;
        height: 24px;
      }

      .toggle-switch input {
        opacity: 0;
        width: 0;
        height: 0;
      }

      .toggle-slider {
        position: absolute;
        cursor: pointer;
        top: 0;
        left: 0;
        right: 0;
        bottom: 0;
        background-color: #30363d;
        transition: 0.3s;
        border-radius: 24px;
      }

      .toggle-slider:before {
        position: absolute;
        content: "";
        height: 18px;
        width: 18px;
        left: 3px;
        bottom: 3px;
        background-color: #c9d1d9;
        transition: 0.3s;
        border-radius: 50%;
      }

      input:checked + .toggle-slider {
        background-color: #238636;
      }

      input:checked + .toggle-slider:before {
        transform: translateX(20px);
      }

      .action-buttons {
        display: flex;
        gap: 12px;
      }

      .btn {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-generate {
        background: linear-gradient(180deg, #238636 0%, #2ea043 100%);
        color: white;
      }

      .btn-generate:hover {
        background: linear-gradient(180deg, #2ea043 0%, #3fb950 100%);
        transform: translateY(-1px);
      }

      .btn-copy {
        background-color: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
      }

      .btn-copy:hover {
        background-color: #30363d;
        border-color: #8b949e;
      }

      .btn-copy.copied {
        background-color: #238636;
        border-color: #238636;
        color: white;
      }

      .status-bar {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #21262d;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .status-text {
        color: #8b949e;
        font-size: 12px;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #3fb950;
        font-size: 12px;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background-color: #3fb950;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      @media screen and (max-width: 480px) {
        .password-display {
          font-size: 18px;
        }

        .terminal-body {
          padding: 16px;
        }
      }
    </style>
  </head>
  <body>
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-buttons">
          <div class="terminal-btn btn-close"></div>
          <div class="terminal-btn btn-minimize"></div>
          <div class="terminal-btn btn-maximize"></div>
        </div>
        <div class="terminal-title">password-gen ~ readable</div>
      </div>
      <div class="terminal-body">
        <div class="prompt-line">
          <span class="prompt">$</span>
          <span class="command">generate --type readable</span>
        </div>

        <div class="output-box">
          <div class="output-label">Generated Password</div>
          <div class="password-display" id="passwordOutput" onclick="copyToClipboard()">
            loading...
          </div>
        </div>

        <div class="options-section">
          <div class="option-row">
            <span class="option-label">Word Count</span>
            <input type="number" class="option-input" id="wordCount" value="3" min="1" max="5" />
          </div>
          <div class="option-row">
            <span class="option-label">Include Numbers</span>
            <label class="toggle-switch">
              <input type="checkbox" id="includeNumbers" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="option-row">
            <span class="option-label">Include Symbols</span>
            <label class="toggle-switch">
              <input type="checkbox" id="includeSymbols" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="option-row">
            <span class="option-label">Include Uppercase</span>
            <label class="toggle-switch">
              <input type="checkbox" id="includeUppercase" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
          <div class="option-row">
            <span class="option-label">Include Salt</span>
            <label class="toggle-switch">
              <input type="checkbox" id="includeSalt" checked />
              <span class="toggle-slider"></span>
            </label>
          </div>
        </div>

        <div class="action-buttons">
          <button class="btn btn-generate" id="generateButton">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
              <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
            </svg>
            Generate
          </button>
          <button class="btn btn-copy" id="copyButton">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
              <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
            </svg>
            Copy
          </button>
        </div>

        <div class="status-bar">
          <span class="status-text">Click password to copy</span>
          <span class="status-indicator">
            <span class="status-dot"></span>
            Ready
          </span>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
