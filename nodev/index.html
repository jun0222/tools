<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thought Graph</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400&family=Syne:wght@700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background:#0f1117; color:#c8d0e0;
            font-family:'IBM Plex Mono',monospace;
            height:100vh; display:flex; flex-direction:column; overflow:hidden;
        }
        header {
            padding:12px 20px; border-bottom:1px solid #1e2535;
            display:flex; align-items:center; gap:16px; flex-shrink:0;
        }
        header h1 {
            font-family:'Syne',sans-serif; font-size:15px; font-weight:700;
            letter-spacing:.15em; color:#e8eaf0;
        }
        header span { font-size:11px; color:#3a4560; letter-spacing:.06em; }
        .save-indicator {
            margin-left:auto; font-size:10px; letter-spacing:.08em;
            color:#3a4560; transition:color .3s;
        }
        .save-indicator.saved { color:#38c8b0; }
        .main { display:flex; flex:1; overflow:hidden; }
        .panel {
            width:260px; flex-shrink:0; background:#0c0f18;
            border-right:1px solid #1e2535;
            display:flex; flex-direction:column; padding:14px; gap:10px;
        }
        .panel label { font-size:10px; letter-spacing:.1em; color:#3a4560; text-transform:uppercase; }
        textarea {
            flex:1; background:#080b12; border:1px solid #1e2535;
            color:#8898b8; font-family:'IBM Plex Mono',monospace;
            font-size:12px; line-height:1.7; padding:10px;
            resize:none; outline:none; border-radius:3px; transition:border-color .2s;
        }
        textarea:focus { border-color:#3a5080; }
        .btn-row { display:flex; gap:8px; }
        button {
            flex:1; padding:8px 0; border:1px solid; background:transparent;
            font-family:'IBM Plex Mono',monospace; font-size:11px;
            letter-spacing:.08em; cursor:pointer; border-radius:3px; transition:all .15s;
        }
        .btn-reset { border-color:#2a3545; color:#4a5570; }
        .btn-reset:hover { border-color:#4a5570; color:#8898b8; }
        .btn-clear { border-color:#3a2020; color:#804040; }
        .btn-clear:hover { border-color:#804040; color:#c06060; }
        .legend { display:flex; flex-direction:column; gap:5px; }
        .legend-row { display:flex; align-items:center; gap:8px; font-size:10px; color:#3a4560; }
        .leg-dot { width:8px; height:8px; border-radius:50%; flex-shrink:0; }
        #graph { flex:1; position:relative; overflow:hidden; }
        svg { width:100%; height:100%; display:block; }
        .hint {
            position:absolute; bottom:14px; right:16px;
            font-size:10px; color:#2a3545; letter-spacing:.05em;
            line-height:1.9; text-align:right; pointer-events:none;
        }
    </style>
</head>
<body>
<header>
    <h1>THOUGHT GRAPH</h1>
    <span>箇条書き → ノードグラフ</span>
    <div class="save-indicator" id="saveIndicator">—</div>
</header>
<div class="main">
    <div class="panel">
        <label>入力（リアルタイム更新）</label>
        <textarea id="input" spellcheck="false" placeholder="- 項目1&#10;  - 子項目&#10;    - 孫項目"></textarea>
        <div class="btn-row">
            <button class="btn-reset" id="resetBtn">⟳ ビューリセット</button>
            <button class="btn-clear" id="clearBtn">✕ クリア</button>
        </div>
        <div class="legend">
            <label>深さ</label>
            <div class="legend-row"><div class="leg-dot" style="background:#e8a030"></div>深さ 0</div>
            <div class="legend-row"><div class="leg-dot" style="background:#38c8b0"></div>深さ 1</div>
            <div class="legend-row"><div class="leg-dot" style="background:#6888f8"></div>深さ 2</div>
            <div class="legend-row"><div class="leg-dot" style="background:#b858f0"></div>深さ 3</div>
            <div class="legend-row"><div class="leg-dot" style="background:#58e880"></div>深さ 4+</div>
        </div>
    </div>
    <div id="graph">
        <div class="hint">ドラッグ: ノード移動<br>スクロール: ズーム<br>背景ドラッグ: パン</div>
    </div>
</div>
<script>
    const STORAGE_KEY = 'thought-graph-v1';
    const PALETTE     = ['#e8a030','#38c8b0','#6888f8','#b858f0','#58e880','#f07858'];
    const colorOf     = d => PALETTE[Math.min(d.depth, PALETTE.length - 1)];
    const radiusOf    = d => Math.max(4, 10 - d.depth * 1.4);

    // ── localStorage ─────────────────────────────
    function saveToStorage(text) {
        try {
            localStorage.setItem(STORAGE_KEY, text);
            showSaved();
        } catch(e) { /* quota exceeded etc */ }
    }
    function loadFromStorage() {
        try { return localStorage.getItem(STORAGE_KEY); } catch(e) { return null; }
    }

    const indicator = document.getElementById('saveIndicator');
    let saveTimer = null;
    function showSaved() {
        indicator.textContent = '✓ 保存済み';
        indicator.classList.add('saved');
        clearTimeout(saveTimer);
        saveTimer = setTimeout(() => {
            indicator.textContent = '—';
            indicator.classList.remove('saved');
        }, 1500);
    }

    // ── パーサー ──────────────────────────────────
    function parseIndent(raw) {
        let id = 0;
        const nodes = [], links = [], stack = [];
        for (const line of raw.split('\n')) {
            if (!line.trim()) continue;
            const indent = line.search(/\S/);
            const label  = line.replace(/^[\s\-\*\u2022]+/, '').trim();
            if (!label) continue;
            while (stack.length > 0 && stack[stack.length-1].indent >= indent) stack.pop();
            const depth = stack.length;
            const node  = { id: `n${id++}`, label, depth };
            nodes.push(node);
            if (stack.length > 0) links.push({ source: stack[stack.length-1].node.id, target: node.id });
            stack.push({ node, indent });
        }
        return { nodes, links };
    }

    // ── グラフ状態 ────────────────────────────────
    let sim      = null;
    let zoomB    = null;
    let gRef     = null;   // <g>要素
    let svgRef   = null;
    let posCache = {};     // id → {x, y}  ノード位置を保持

    function render(raw) {
        const { nodes, links } = parseIndent(raw);
        const el = document.getElementById('graph');
        const W  = el.clientWidth;
        const H  = el.clientHeight;

        // ── 初回だけSVGを作る ──
        if (!svgRef) {
            svgRef = d3.select('#graph').append('svg');
            gRef   = svgRef.append('g');
            zoomB  = d3.zoom().scaleExtent([0.08, 8]).on('zoom', e => gRef.attr('transform', e.transform));
            svgRef.call(zoomB);
        }

        if (sim) sim.stop();

        // 前回のノード位置をキャッシュに退避
        // （simが保持しているnode.x/yを使う）
        // → render呼び出し前に毎回退避する
        // posCache はシミュレーション tick の後に更新される

        // 既存の位置を引き継ぐ
        nodes.forEach(n => {
            if (posCache[n.id]) {
                n.x = posCache[n.id].x;
                n.y = posCache[n.id].y;
            } else {
                // 新ノードは中央付近にランダム配置
                n.x = W/2 + (Math.random()-.5)*160;
                n.y = H/2 + (Math.random()-.5)*160;
            }
        });

        // 描画を全部再構築（差分ではなくjoin()で宣言的に）
        gRef.selectAll('*').remove();

        // エッジ（背面）
        const linkSel = gRef.append('g')
            .selectAll('line').data(links).join('line')
            .attr('stroke','#3a5570')
            .attr('stroke-width', 1.2)
            .attr('stroke-opacity', 0.6);

        // ノード
        const nodeSel = gRef.append('g')
            .selectAll('g').data(nodes).join('g')
            .call(d3.drag()
                .on('start', (ev,d) => { if(!ev.active) sim.alphaTarget(0.3).restart(); d.fx=d.x; d.fy=d.y; })
                .on('drag',  (ev,d) => { d.fx=ev.x; d.fy=ev.y; })
                .on('end',   (ev,d) => { if(!ev.active) sim.alphaTarget(0); d.fx=null; d.fy=null; })
            );

        nodeSel.append('circle')
            .attr('r', radiusOf)
            .attr('fill',         d => colorOf(d)+'22')
            .attr('stroke',       colorOf)
            .attr('stroke-width', d => d.depth===0 ? 2 : 1.2)
            .style('cursor','grab');

        nodeSel.append('text')
            .attr('x', d => radiusOf(d)+5)
            .attr('y', 0)
            .attr('dominant-baseline','central')
            .attr('fill', colorOf)
            .attr('font-family',"'IBM Plex Mono',monospace")
            .attr('font-size', d => Math.max(9, 12 - d.depth))
            .attr('opacity', 0.85)
            .attr('pointer-events','none')
            .text(d => d.label);

        // ── シミュレーション ──
        sim = d3.forceSimulation(nodes)
            .force('link',
                d3.forceLink(links).id(d => d.id)
                    .distance(d => 65 + (typeof d.source==='object' ? d.source.depth : 0)*18)
                    .strength(0.9)
            )
            .force('charge',  d3.forceManyBody().strength(-260))
            .force('center',  d3.forceCenter(W/2, H/2).strength(0.04))
            .force('collide', d3.forceCollide().radius(d => radiusOf(d)+18))
            // 既存ノードはほぼ動かしたくないので alpha を低めに
            .alpha(nodes.some(n => !posCache[n.id]) ? 0.5 : 0.15)
            .alphaDecay(0.04)
            .on('tick', () => {
                linkSel
                    .attr('x1', d => d.source.x).attr('y1', d => d.source.y)
                    .attr('x2', d => d.target.x).attr('y2', d => d.target.y);
                nodeSel.attr('transform', d => `translate(${d.x},${d.y})`);
                // 位置キャッシュを更新
                nodes.forEach(n => { posCache[n.id] = { x: n.x, y: n.y }; });
            });
    }

    function resetView() {
        if (svgRef && zoomB) svgRef.transition().duration(400).call(zoomB.transform, d3.zoomIdentity);
    }

    // ── テキストエリア: デバウンス付きリアルタイム更新 ──
    let debounceTimer = null;
    const textarea = document.getElementById('input');

    textarea.addEventListener('input', () => {
        const val = textarea.value;

        // localStorage保存（300ms デバウンス）
        clearTimeout(debounceTimer);
        debounceTimer = setTimeout(() => {
            saveToStorage(val);
            render(val);
        }, 300);

        // グラフは即時更新（軽い）
        render(val);
    });

    document.getElementById('resetBtn').addEventListener('click', resetView);
    document.getElementById('clearBtn').addEventListener('click', () => {
        if (confirm('入力内容をクリアしますか？')) {
            textarea.value = '';
            posCache = {};
            saveToStorage('');
            render('');
        }
    });

    // ── 起動時: localStorage から復元 ──
    window.addEventListener('load', () => {
        const saved = loadFromStorage();
        if (saved !== null && saved !== '') {
            textarea.value = saved;
            indicator.textContent = '↩ 復元済み';
            indicator.classList.add('saved');
            setTimeout(() => { indicator.textContent = '—'; indicator.classList.remove('saved'); }, 2000);
        } else {
            // デフォルトサンプル
            textarea.value = `・ほげ
  ・ふが
    ・ぴよ
   `;
        }
        setTimeout(() => render(textarea.value), 100);
    });
</script>
</body>
</html>
