<!DOCTYPE html>
<html>
  <head>
    <title>Random Generator</title>
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0"
    />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: "JetBrains Mono", "Fira Code", "SF Mono", Consolas, monospace;
        background-color: #0d1117;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        padding: 20px;
      }

      .terminal {
        background-color: #161b22;
        border-radius: 12px;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        width: 100%;
        max-width: 520px;
        overflow: hidden;
        border: 1px solid #30363d;
      }

      .terminal-header {
        background: linear-gradient(180deg, #2d333b 0%, #22272e 100%);
        padding: 12px 16px;
        display: flex;
        align-items: center;
        gap: 8px;
        border-bottom: 1px solid #30363d;
      }

      .terminal-buttons {
        display: flex;
        gap: 8px;
      }

      .terminal-btn {
        width: 12px;
        height: 12px;
        border-radius: 50%;
      }

      .btn-close { background-color: #f85149; }
      .btn-minimize { background-color: #f0883e; }
      .btn-maximize { background-color: #3fb950; }

      .terminal-title {
        flex: 1;
        text-align: center;
        color: #8b949e;
        font-size: 13px;
        font-weight: 500;
      }

      .terminal-body {
        padding: 24px;
      }

      .prompt-line {
        display: flex;
        align-items: center;
        margin-bottom: 16px;
        color: #c9d1d9;
        font-size: 14px;
      }

      .prompt {
        color: #3fb950;
        margin-right: 8px;
      }

      .command {
        color: #79c0ff;
      }

      .output-box {
        background-color: #0d1117;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 16px;
        margin-bottom: 20px;
        position: relative;
        overflow: hidden;
      }

      .output-label {
        color: #8b949e;
        font-size: 11px;
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 8px;
      }

      .output-display {
        font-size: 20px;
        color: #f0883e;
        word-break: break-all;
        cursor: pointer;
        transition: color 0.2s;
        font-weight: 500;
      }

      .output-display:hover {
        color: #ffa657;
      }

      .options-section {
        margin-bottom: 20px;
      }

      .option-row {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 10px 0;
        border-bottom: 1px solid #21262d;
      }

      .option-row:last-child {
        border-bottom: none;
      }

      .option-label {
        color: #c9d1d9;
        font-size: 14px;
      }

      .option-input {
        background-color: #0d1117;
        border: 1px solid #30363d;
        border-radius: 6px;
        color: #c9d1d9;
        padding: 6px 12px;
        font-size: 14px;
        width: 80px;
        text-align: center;
        font-family: inherit;
      }

      .option-input:focus {
        outline: none;
        border-color: #f0883e;
        box-shadow: 0 0 0 3px rgba(240, 136, 62, 0.2);
      }

      .type-selector {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 20px;
      }

      .type-option {
        background-color: #21262d;
        border: 1px solid #30363d;
        border-radius: 8px;
        padding: 12px;
        cursor: pointer;
        transition: all 0.2s;
        text-align: center;
      }

      .type-option:hover {
        background-color: #30363d;
        border-color: #8b949e;
      }

      .type-option.active {
        background-color: #f0883e20;
        border-color: #f0883e;
      }

      .type-option input {
        display: none;
      }

      .type-name {
        color: #c9d1d9;
        font-size: 13px;
        font-weight: 600;
        margin-bottom: 4px;
      }

      .type-example {
        color: #8b949e;
        font-size: 11px;
      }

      .length-row {
        display: none;
        padding: 12px 0;
        border-bottom: 1px solid #21262d;
        margin-bottom: 12px;
      }

      .length-row.visible {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .action-buttons {
        display: flex;
        gap: 12px;
      }

      .btn {
        flex: 1;
        padding: 12px 20px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 14px;
        font-weight: 600;
        font-family: inherit;
        transition: all 0.2s;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
      }

      .btn-generate {
        background: linear-gradient(180deg, #da6c25 0%, #f0883e 100%);
        color: white;
      }

      .btn-generate:hover {
        background: linear-gradient(180deg, #f0883e 0%, #ffa657 100%);
        transform: translateY(-1px);
      }

      .btn-copy {
        background-color: #21262d;
        color: #c9d1d9;
        border: 1px solid #30363d;
      }

      .btn-copy:hover {
        background-color: #30363d;
        border-color: #8b949e;
      }

      .btn-copy.copied {
        background-color: #238636;
        border-color: #238636;
        color: white;
      }

      .status-bar {
        margin-top: 16px;
        padding-top: 16px;
        border-top: 1px solid #21262d;
        display: flex;
        justify-content: space-between;
        align-items: center;
      }

      .status-text {
        color: #8b949e;
        font-size: 12px;
      }

      .status-indicator {
        display: flex;
        align-items: center;
        gap: 6px;
        color: #f0883e;
        font-size: 12px;
      }

      .status-dot {
        width: 6px;
        height: 6px;
        background-color: #f0883e;
        border-radius: 50%;
        animation: pulse 2s infinite;
      }

      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
      }

      @media screen and (max-width: 480px) {
        .output-display {
          font-size: 16px;
        }

        .terminal-body {
          padding: 16px;
        }

        .type-selector {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="terminal">
      <div class="terminal-header">
        <div class="terminal-buttons">
          <div class="terminal-btn btn-close"></div>
          <div class="terminal-btn btn-minimize"></div>
          <div class="terminal-btn btn-maximize"></div>
        </div>
        <div class="terminal-title">random-gen ~ multi</div>
      </div>
      <div class="terminal-body">
        <div class="prompt-line">
          <span class="prompt">$</span>
          <span class="command" id="commandText">generate --type uuid</span>
        </div>

        <div class="output-box">
          <div class="output-label">Generated Output</div>
          <div class="output-display" id="output" onclick="copyToClipboard()">
            loading...
          </div>
        </div>

        <div class="type-selector">
          <label class="type-option active">
            <input type="radio" name="type" value="uuid" checked />
            <div class="type-name">UUID</div>
            <div class="type-example">a1b2c3d4-...</div>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="numeric" />
            <div class="type-name">Numeric</div>
            <div class="type-example">8667800229</div>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="alphanumeric" />
            <div class="type-name">Alphanumeric</div>
            <div class="type-example">pmzFHyOjw0</div>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="alphanumericSymbol" />
            <div class="type-name">With Symbols</div>
            <div class="type-example">gpKf*T(y8e</div>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="customPattern" />
            <div class="type-name">Custom</div>
            <div class="type-example">Kiwi_663</div>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="hiragana" />
            <div class="type-name">Hiragana</div>
            <div class="type-example">あいうえお</div>
          </label>
          <label class="type-option">
            <input type="radio" name="type" value="katakana" />
            <div class="type-name">Katakana</div>
            <div class="type-example">アイウエオ</div>
          </label>
        </div>

        <div class="length-row" id="lengthRow">
          <span class="option-label">Length</span>
          <input type="number" class="option-input" id="length" value="10" min="1" max="100" />
        </div>

        <div class="action-buttons">
          <button class="btn btn-generate" id="generateButton">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 3a5 5 0 1 0 4.546 2.914.5.5 0 0 1 .908-.417A6 6 0 1 1 8 2v1z"/>
              <path d="M8 4.466V.534a.25.25 0 0 1 .41-.192l2.36 1.966c.12.1.12.284 0 .384L8.41 4.658A.25.25 0 0 1 8 4.466z"/>
            </svg>
            Generate
          </button>
          <button class="btn btn-copy" id="copyButton">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="currentColor">
              <path d="M4 1.5H3a2 2 0 0 0-2 2V14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V3.5a2 2 0 0 0-2-2h-1v1h1a1 1 0 0 1 1 1V14a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V3.5a1 1 0 0 1 1-1h1v-1z"/>
              <path d="M9.5 1a.5.5 0 0 1 .5.5v1a.5.5 0 0 1-.5.5h-3a.5.5 0 0 1-.5-.5v-1a.5.5 0 0 1 .5-.5h3zm-3-1A1.5 1.5 0 0 0 5 1.5v1A1.5 1.5 0 0 0 6.5 4h3A1.5 1.5 0 0 0 11 2.5v-1A1.5 1.5 0 0 0 9.5 0h-3z"/>
            </svg>
            Copy
          </button>
        </div>

        <div class="status-bar">
          <span class="status-text">Click output to copy</span>
          <span class="status-indicator">
            <span class="status-dot"></span>
            Ready
          </span>
        </div>
      </div>
    </div>
    <script src="main.js"></script>
  </body>
</html>
