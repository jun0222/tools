<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="mobile-web-app-capable" content="yes">
    <title>高速回転学習タイマー</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            min-height: 100vh;
        }

        /* iPhoneのセーフエリア対応 */
        .container-wrapper {
            padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }

        .flash-success {
            animation: flash-success 0.4s ease-out;
        }

        @keyframes flash-success {
            0%, 100% { background-color: white; }
            50% { background-color: #86efac; }
        }

        .scale-bounce {
            animation: scale-bounce 0.3s ease-out;
        }

        @keyframes scale-bounce {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        .timer-display {
            font-variant-numeric: tabular-nums;
            line-height: 1;
        }

        .preset-btn {
            transition: all 0.2s;
        }

        .preset-btn:active {
            transform: scale(0.95);
        }

        .main-button {
            min-height: 60px;
            font-size: 1.125rem;
            transition: all 0.2s;
        }

        .main-button:active {
            transform: scale(0.98);
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }

        @media (max-width: 640px) {
            .timer-display {
                font-size: 5rem;
            }
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 via-white to-purple-50">

    <div class="flex flex-col min-h-screen max-w-lg mx-auto p-4 container-wrapper">

        <!-- ヘッダー -->
        <div class="text-center mb-4">
            <h1 class="text-xl font-bold text-slate-800 mb-1">高速回転学習タイマー</h1>
            <p class="text-xs text-slate-500">「意味がわからなくても止まらない」</p>
        </div>

        <!-- メインカード -->
        <div id="timer-card" class="bg-white rounded-3xl shadow-2xl flex-1 flex flex-col">

            <!-- 統計エリア -->
            <div class="stat-card text-white p-4 rounded-t-3xl">
                <div class="flex justify-around items-center">
                    <div class="text-center">
                        <div class="text-xs opacity-80 mb-1">現在の周回</div>
                        <div class="flex items-baseline justify-center gap-1">
                            <span id="lap-count" class="text-4xl font-black scale-bounce">1</span>
                            <span class="text-sm">周目</span>
                        </div>
                    </div>
                    <div class="w-px h-12 bg-white/30"></div>
                    <div class="text-center">
                        <div class="text-xs opacity-80 mb-1">本日の総周回</div>
                        <div class="flex items-baseline justify-center gap-1">
                            <span id="total-laps" class="text-4xl font-black">0</span>
                            <span class="text-sm">周</span>
                        </div>
                    </div>
                </div>
            </div>

            <!-- タイマー表示 -->
            <div class="flex-1 flex flex-col justify-center items-center p-6">
                <div id="display" class="timer-display text-8xl font-black text-slate-800 mb-8">
                    10
                </div>

                <!-- プリセットボタン -->
                <div class="w-full mb-6">
                    <div class="text-xs text-slate-500 mb-2 text-center">クイック設定</div>
                    <div class="grid grid-cols-4 gap-2">
                        <button onclick="setPreset(6)" class="preset-btn bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 rounded-xl text-sm">
                            6秒
                        </button>
                        <button onclick="setPreset(10)" class="preset-btn bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 rounded-xl text-sm">
                            10秒
                        </button>
                        <button onclick="setPreset(20)" class="preset-btn bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 rounded-xl text-sm">
                            20秒
                        </button>
                        <button onclick="setPreset(60)" class="preset-btn bg-blue-100 hover:bg-blue-200 text-blue-700 font-bold py-3 rounded-xl text-sm">
                            60秒
                        </button>
                    </div>
                </div>

                <!-- カスタム時間設定 -->
                <div class="flex items-center justify-center gap-3 mb-6">
                    <label class="text-sm text-slate-600 font-medium">カスタム:</label>
                    <input type="number" id="sec-input" value="6" min="5" max="600"
                           class="w-20 border-2 border-slate-200 rounded-xl px-3 py-2 text-center font-bold text-lg focus:outline-none focus:border-blue-400">
                    <span class="text-sm text-slate-600">秒</span>
                </div>
            </div>

            <!-- コントロールボタン -->
            <div class="p-6 pt-0">
                <div class="flex gap-3">
                    <button onclick="toggleTimer()" id="btn-main"
                        class="main-button flex-1 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold rounded-2xl shadow-lg">
                        スタート
                    </button>
                    <button onclick="resetTimer()"
                        class="main-button bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold px-6 rounded-2xl">
                        リセット
                    </button>
                </div>

                <!-- サウンド設定 -->
                <div class="flex items-center justify-center gap-4 mt-4">
                    <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" id="sound-toggle" checked
                               class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <span>サウンド</span>
                    </label>
                    <label class="flex items-center gap-2 text-sm text-slate-600 cursor-pointer">
                        <input type="checkbox" id="vibration-toggle" checked
                               class="w-4 h-4 rounded border-slate-300 text-blue-600 focus:ring-blue-500">
                        <span>バイブ</span>
                    </label>
                </div>
            </div>

            <!-- フッター -->
            <div class="bg-slate-50 p-4 rounded-b-3xl border-t border-slate-100">
                <p class="text-xs text-slate-500 text-center leading-relaxed">
                    「拾えるものだけ拾って次へ！」<br>
                    繰り返すたびに理解が深まります
                </p>
            </div>
        </div>

        <!-- データ管理ボタン -->
        <div class="mt-4 flex gap-2">
            <button onclick="copyHistoryToClipboard()" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white text-sm font-medium py-2 px-4 rounded-xl">
                履歴をコピー
            </button>
            <button onclick="confirmClearHistory()" class="flex-1 bg-red-500 hover:bg-red-600 text-white text-sm font-medium py-2 px-4 rounded-xl">
                データを消去
            </button>
        </div>
    </div>

    <script>
        // 状態管理
        let timeLeft;
        let timerInterval = null;
        let lap = 1;
        let totalLaps = 0;
        let sessionStartTime = null;

        // DOM要素
        const display = document.getElementById('display');
        const lapDisplay = document.getElementById('lap-count');
        const totalLapsDisplay = document.getElementById('total-laps');
        const secInput = document.getElementById('sec-input');
        const btnMain = document.getElementById('btn-main');
        const card = document.getElementById('timer-card');
        const soundToggle = document.getElementById('sound-toggle');
        const vibrationToggle = document.getElementById('vibration-toggle');

        // LocalStorage キー
        const HISTORY_KEY = 'rotation-timer-history';

        // 初期化
        function init() {
            loadStats();
            updateDisplay();

            // スクリーンロック防止
            if ('wakeLock' in navigator) {
                requestWakeLock();
            }
        }

        // 今日の日付を YYYY/MM/DD 形式で取得
        function getTodayKey() {
            const today = new Date();
            const year = today.getFullYear();
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const day = String(today.getDate()).padStart(2, '0');
            return `${year}/${month}/${day}`;
        }

        // 履歴データの取得
        function getHistory() {
            const historyStr = localStorage.getItem(HISTORY_KEY);
            return historyStr ? JSON.parse(historyStr) : {};
        }

        // 履歴データの保存
        function saveHistory(history) {
            localStorage.setItem(HISTORY_KEY, JSON.stringify(history));
        }

        // 旧データのマイグレーション
        function migrateOldData() {
            const oldStatsKey = 'rotation-timer-stats';
            const oldDateKey = 'rotation-timer-date';

            const oldStats = localStorage.getItem(oldStatsKey);
            const oldDate = localStorage.getItem(oldDateKey);

            if (oldStats && oldDate) {
                // 旧データが存在する場合、新形式に変換
                const history = getHistory();
                const date = new Date(oldDate);
                const year = date.getFullYear();
                const month = String(date.getMonth() + 1).padStart(2, '0');
                const day = String(date.getDate()).padStart(2, '0');
                const dateKey = `${year}/${month}/${day}`;

                // 既に新形式にデータがない場合のみマイグレート
                if (!history[dateKey]) {
                    history[dateKey] = parseInt(oldStats) || 0;
                    saveHistory(history);
                }

                // 旧データを削除
                localStorage.removeItem(oldStatsKey);
                localStorage.removeItem(oldDateKey);
            }
        }

        // 統計の読み込み
        function loadStats() {
            migrateOldData(); // マイグレーション実行
            const history = getHistory();
            const todayKey = getTodayKey();
            totalLaps = history[todayKey] || 0;
            totalLapsDisplay.textContent = totalLaps;
        }

        // 統計の保存
        function saveStats() {
            const history = getHistory();
            const todayKey = getTodayKey();
            history[todayKey] = totalLaps;
            saveHistory(history);
        }

        // プリセット設定
        function setPreset(seconds) {
            if (!timerInterval) {
                secInput.value = seconds;
                timeLeft = seconds;
                updateDisplay();
            }
        }

        // タイマー切り替え
        function toggleTimer() {
            if (timerInterval) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        // タイマー開始
        function startTimer() {
            if (!timeLeft) {
                timeLeft = parseInt(secInput.value);
            }

            if (!sessionStartTime) {
                sessionStartTime = Date.now();
            }

            // ユーザーインタラクション時にAudioContextを初期化
            if (soundToggle.checked) {
                initAudioContext();
            }

            btnMain.textContent = "一時停止";
            btnMain.className = "main-button flex-1 bg-gradient-to-r from-red-500 to-red-600 hover:from-red-600 hover:to-red-700 text-white font-bold rounded-2xl shadow-lg";

            timerInterval = setInterval(() => {
                timeLeft--;
                updateDisplay();

                if (timeLeft <= 0) {
                    completeLap();
                }
            }, 1000);
        }

        // タイマー一時停止
        function pauseTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            btnMain.textContent = "再開";
            btnMain.className = "main-button flex-1 bg-gradient-to-r from-green-500 to-green-600 hover:from-green-600 hover:to-green-700 text-white font-bold rounded-2xl shadow-lg";
        }

        // 周回完了
        function completeLap() {
            lap++;
            totalLaps++;

            lapDisplay.textContent = lap;
            lapDisplay.classList.add('scale-bounce');
            setTimeout(() => lapDisplay.classList.remove('scale-bounce'), 300);

            totalLapsDisplay.textContent = totalLaps;
            saveStats();

            timeLeft = parseInt(secInput.value);
            updateDisplay();

            // 視覚的フィードバック
            card.classList.add('flash-success');
            setTimeout(() => card.classList.remove('flash-success'), 400);

            // サウンドとバイブレーション
            if (soundToggle.checked) {
                playSound();
            }
            if (vibrationToggle.checked) {
                vibrate();
            }
        }

        // 表示更新
        function updateDisplay() {
            display.textContent = timeLeft || parseInt(secInput.value);
        }

        // リセット
        function resetTimer() {
            clearInterval(timerInterval);
            timerInterval = null;
            lap = 1;
            timeLeft = parseInt(secInput.value);
            sessionStartTime = null;

            updateDisplay();
            lapDisplay.textContent = lap;
            btnMain.textContent = "スタート";
            btnMain.className = "main-button flex-1 bg-gradient-to-r from-blue-500 to-blue-600 hover:from-blue-600 hover:to-blue-700 text-white font-bold rounded-2xl shadow-lg";
        }

        // 履歴をクリップボードにコピー（スプレッドシート用）
        async function copyHistoryToClipboard() {
            const history = getHistory();
            const entries = Object.entries(history).sort((a, b) => a[0].localeCompare(b[0]));

            if (entries.length === 0) {
                alert('コピーするデータがありません');
                return;
            }

            // タブ区切り形式で作成
            const text = entries.map(([date, laps]) => `${date}\t${laps}`).join('\n');

            try {
                await navigator.clipboard.writeText(text);
                alert('クリップボードにコピーしました！\nスプレッドシートに貼り付けできます。');
            } catch (err) {
                console.error('コピー失敗:', err);
                alert('コピーに失敗しました');
            }
        }

        // データ消去確認
        function confirmClearHistory() {
            if (confirm('すべての履歴データを消去しますか？\nこの操作は取り消せません。')) {
                localStorage.removeItem(HISTORY_KEY);
                totalLaps = 0;
                totalLapsDisplay.textContent = totalLaps;
                alert('データを消去しました');
            }
        }

        // AudioContext（グローバルで保持）
        let audioContext = null;

        // AudioContextの初期化
        async function initAudioContext() {
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }
            // サスペンド状態の場合は再開
            if (audioContext.state === 'suspended') {
                await audioContext.resume();
            }
        }

        // サウンド再生
        async function playSound() {
            try {
                await initAudioContext();

                const oscillator = audioContext.createOscillator();
                const gainNode = audioContext.createGain();

                oscillator.connect(gainNode);
                gainNode.connect(audioContext.destination);

                oscillator.frequency.value = 800;
                oscillator.type = 'sine';

                gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.2);

                oscillator.start(audioContext.currentTime);
                oscillator.stop(audioContext.currentTime + 0.2);
            } catch (e) {
                console.log('Audio not supported:', e);
            }
        }

        // バイブレーション
        function vibrate() {
            if ('vibrate' in navigator) {
                navigator.vibrate([100, 50, 100]);
            }
        }

        // スクリーンロック防止
        let wakeLock = null;
        async function requestWakeLock() {
            try {
                wakeLock = await navigator.wakeLock.request('screen');
                wakeLock.addEventListener('release', () => {
                    console.log('Wake Lock released');
                });
            } catch (err) {
                console.log('Wake Lock not supported');
            }
        }

        // ページ表示時にWake Lockを再取得
        document.addEventListener('visibilitychange', async () => {
            if (document.visibilityState === 'visible' && 'wakeLock' in navigator) {
                await requestWakeLock();
            }
        });

        // 初期化実行
        init();
    </script>
</body>
</html>
