<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --bg-secondary: #1a1a1a;
            --accent-yellow: #ffde03;
            --accent-red: #ff2e63;
            --accent-blue: #08d9d6;
            --accent-green: #9dff00;
            --accent-purple: #6c5ce7;
            --text-dark: #1a1a1a;
            --text-light: #f5f0e6;
            --border-weight: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg-primary);
            min-height: 100vh;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(0,0,0,0.03) 50px, rgba(0,0,0,0.03) 51px),
                repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0,0,0,0.03) 50px, rgba(0,0,0,0.03) 51px);
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.3;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        header {
            padding: 1rem 2rem;
            border-bottom: var(--border-weight) solid var(--text-dark);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--text-dark);
            text-transform: uppercase;
            position: relative;
        }

        .logo::before {
            content: 'COLOR';
            position: absolute;
            left: 3px; top: 3px;
            color: var(--accent-purple);
            z-index: -1;
        }

        .logo-sub {
            font-size: 0.7rem;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.2rem 0.6rem;
            margin-left: 0.5rem;
        }

        .save-status {
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
            border: 2px solid var(--text-dark);
            background: var(--accent-green);
        }

        main {
            max-width: 1600px;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 320px 1fr 280px;
            gap: 1.5rem;
        }

        @media (max-width: 1000px) {
            main { grid-template-columns: 1fr; }
        }

        .panel {
            border: var(--border-weight) solid var(--text-dark);
            background: white;
            box-shadow: 6px 6px 0 var(--text-dark);
        }

        .panel-header {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.5rem 1rem;
        }

        .panel-content {
            padding: 1rem;
        }

        /* Hue Wheel */
        .hue-wheel-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .hue-wheel {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .hue-segment {
            position: absolute;
            width: 36px;
            height: 36px;
            border: 3px solid var(--text-dark);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .hue-segment:hover {
            transform: scale(1.15);
            z-index: 10;
        }

        .hue-segment.selected {
            box-shadow: 0 0 0 3px white, 0 0 0 6px var(--text-dark);
            z-index: 11;
        }

        .hue-center {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            gap: 4px;
        }

        .hue-center-btn {
            width: 32px;
            height: 32px;
            border: 3px solid var(--text-dark);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .hue-center-btn:hover {
            transform: scale(1.15);
        }

        .hue-center-btn.selected {
            box-shadow: 0 0 0 3px var(--accent-purple);
        }

        .hue-center-btn.white {
            background: #ffffff;
        }

        .hue-center-btn.black {
            background: #000000;
        }

        /* Tone Grid */
        .tone-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .tone-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .tone-axis {
            position: absolute;
            font-size: 0.55rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .tone-axis.horizontal {
            bottom: -18px;
            left: 0;
            right: 0;
            justify-content: space-between;
        }

        .tone-axis.vertical {
            top: 0;
            bottom: 0;
            left: -45px;
            flex-direction: column;
            justify-content: space-between;
        }

        .tone-arrow {
            font-size: 0.7rem;
        }

        .bw-buttons {
            display: flex;
            gap: 6px;
            margin-bottom: 1rem;
        }

        .bw-btn {
            flex: 1;
            padding: 8px;
            border: 3px solid var(--text-dark);
            cursor: pointer;
            font-size: 0.7rem;
            font-family: 'DM Mono', monospace;
            transition: transform 0.1s;
        }

        .bw-btn:hover {
            transform: scale(1.05);
        }

        .bw-btn.selected {
            box-shadow: 0 0 0 2px var(--accent-purple), 0 0 0 4px var(--text-dark);
        }

        .bw-btn.white {
            background: #ffffff;
            color: #000;
        }

        .bw-btn.black {
            background: #000000;
            color: #fff;
        }

        .tone-btn {
            aspect-ratio: 1;
            border: 2px solid var(--text-dark);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .tone-btn:hover {
            transform: scale(1.15);
            z-index: 1;
        }

        .tone-btn.selected {
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--text-dark);
        }

        /* Current Color */
        .current-color {
            border: 3px solid var(--text-dark);
            padding: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .current-swatch {
            width: 50px;
            height: 50px;
            border: 3px solid var(--text-dark);
        }

        .current-info { flex: 1; font-size: 0.8rem; }

        .color-code-input {
            font-family: 'DM Mono', monospace;
            font-weight: bold;
            font-size: 0.85rem;
            width: 100%;
            padding: 0.3rem 0.5rem;
            border: 2px solid var(--text-dark);
            background: var(--bg-primary);
            outline: none;
            margin-bottom: 0.4rem;
        }

        .color-code-input:focus {
            background: white;
            box-shadow: 0 0 0 2px var(--accent-blue);
        }

        .hsl-info {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 0.3rem;
            font-size: 0.65rem;
        }

        .hsl-item {
            background: var(--bg-primary);
            padding: 0.2rem 0.4rem;
            border: 1px solid #ddd;
            text-align: center;
        }

        .hsl-label {
            color: #888;
        }

        .hsl-value {
            font-weight: bold;
        }

        /* Palette */
        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 50px;
        }

        .palette-swatch {
            width: 36px;
            height: 36px;
            border: 3px solid var(--text-dark);
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
        }

        .palette-swatch:hover { transform: scale(1.1); z-index: 1; }

        .palette-swatch.selected {
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--accent-purple);
        }

        .palette-swatch .delete {
            position: absolute;
            top: -8px; right: -8px;
            width: 18px; height: 18px;
            background: var(--accent-red);
            color: white;
            border: 2px solid var(--text-dark);
            border-radius: 50%;
            font-size: 10px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .palette-swatch:hover .delete { display: flex; }

        .add-btn {
            width: 36px;
            height: 36px;
            border: 3px dashed var(--text-dark);
            background: var(--bg-primary);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn:hover { background: var(--accent-yellow); }

        /* Human Figure */
        .human-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .human-svg {
            width: 200px;
            height: 340px;
            margin: 1rem 0;
        }

        .human-svg .part {
            cursor: pointer;
            transition: filter 0.15s, stroke-width 0.15s;
            stroke: var(--text-dark);
            stroke-width: 2;
        }

        .human-svg .part:hover {
            filter: brightness(1.15);
            stroke-width: 4;
        }

        .reset-btn {
            margin-top: 0.5rem;
            font-size: 0.65rem;
            padding: 0.3rem 0.6rem;
            border: 2px solid var(--text-dark);
            background: white;
            cursor: pointer;
        }

        .reset-btn:hover { background: var(--accent-red); color: white; }

        .section-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }

        /* Customization Controls */
        .custom-control {
            margin-bottom: 1rem;
        }

        .custom-buttons {
            display: flex;
            gap: 4px;
            flex-wrap: wrap;
        }

        .custom-btn {
            padding: 0.3rem 0.5rem;
            font-size: 0.6rem;
            font-family: 'DM Mono', monospace;
            border: 2px solid var(--text-dark);
            background: white;
            cursor: pointer;
            transition: all 0.1s;
        }

        .custom-btn:hover {
            background: var(--bg-primary);
        }

        .custom-btn.active {
            background: var(--accent-purple);
            color: white;
        }
    </style>
</head>
<body>
<div class="noise-overlay"></div>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const STORAGE_KEY = 'color_picker_data';

    // 12 Hue colors (30 degree steps)
    const HUES = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];

    // Tone grid
    const SATURATIONS = [100, 75, 50, 25, 10];
    const LIGHTNESSES = [85, 70, 55, 40, 25];

    // Default human parts colors
    const DEFAULT_PARTS = {
        hair: '#2d2d2d',
        outer: '#8b7355',
        inner: '#f5f5f5',
        pants: '#4a4a4a',
        shoes: '#2d2d2d',
    };

    // Default body customization
    const DEFAULT_BODY_CUSTOM = {
        neckline: 'crew',           // 'crew', 'v', 'high'
        sleeveLength: 'half',       // 'tank', 'sleeveless', 'half', 'five', 'seven', 'nine', 'long'
        sleeveWidth: 'normal',      // 'narrow', 'normal', 'wide'
        torsoLength: 'normal',      // 'short', 'normal', 'long'
        torsoWidth: 'normal',       // 'narrow', 'normal', 'wide'
        pantsHemType: 'straight',   // 'straight', 'tapered', 'wide', 'flare', 'barrel'
        kneePosition: 'normal',     // 'high', 'normal', 'low'
        pantsLength: 'full',        // 'shorts', 'five', 'cropped', 'full'
        pantsWidth: 'normal',       // 'skinny', 'normal', 'wide'
        shoeWidth: 'normal',        // 'narrow', 'normal', 'wide'
        shoeThickness: 'normal',    // 'thin', 'normal', 'thick'
    };

    function hslToHex(h, s, l) {
        const hDecimal = l / 100;
        const a = (s * Math.min(hDecimal, 1 - hDecimal)) / 100;
        const f = (n) => {
            const k = (n + h / 30) % 12;
            const color = hDecimal - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
    }

    function hexToHsl(hex) {
        // Remove # if present
        hex = hex.replace(/^#/, '');
        if (hex.length === 3) {
            hex = hex.split('').map(c => c + c).join('');
        }
        if (hex.length !== 6) return null;

        const r = parseInt(hex.slice(0, 2), 16) / 255;
        const g = parseInt(hex.slice(2, 4), 16) / 255;
        const b = parseInt(hex.slice(4, 6), 16) / 255;

        const max = Math.max(r, g, b);
        const min = Math.min(r, g, b);
        let h, s, l = (max + min) / 2;

        if (max === min) {
            h = s = 0;
        } else {
            const d = max - min;
            s = l > 0.5 ? d / (2 - max - min) : d / (max + min);
            switch (max) {
                case r: h = ((g - b) / d + (g < b ? 6 : 0)) / 6; break;
                case g: h = ((b - r) / d + 2) / 6; break;
                case b: h = ((r - g) / d + 4) / 6; break;
            }
        }

        return {
            h: Math.round(h * 360),
            s: Math.round(s * 100),
            l: Math.round(l * 100),
        };
    }

    // Calculate position on circle
    function getHuePosition(hue, radius, centerX, centerY) {
        const angle = (hue - 90) * (Math.PI / 180);
        return {
            x: centerX + radius * Math.cos(angle),
            y: centerY + radius * Math.sin(angle),
        };
    }

    function HumanFigure({ parts, onApplyColor, bodyCustom }) {
        // Calculate positions and sizes based on customization
        const torsoTop = 95;
        const torsoLengthOffset = bodyCustom.torsoLength === 'short' ? -10 : bodyCustom.torsoLength === 'long' ? 10 : 0;
        const torsoBottom = 185 + torsoLengthOffset;

        const torsoWidthFactor = bodyCustom.torsoWidth === 'narrow' ? 1.15 : bodyCustom.torsoWidth === 'wide' ? 0.85 : 1;
        const outerLeftInner = 70 * torsoWidthFactor;
        const outerRightInner = 200 - outerLeftInner;
        const outerLeftOuter = 55 * torsoWidthFactor;
        const outerRightOuter = 200 - outerLeftOuter;

        // Sleeve parameters
        // Define arm length (skin visible part) and sleeve end position
        let armEndY, sleeveEndY, sleeveExists;
        const armStartY = torsoTop + 25;

        switch (bodyCustom.sleeveLength) {
            case 'tank':
                armEndY = 185;
                sleeveEndY = torsoTop;
                sleeveExists = false;
                break;
            case 'sleeveless':
                armEndY = 185;
                sleeveEndY = torsoTop + 10;
                sleeveExists = true;
                break;
            case 'half':
                armEndY = 185;
                sleeveEndY = 135;
                sleeveExists = true;
                break;
            case 'five':
                armEndY = 185;
                sleeveEndY = 155;
                sleeveExists = true;
                break;
            case 'seven':
                armEndY = 185;
                sleeveEndY = 170;
                sleeveExists = true;
                break;
            case 'nine':
                armEndY = 185;
                sleeveEndY = 180;
                sleeveExists = true;
                break;
            case 'long':
                armEndY = 185;
                sleeveEndY = 185;
                sleeveExists = true;
                break;
            default:
                armEndY = 185;
                sleeveEndY = 135;
                sleeveExists = true;
        }

        // Sleeve width only affects the garment, not the arm
        const baseSleeveWidth = 15;
        const sleeveWidthOffset = bodyCustom.sleeveWidth === 'narrow' ? -5 : bodyCustom.sleeveWidth === 'wide' ? 8 : 0;

        // Pants parameters
        const pantsTop = torsoBottom;
        let pantsBottom, legEndY;

        switch (bodyCustom.pantsLength) {
            case 'shorts':
                pantsBottom = 230;  // Above knee
                legEndY = 320;
                break;
            case 'five':
                pantsBottom = 250;  // At knee
                legEndY = 320;
                break;
            case 'cropped':
                pantsBottom = 290;  // Show ankles
                legEndY = 320;
                break;
            case 'full':
            default:
                pantsBottom = 310;  // Full length
                legEndY = 320;
        }

        const kneeYOffset = bodyCustom.kneePosition === 'high' ? -20 : bodyCustom.kneePosition === 'low' ? 20 : 0;
        const kneeY = 210 + kneeYOffset;

        // Pants width calculations
        const pantsTopWidth = bodyCustom.pantsWidth === 'skinny' ? 0.85 : bodyCustom.pantsWidth === 'wide' ? 1.2 : 1;
        const pantsLeft = 60 + (1 - pantsTopWidth) * 20;
        const pantsRight = 140 - (1 - pantsTopWidth) * 20;

        // Hem width based on type
        let hemWidthFactor, kneeWidthFactor;
        switch (bodyCustom.pantsHemType) {
            case 'tapered':
                hemWidthFactor = 0.7;
                kneeWidthFactor = 1.0;
                break;
            case 'wide':
                hemWidthFactor = 1.3;
                kneeWidthFactor = 1.0;
                break;
            case 'flare':
                hemWidthFactor = 1.5;  // Wider at bottom
                kneeWidthFactor = 0.9;  // Narrower at knee
                break;
            case 'barrel':
                hemWidthFactor = 0.85;  // Tapered at bottom
                kneeWidthFactor = 1.3;  // Wide at thigh/knee
                break;
            case 'straight':
            default:
                hemWidthFactor = 1.0;
                kneeWidthFactor = 1.0;
        }

        const pantsBottomLeftInner = 80 - (80 - 55) * (1 - hemWidthFactor);
        const pantsBottomLeftOuter = 55 + (80 - 55) * (1 - hemWidthFactor) * 0.3;
        const pantsBottomRightInner = 120 + (145 - 120) * (1 - hemWidthFactor);
        const pantsBottomRightOuter = 145 - (145 - 120) * (1 - hemWidthFactor) * 0.3;

        // Shoe parameters
        const shoeWidthFactor = bodyCustom.shoeWidth === 'narrow' ? 0.85 : bodyCustom.shoeWidth === 'wide' ? 1.2 : 1;
        const shoeThicknessFactor = bodyCustom.shoeThickness === 'thin' ? 0.35 : bodyCustom.shoeThickness === 'thick' ? 0.7 : 0.5;  // Half of previous values

        // Neck area coordinates
        const neckBottom = 93; // Where the neck meets the shoulders

        // Neckline - calculate additional path segment after left shoulder
        let necklineSegment;
        let necklineTopY;

        if (bodyCustom.neckline === 'v') {
            // V-neck: opens in a V shape, showing neck and collarbone
            necklineTopY = neckBottom + 12;
            necklineSegment = `L 100 ${necklineTopY} L ${outerRightInner} ${torsoTop}`;
        } else if (bodyCustom.neckline === 'high') {
            // High neck: covers the neck up to near the chin
            necklineTopY = 78;
            necklineSegment = `Q ${(outerLeftInner + outerRightInner) / 2} ${necklineTopY} ${outerRightInner} ${torsoTop}`;
        } else {
            // Crew neck (default): rounded neckline showing the neck
            necklineTopY = neckBottom + 5;
            necklineSegment = `Q ${(outerLeftInner + 100) / 2} ${necklineTopY - 2} 100 ${necklineTopY} Q ${(100 + outerRightInner) / 2} ${necklineTopY - 2} ${outerRightInner} ${torsoTop}`;
        }

        return (
            <svg className="human-svg" viewBox="0 0 200 340">
                {/* Hair */}
                <ellipse
                    className="part"
                    cx="100" cy="35" rx="38" ry="30"
                    fill={parts.hair}
                    onClick={() => onApplyColor('hair')}
                />

                {/* Head/Face */}
                <ellipse cx="100" cy="55" rx="32" ry="35" fill="#fad5c8" stroke="#1a1a1a" strokeWidth="2" />
                {/* Eyes */}
                <circle cx="88" cy="50" r="3" fill="#1a1a1a" />
                <circle cx="112" cy="50" r="3" fill="#1a1a1a" />
                {/* Mouth */}
                <path d="M 92 65 Q 100 72 108 65" fill="none" stroke="#e88" strokeWidth="2" />
                {/* Cheeks */}
                <ellipse cx="78" cy="58" rx="6" ry="4" fill="#fbb" opacity="0.5" />
                <ellipse cx="122" cy="58" rx="6" ry="4" fill="#fbb" opacity="0.5" />

                {/* Neck - drawn before clothes so it appears behind neckline */}
                <path
                    d="M 85 87 L 85 95 L 115 95 L 115 87 Q 110 82 100 82 Q 90 82 85 87 Z"
                    fill="#fad5c8"
                    stroke="#1a1a1a"
                    strokeWidth="2"
                />

                {/* Outer (Cardigan/Jacket) - Left side */}
                <path
                    className="part"
                    d={`M ${outerLeftOuter} ${torsoTop}
                       Q ${outerLeftOuter - 5} ${torsoTop + 5} ${outerLeftOuter - 7} ${torsoTop + 25}
                       L ${outerLeftOuter - 7} ${torsoBottom - 5}
                       Q ${outerLeftOuter - 7} ${torsoBottom} ${outerLeftOuter} ${torsoBottom}
                       L ${outerLeftInner} ${torsoBottom}
                       L ${outerLeftInner} ${torsoTop}
                       Z`}
                    fill={parts.outer}
                    onClick={() => onApplyColor('outer')}
                />
                {/* Outer - Right side */}
                <path
                    className="part"
                    d={`M ${outerRightOuter} ${torsoTop}
                       Q ${outerRightOuter + 5} ${torsoTop + 5} ${outerRightOuter + 7} ${torsoTop + 25}
                       L ${outerRightOuter + 7} ${torsoBottom - 5}
                       Q ${outerRightOuter + 7} ${torsoBottom} ${outerRightOuter} ${torsoBottom}
                       L ${outerRightInner} ${torsoBottom}
                       L ${outerRightInner} ${torsoTop}
                       Z`}
                    fill={parts.outer}
                    onClick={() => onApplyColor('outer')}
                />
                {/* Arms (skin) - Left */}
                <path
                    d={`M ${outerLeftOuter - 3} ${armStartY}
                        L 40 ${armEndY}
                        Q 38 ${armEndY + 8} 43 ${armEndY + 8}
                        L 48 ${armEndY + 8}
                        L ${outerLeftOuter + 2} ${armStartY + 5} Z`}
                    fill="#fad5c8"
                    stroke="#1a1a1a"
                    strokeWidth="2"
                />
                {/* Arms (skin) - Right */}
                <path
                    d={`M ${outerRightOuter + 3} ${armStartY}
                        L 160 ${armEndY}
                        Q 162 ${armEndY + 8} 157 ${armEndY + 8}
                        L 152 ${armEndY + 8}
                        L ${outerRightOuter - 2} ${armStartY + 5} Z`}
                    fill="#fad5c8"
                    stroke="#1a1a1a"
                    strokeWidth="2"
                />

                {/* Sleeves (clothing) - only if sleeves exist */}
                {sleeveExists && (
                    <>
                        {/* Left sleeve */}
                        <path
                            className="part"
                            d={`M ${outerLeftOuter - 7} ${armStartY}
                                L ${40 - baseSleeveWidth - sleeveWidthOffset} ${sleeveEndY}
                                L ${40 + baseSleeveWidth + sleeveWidthOffset} ${sleeveEndY}
                                L ${outerLeftOuter + 3} ${armStartY + 5} Z`}
                            fill={parts.outer}
                            onClick={() => onApplyColor('outer')}
                        />
                        {/* Right sleeve */}
                        <path
                            className="part"
                            d={`M ${outerRightOuter + 7} ${armStartY}
                                L ${160 + baseSleeveWidth + sleeveWidthOffset} ${sleeveEndY}
                                L ${160 - baseSleeveWidth - sleeveWidthOffset} ${sleeveEndY}
                                L ${outerRightOuter - 3} ${armStartY + 5} Z`}
                            fill={parts.outer}
                            onClick={() => onApplyColor('outer')}
                        />
                    </>
                )}

                {/* Hands */}
                <ellipse cx="40" cy={armEndY + 13} rx="10" ry="8" fill="#fad5c8" stroke="#1a1a1a" strokeWidth="2" />
                <ellipse cx="160" cy={armEndY + 13} rx="10" ry="8" fill="#fad5c8" stroke="#1a1a1a" strokeWidth="2" />

                {/* Inner (T-shirt) */}
                <path
                    className="part"
                    d={`M ${outerLeftInner} ${torsoTop}
                       ${necklineSegment}
                       L ${outerRightInner} ${torsoBottom}
                       L ${outerLeftInner} ${torsoBottom}
                       Z`}
                    fill={parts.inner}
                    onClick={() => onApplyColor('inner')}
                />

                {/* Legs (skin) - visible below pants */}
                <path
                    d={`M ${pantsBottomLeftOuter} ${pantsBottom}
                       L 58 ${legEndY}
                       L 82 ${legEndY}
                       L ${pantsBottomLeftInner} ${pantsBottom} Z`}
                    fill="#fad5c8"
                    stroke="#1a1a1a"
                    strokeWidth="2"
                />
                <path
                    d={`M ${pantsBottomRightInner} ${pantsBottom}
                       L 118 ${legEndY}
                       L 142 ${legEndY}
                       L ${pantsBottomRightOuter} ${pantsBottom} Z`}
                    fill="#fad5c8"
                    stroke="#1a1a1a"
                    strokeWidth="2"
                />

                {/* Pants */}
                <path
                    className="part"
                    d={`M ${pantsLeft} ${pantsTop}
                       L ${pantsBottomLeftOuter} ${pantsBottom}
                       L ${pantsBottomLeftInner} ${pantsBottom}
                       L ${85 - (85 - 60) * (kneeWidthFactor - 1)} ${kneeY}
                       L 100 ${kneeY}
                       L ${115 + (140 - 115) * (kneeWidthFactor - 1)} ${kneeY}
                       L ${pantsBottomRightInner} ${pantsBottom}
                       L ${pantsBottomRightOuter} ${pantsBottom}
                       L ${pantsRight} ${pantsTop}
                       Z`}
                    fill={parts.pants}
                    onClick={() => onApplyColor('pants')}
                />

                {/* Shoes - Left */}
                <path
                    className="part"
                    d={`M ${58 - 5 * (shoeWidthFactor - 1)} ${legEndY}
                        L ${58 - 10 * shoeWidthFactor} ${legEndY + 15 * shoeThicknessFactor}
                        Q ${58 - 12 * shoeWidthFactor} ${legEndY + 20 * shoeThicknessFactor} ${58 - 5 * shoeWidthFactor} ${legEndY + 20 * shoeThicknessFactor}
                        L ${82 + 5 * shoeWidthFactor} ${legEndY + 20 * shoeThicknessFactor}
                        Q ${82 + 12 * shoeWidthFactor} ${legEndY + 20 * shoeThicknessFactor} ${82 + 10 * shoeWidthFactor} ${legEndY + 15 * shoeThicknessFactor}
                        L ${82 + 5 * (shoeWidthFactor - 1)} ${legEndY} Z`}
                    fill={parts.shoes}
                    onClick={() => onApplyColor('shoes')}
                />
                {/* Shoes - Right */}
                <path
                    className="part"
                    d={`M ${118 - 5 * (shoeWidthFactor - 1)} ${legEndY}
                        L ${118 - 10 * shoeWidthFactor} ${legEndY + 15 * shoeThicknessFactor}
                        Q ${118 - 12 * shoeWidthFactor} ${legEndY + 20 * shoeThicknessFactor} ${118 - 5 * shoeWidthFactor} ${legEndY + 20 * shoeThicknessFactor}
                        L ${142 + 5 * shoeWidthFactor} ${legEndY + 20 * shoeThicknessFactor}
                        Q ${142 + 12 * shoeWidthFactor} ${legEndY + 20 * shoeThicknessFactor} ${142 + 10 * shoeWidthFactor} ${legEndY + 15 * shoeThicknessFactor}
                        L ${142 + 5 * (shoeWidthFactor - 1)} ${legEndY} Z`}
                    fill={parts.shoes}
                    onClick={() => onApplyColor('shoes')}
                />
            </svg>
        );
    }

    function App() {
        const [selectedHue, setSelectedHue] = useState(0);
        const [selectedSat, setSelectedSat] = useState(100);
        const [selectedLight, setSelectedLight] = useState(55);
        const [palette, setPalette] = useState([]);
        const [selectedPaletteIdx, setSelectedPaletteIdx] = useState(null);
        const [humanParts, setHumanParts] = useState(DEFAULT_PARTS);
        const [bodyCustom, setBodyCustom] = useState(DEFAULT_BODY_CUSTOM);
        const [hexInput, setHexInput] = useState('');
        const [isEditingHex, setIsEditingHex] = useState(false);
        const saveTimeoutRef = useRef(null);

        const currentColor = hslToHex(selectedHue, selectedSat, selectedLight);

        // Load
        useEffect(() => {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (data.palette) setPalette(data.palette);
                    if (data.humanParts) {
                        // Merge with defaults to handle missing keys
                        setHumanParts({ ...DEFAULT_PARTS, ...data.humanParts });
                    }
                    if (data.bodyCustom) {
                        setBodyCustom({ ...DEFAULT_BODY_CUSTOM, ...data.bodyCustom });
                    }
                    if (data.selectedHue !== undefined) setSelectedHue(data.selectedHue);
                    if (data.selectedSat !== undefined) setSelectedSat(data.selectedSat);
                    if (data.selectedLight !== undefined) setSelectedLight(data.selectedLight);
                } catch (e) {}
            }
        }, []);

        // Save
        const saveData = useCallback(() => {
            const data = { palette, humanParts, bodyCustom, selectedHue, selectedSat, selectedLight };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }, [palette, humanParts, bodyCustom, selectedHue, selectedSat, selectedLight]);

        useEffect(() => {
            if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
            saveTimeoutRef.current = setTimeout(saveData, 300);
            return () => { if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current); };
        }, [saveData]);

        const addToPalette = () => {
            if (!palette.includes(currentColor)) {
                setPalette([...palette, currentColor]);
            }
        };

        const removeFromPalette = (idx) => {
            setPalette(palette.filter((_, i) => i !== idx));
            if (selectedPaletteIdx === idx) setSelectedPaletteIdx(null);
        };

        const applyColorToPart = (part) => {
            setHumanParts({ ...humanParts, [part]: currentColor });
        };

        const resetHuman = () => {
            setHumanParts(DEFAULT_PARTS);
            setBodyCustom(DEFAULT_BODY_CUSTOM);
        };

        const copyColor = async (color) => {
            try { await navigator.clipboard.writeText(color); } catch (e) {}
        };

        const selectColorFromHex = (hex) => {
            const hsl = hexToHsl(hex);
            if (hsl) {
                setSelectedHue(Math.round(hsl.h / 30) * 30 % 360);
                setSelectedSat(hsl.s);
                setSelectedLight(hsl.l);
            }
        };

        const PART_NAMES = {
            hair: '髪',
            outer: 'アウター',
            inner: 'インナー',
            pants: 'パンツ',
            shoes: 'シューズ',
        };

        const updateBodyCustom = (key, value) => {
            setBodyCustom({ ...bodyCustom, [key]: value });
        };

        const CUSTOM_OPTIONS = {
            neckline: { label: 'ネックライン', options: [
                { value: 'crew', label: 'クルー' },
                { value: 'v', label: 'V' },
                { value: 'high', label: 'ハイ' }
            ]},
            sleeveLength: { label: '袖の長さ', options: [
                { value: 'tank', label: 'タンク' },
                { value: 'sleeveless', label: 'ノースリ' },
                { value: 'half', label: '半袖' },
                { value: 'five', label: '5部' },
                { value: 'seven', label: '7部' },
                { value: 'nine', label: '9部' },
                { value: 'long', label: '長袖' }
            ]},
            sleeveWidth: { label: '袖の太さ', options: [
                { value: 'narrow', label: '細め' },
                { value: 'normal', label: '標準' },
                { value: 'wide', label: '太め' }
            ]},
            torsoLength: { label: '上半身の長さ', options: [
                { value: 'short', label: '短め' },
                { value: 'normal', label: '標準' },
                { value: 'long', label: '長め' }
            ]},
            torsoWidth: { label: '上半身の太さ', options: [
                { value: 'narrow', label: '細め' },
                { value: 'normal', label: '標準' },
                { value: 'wide', label: '太め' }
            ]},
            pantsWidth: { label: 'パンツの太さ', options: [
                { value: 'skinny', label: 'スキニー' },
                { value: 'normal', label: '標準' },
                { value: 'wide', label: 'ワイド' }
            ]},
            pantsLength: { label: 'パンツの丈', options: [
                { value: 'shorts', label: 'ショーツ' },
                { value: 'five', label: '5分丈' },
                { value: 'cropped', label: 'クロップド' },
                { value: 'full', label: '長ズボン' }
            ]},
            pantsHemType: { label: 'パンツの裾', options: [
                { value: 'tapered', label: 'テーパード' },
                { value: 'straight', label: 'ストレート' },
                { value: 'wide', label: 'ワイド' },
                { value: 'flare', label: 'フレア' },
                { value: 'barrel', label: 'バレル' }
            ]},
            kneePosition: { label: '膝の位置', options: [
                { value: 'high', label: '高め' },
                { value: 'normal', label: '標準' },
                { value: 'low', label: '低め' }
            ]},
            shoeWidth: { label: '靴の幅', options: [
                { value: 'narrow', label: '細め' },
                { value: 'normal', label: '標準' },
                { value: 'wide', label: '太め' }
            ]},
            shoeThickness: { label: '靴の厚み', options: [
                { value: 'thin', label: '薄め' },
                { value: 'normal', label: '標準' },
                { value: 'thick', label: '厚め' }
            ]},
        };

        // Hue wheel positions
        const wheelCenter = 90;
        const wheelRadius = 65;

        return (
            <>
                <header>
                    <div className="header-content">
                        <div>
                            <span className="logo">COLOR</span>
                            <span className="logo-sub">PICKER</span>
                        </div>
                        <span className="save-status">自動保存</span>
                    </div>
                </header>

                <main>
                    <div className="panel">
                        <div className="panel-header">Color</div>
                        <div className="panel-content">
                            <div className="section-label">Hue Wheel (色相環)</div>
                            <div className="hue-wheel-container">
                                <div className="hue-wheel">
                                    {HUES.map((hue) => {
                                        const pos = getHuePosition(hue, wheelRadius, wheelCenter, wheelCenter);
                                        return (
                                            <button
                                                key={hue}
                                                className={`hue-segment ${selectedHue === hue ? 'selected' : ''}`}
                                                style={{
                                                    background: hslToHex(hue, 100, 50),
                                                    left: pos.x - 18,
                                                    top: pos.y - 18,
                                                }}
                                                onClick={() => setSelectedHue(hue)}
                                            />
                                        );
                                    })}
                                    <div className="hue-center">
                                        <button
                                            className={`hue-center-btn white ${selectedSat === 0 && selectedLight === 100 ? 'selected' : ''}`}
                                            onClick={() => { setSelectedSat(0); setSelectedLight(100); }}
                                        />
                                        <button
                                            className={`hue-center-btn black ${selectedSat === 0 && selectedLight === 0 ? 'selected' : ''}`}
                                            onClick={() => { setSelectedSat(0); setSelectedLight(0); }}
                                        />
                                    </div>
                                </div>
                            </div>

                            <div className="section-label">Tone (トーン)</div>
                            <div className="tone-container" style={{ marginLeft: '50px', marginBottom: '30px' }}>
                                <div className="tone-axis vertical">
                                    <span>明るい</span>
                                    <span className="tone-arrow">↑</span>
                                    <span>明度</span>
                                    <span className="tone-arrow">↓</span>
                                    <span>暗い</span>
                                </div>
                                <div className="tone-grid">
                                    {LIGHTNESSES.map((l) =>
                                        SATURATIONS.map((s) => (
                                            <button
                                                key={`${s}-${l}`}
                                                className={`tone-btn ${selectedSat === s && selectedLight === l ? 'selected' : ''}`}
                                                style={{ background: hslToHex(selectedHue, s, l) }}
                                                onClick={() => { setSelectedSat(s); setSelectedLight(l); }}
                                            />
                                        ))
                                    )}
                                </div>
                                <div className="tone-axis horizontal">
                                    <span>鮮やか ←</span>
                                    <span>彩度</span>
                                    <span>→ 濁り</span>
                                </div>
                            </div>

                            <div className="current-color">
                                <div className="current-swatch" style={{ background: currentColor }} />
                                <div className="current-info">
                                    <input
                                        type="text"
                                        className="color-code-input"
                                        value={isEditingHex ? hexInput : currentColor.toUpperCase()}
                                        onChange={(e) => {
                                            setHexInput(e.target.value);
                                        }}
                                        onFocus={(e) => {
                                            setIsEditingHex(true);
                                            setHexInput(currentColor.toUpperCase());
                                            e.target.select();
                                        }}
                                        onBlur={() => {
                                            selectColorFromHex(hexInput);
                                            setIsEditingHex(false);
                                        }}
                                        onKeyDown={(e) => {
                                            if (e.key === 'Enter') {
                                                selectColorFromHex(hexInput);
                                                setIsEditingHex(false);
                                                e.target.blur();
                                            }
                                        }}
                                    />
                                    <div className="hsl-info">
                                        <div className="hsl-item">
                                            <div className="hsl-label">色相 H</div>
                                            <div className="hsl-value">{selectedHue}°</div>
                                        </div>
                                        <div className="hsl-item">
                                            <div className="hsl-label">彩度 S</div>
                                            <div className="hsl-value">{selectedSat}%</div>
                                        </div>
                                        <div className="hsl-item">
                                            <div className="hsl-label">明度 L</div>
                                            <div className="hsl-value">{selectedLight}%</div>
                                        </div>
                                    </div>
                                </div>
                            </div>

                            <div className="section-label">Palette (パレット)</div>
                            <div className="palette">
                                {palette.map((color, i) => (
                                    <div
                                        key={i}
                                        className={`palette-swatch ${selectedPaletteIdx === i ? 'selected' : ''}`}
                                        style={{ background: color }}
                                        onClick={() => { setSelectedPaletteIdx(i); selectColorFromHex(color); }}
                                    >
                                        <span className="delete" onClick={(e) => { e.stopPropagation(); removeFromPalette(i); }}>×</span>
                                    </div>
                                ))}
                                <button className="add-btn" onClick={addToPalette}>+</button>
                            </div>
                        </div>
                    </div>

                    <div className="panel">
                        <div className="panel-header">Outfit Preview</div>
                        <div className="panel-content">
                            <div className="human-container">
                                <HumanFigure
                                    parts={humanParts}
                                    onApplyColor={applyColorToPart}
                                    bodyCustom={bodyCustom}
                                />
                                <div style={{ marginTop: '0.5rem', fontSize: '0.7rem', color: '#666', textAlign: 'center' }}>
                                    クリックで色を適用
                                </div>
                                <button className="reset-btn" onClick={resetHuman}>リセット</button>
                            </div>
                        </div>
                    </div>

                    <div className="panel">
                        <div className="panel-header">Parts</div>
                        <div className="panel-content" style={{ maxHeight: '600px', overflowY: 'auto' }}>
                            <div style={{ marginBottom: '1.5rem' }}>
                                <div style={{ fontSize: '0.7rem', fontWeight: 'bold', marginBottom: '0.8rem' }}>カラー</div>
                                {Object.entries(PART_NAMES).map(([key, name]) => (
                                    <div key={key} style={{ marginBottom: '0.8rem' }}>
                                        <div className="section-label">{name}</div>
                                        <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                            <div style={{
                                                width: 30, height: 30,
                                                background: humanParts[key],
                                                border: '3px solid var(--text-dark)',
                                            }} />
                                            <span
                                                style={{ fontSize: '0.75rem', cursor: 'pointer' }}
                                                onClick={() => copyColor(humanParts[key])}
                                            >
                                                {humanParts[key].toUpperCase()}
                                            </span>
                                        </div>
                                    </div>
                                ))}
                            </div>

                            <div style={{ borderTop: '2px dashed #ccc', paddingTop: '1rem' }}>
                                <div style={{ fontSize: '0.7rem', fontWeight: 'bold', marginBottom: '0.8rem' }}>カスタマイズ</div>
                                {Object.entries(CUSTOM_OPTIONS).map(([key, config]) => (
                                    <div key={key} className="custom-control">
                                        <div className="section-label">{config.label}</div>
                                        <div className="custom-buttons">
                                            {config.options.map(opt => (
                                                <button
                                                    key={opt.value}
                                                    className={`custom-btn ${bodyCustom[key] === opt.value ? 'active' : ''}`}
                                                    onClick={() => updateBodyCustom(key, opt.value)}
                                                >
                                                    {opt.label}
                                                </button>
                                            ))}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    </div>
                </main>
            </>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
