<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Picker</title>
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --bg-secondary: #1a1a1a;
            --accent-yellow: #ffde03;
            --accent-red: #ff2e63;
            --accent-blue: #08d9d6;
            --accent-green: #9dff00;
            --accent-purple: #6c5ce7;
            --text-dark: #1a1a1a;
            --text-light: #f5f0e6;
            --border-weight: 4px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg-primary);
            min-height: 100vh;
            background-image:
                repeating-linear-gradient(0deg, transparent, transparent 50px, rgba(0,0,0,0.03) 50px, rgba(0,0,0,0.03) 51px),
                repeating-linear-gradient(90deg, transparent, transparent 50px, rgba(0,0,0,0.03) 50px, rgba(0,0,0,0.03) 51px);
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none;
            opacity: 0.3;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
        }

        header {
            padding: 1rem 2rem;
            border-bottom: var(--border-weight) solid var(--text-dark);
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            max-width: 1400px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(1.5rem, 4vw, 2rem);
            color: var(--text-dark);
            text-transform: uppercase;
            position: relative;
        }

        .logo::before {
            content: 'COLOR';
            position: absolute;
            left: 3px; top: 3px;
            color: var(--accent-purple);
            z-index: -1;
        }

        .logo-sub {
            font-size: 0.7rem;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.2rem 0.6rem;
            margin-left: 0.5rem;
        }

        .save-status {
            font-size: 0.7rem;
            padding: 0.3rem 0.6rem;
            border: 2px solid var(--text-dark);
            background: var(--accent-green);
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1.5rem;
            display: grid;
            grid-template-columns: 320px 1fr 200px;
            gap: 1.5rem;
        }

        @media (max-width: 1000px) {
            main { grid-template-columns: 1fr; }
        }

        .panel {
            border: var(--border-weight) solid var(--text-dark);
            background: white;
            box-shadow: 6px 6px 0 var(--text-dark);
        }

        .panel-header {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.5rem 1rem;
        }

        .panel-content {
            padding: 1rem;
        }

        /* Hue Wheel */
        .hue-wheel-container {
            display: flex;
            justify-content: center;
            margin-bottom: 1rem;
        }

        .hue-wheel {
            position: relative;
            width: 180px;
            height: 180px;
        }

        .hue-segment {
            position: absolute;
            width: 36px;
            height: 36px;
            border: 3px solid var(--text-dark);
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .hue-segment:hover {
            transform: scale(1.15);
            z-index: 10;
        }

        .hue-segment.selected {
            box-shadow: 0 0 0 3px white, 0 0 0 6px var(--text-dark);
            z-index: 11;
        }

        /* Tone Grid */
        .tone-container {
            position: relative;
            margin-bottom: 1rem;
        }

        .tone-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 4px;
        }

        .tone-axis {
            position: absolute;
            font-size: 0.55rem;
            color: #666;
            display: flex;
            align-items: center;
            gap: 2px;
        }

        .tone-axis.horizontal {
            bottom: -18px;
            left: 0;
            right: 0;
            justify-content: space-between;
        }

        .tone-axis.vertical {
            top: 0;
            bottom: 0;
            left: -45px;
            flex-direction: column;
            justify-content: space-between;
        }

        .tone-arrow {
            font-size: 0.7rem;
        }

        .tone-btn {
            aspect-ratio: 1;
            border: 2px solid var(--text-dark);
            cursor: pointer;
            transition: transform 0.1s;
        }

        .tone-btn:hover {
            transform: scale(1.15);
            z-index: 1;
        }

        .tone-btn.selected {
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--text-dark);
        }

        /* Current Color */
        .current-color {
            border: 3px solid var(--text-dark);
            padding: 0.8rem;
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 1rem;
        }

        .current-swatch {
            width: 50px;
            height: 50px;
            border: 3px solid var(--text-dark);
        }

        .current-info { flex: 1; font-size: 0.8rem; }

        .color-code {
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .color-code:hover { text-decoration: underline; }

        /* Palette */
        .palette {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            min-height: 50px;
        }

        .palette-swatch {
            width: 36px;
            height: 36px;
            border: 3px solid var(--text-dark);
            cursor: pointer;
            position: relative;
            transition: transform 0.1s;
        }

        .palette-swatch:hover { transform: scale(1.1); z-index: 1; }

        .palette-swatch.selected {
            box-shadow: 0 0 0 2px white, 0 0 0 4px var(--accent-purple);
        }

        .palette-swatch .delete {
            position: absolute;
            top: -8px; right: -8px;
            width: 18px; height: 18px;
            background: var(--accent-red);
            color: white;
            border: 2px solid var(--text-dark);
            border-radius: 50%;
            font-size: 10px;
            cursor: pointer;
            display: none;
            align-items: center;
            justify-content: center;
        }

        .palette-swatch:hover .delete { display: flex; }

        .add-btn {
            width: 36px;
            height: 36px;
            border: 3px dashed var(--text-dark);
            background: var(--bg-primary);
            cursor: pointer;
            font-size: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .add-btn:hover { background: var(--accent-yellow); }

        /* Human Figure */
        .human-container {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .human-svg {
            width: 200px;
            height: 340px;
            margin: 1rem 0;
        }

        .human-svg .part {
            cursor: pointer;
            transition: filter 0.15s, stroke-width 0.15s;
            stroke: var(--text-dark);
            stroke-width: 2;
        }

        .human-svg .part:hover {
            filter: brightness(1.1);
        }

        .human-svg .part.selected {
            stroke-width: 4;
            filter: drop-shadow(0 0 6px var(--accent-purple));
        }

        .part-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 4px;
            justify-content: center;
        }

        .part-btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            padding: 0.3rem 0.5rem;
            border: 2px solid var(--text-dark);
            background: white;
            cursor: pointer;
        }

        .part-btn:hover { background: var(--accent-yellow); }
        .part-btn.selected { background: var(--accent-purple); color: white; }

        .apply-btn {
            margin-top: 0.8rem;
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.7rem;
            padding: 0.5rem 1rem;
            border: 3px solid var(--text-dark);
            background: var(--accent-green);
            cursor: pointer;
            text-transform: uppercase;
        }

        .apply-btn:hover {
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--text-dark);
        }

        .reset-btn {
            margin-top: 0.5rem;
            font-size: 0.65rem;
            padding: 0.3rem 0.6rem;
            border: 2px solid var(--text-dark);
            background: white;
            cursor: pointer;
        }

        .reset-btn:hover { background: var(--accent-red); color: white; }

        .section-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            color: #666;
            margin-bottom: 0.5rem;
            letter-spacing: 0.05em;
        }
    </style>
</head>
<body>
<div class="noise-overlay"></div>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useCallback, useRef } = React;

    const STORAGE_KEY = 'color_picker_data';

    // 12 Hue colors (30 degree steps)
    const HUES = [0, 30, 60, 90, 120, 150, 180, 210, 240, 270, 300, 330];

    // Tone grid
    const SATURATIONS = [100, 75, 50, 25, 10];
    const LIGHTNESSES = [85, 70, 55, 40, 25];

    // Default human parts colors
    const DEFAULT_PARTS = {
        hair: '#2d2d2d',
        outer: '#8b7355',
        inner: '#f5f5f5',
        pants: '#4a4a4a',
        shoes: '#2d2d2d',
    };

    function hslToHex(h, s, l) {
        const hDecimal = l / 100;
        const a = (s * Math.min(hDecimal, 1 - hDecimal)) / 100;
        const f = (n) => {
            const k = (n + h / 30) % 12;
            const color = hDecimal - a * Math.max(Math.min(k - 3, 9 - k, 1), -1);
            return Math.round(255 * color).toString(16).padStart(2, '0');
        };
        return `#${f(0)}${f(8)}${f(4)}`;
    }

    // Calculate position on circle
    function getHuePosition(hue, radius, centerX, centerY) {
        const angle = (hue - 90) * (Math.PI / 180);
        return {
            x: centerX + radius * Math.cos(angle),
            y: centerY + radius * Math.sin(angle),
        };
    }

    function HumanFigure({ parts, selectedPart, onSelectPart }) {
        return (
            <svg className="human-svg" viewBox="0 0 200 340">
                {/* Hair */}
                <ellipse
                    className={`part ${selectedPart === 'hair' ? 'selected' : ''}`}
                    cx="100" cy="35" rx="38" ry="30"
                    fill={parts.hair}
                    onClick={() => onSelectPart('hair')}
                />
                {/* Head/Face */}
                <ellipse cx="100" cy="55" rx="32" ry="35" fill="#fad5c8" stroke="#1a1a1a" strokeWidth="2" />
                {/* Eyes */}
                <circle cx="88" cy="50" r="3" fill="#1a1a1a" />
                <circle cx="112" cy="50" r="3" fill="#1a1a1a" />
                {/* Mouth */}
                <path d="M 92 65 Q 100 72 108 65" fill="none" stroke="#e88" strokeWidth="2" />
                {/* Cheeks */}
                <ellipse cx="78" cy="58" rx="6" ry="4" fill="#fbb" opacity="0.5" />
                <ellipse cx="122" cy="58" rx="6" ry="4" fill="#fbb" opacity="0.5" />

                {/* Outer (Cardigan/Jacket) - Left side */}
                <path
                    className={`part ${selectedPart === 'outer' ? 'selected' : ''}`}
                    d="M 55 95
                       Q 50 100 48 120
                       L 48 180
                       Q 48 185 55 185
                       L 70 185
                       L 70 95
                       Z"
                    fill={parts.outer}
                    onClick={() => onSelectPart('outer')}
                />
                {/* Outer - Right side */}
                <path
                    className={`part ${selectedPart === 'outer' ? 'selected' : ''}`}
                    d="M 145 95
                       Q 150 100 152 120
                       L 152 180
                       Q 152 185 145 185
                       L 130 185
                       L 130 95
                       Z"
                    fill={parts.outer}
                    onClick={() => onSelectPart('outer')}
                />
                {/* Left arm */}
                <path
                    className={`part ${selectedPart === 'outer' ? 'selected' : ''}`}
                    d="M 48 120 L 35 175 Q 33 185 40 185 L 50 185 L 55 130 Z"
                    fill={parts.outer}
                    onClick={() => onSelectPart('outer')}
                />
                {/* Right arm */}
                <path
                    className={`part ${selectedPart === 'outer' ? 'selected' : ''}`}
                    d="M 152 120 L 165 175 Q 167 185 160 185 L 150 185 L 145 130 Z"
                    fill={parts.outer}
                    onClick={() => onSelectPart('outer')}
                />
                {/* Hands */}
                <ellipse cx="40" cy="190" rx="10" ry="8" fill="#fad5c8" stroke="#1a1a1a" strokeWidth="2" />
                <ellipse cx="160" cy="190" rx="10" ry="8" fill="#fad5c8" stroke="#1a1a1a" strokeWidth="2" />

                {/* Inner (T-shirt) */}
                <path
                    className={`part ${selectedPart === 'inner' ? 'selected' : ''}`}
                    d="M 70 95
                       Q 72 90 100 88
                       Q 128 90 130 95
                       L 130 185
                       L 70 185
                       Z"
                    fill={parts.inner}
                    onClick={() => onSelectPart('inner')}
                />

                {/* Pants */}
                <path
                    className={`part ${selectedPart === 'pants' ? 'selected' : ''}`}
                    d="M 60 185
                       L 55 280
                       L 80 280
                       L 85 210
                       L 100 210
                       L 115 210
                       L 120 280
                       L 145 280
                       L 140 185
                       Z"
                    fill={parts.pants}
                    onClick={() => onSelectPart('pants')}
                />

                {/* Shoes - Left */}
                <path
                    className={`part ${selectedPart === 'shoes' ? 'selected' : ''}`}
                    d="M 52 280 L 48 310 Q 45 320 55 320 L 85 320 Q 90 320 88 310 L 83 280 Z"
                    fill={parts.shoes}
                    onClick={() => onSelectPart('shoes')}
                />
                {/* Shoes - Right */}
                <path
                    className={`part ${selectedPart === 'shoes' ? 'selected' : ''}`}
                    d="M 117 280 L 112 310 Q 110 320 115 320 L 145 320 Q 155 320 152 310 L 148 280 Z"
                    fill={parts.shoes}
                    onClick={() => onSelectPart('shoes')}
                />
            </svg>
        );
    }

    function App() {
        const [selectedHue, setSelectedHue] = useState(0);
        const [selectedSat, setSelectedSat] = useState(100);
        const [selectedLight, setSelectedLight] = useState(55);
        const [palette, setPalette] = useState([]);
        const [selectedPaletteIdx, setSelectedPaletteIdx] = useState(null);
        const [humanParts, setHumanParts] = useState(DEFAULT_PARTS);
        const [selectedPart, setSelectedPart] = useState('outer');
        const saveTimeoutRef = useRef(null);

        const currentColor = hslToHex(selectedHue, selectedSat, selectedLight);

        // Load
        useEffect(() => {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    if (data.palette) setPalette(data.palette);
                    if (data.humanParts) {
                        // Merge with defaults to handle missing keys
                        setHumanParts({ ...DEFAULT_PARTS, ...data.humanParts });
                    }
                    if (data.selectedHue !== undefined) setSelectedHue(data.selectedHue);
                    if (data.selectedSat !== undefined) setSelectedSat(data.selectedSat);
                    if (data.selectedLight !== undefined) setSelectedLight(data.selectedLight);
                } catch (e) {}
            }
        }, []);

        // Save
        const saveData = useCallback(() => {
            const data = { palette, humanParts, selectedHue, selectedSat, selectedLight };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        }, [palette, humanParts, selectedHue, selectedSat, selectedLight]);

        useEffect(() => {
            if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current);
            saveTimeoutRef.current = setTimeout(saveData, 300);
            return () => { if (saveTimeoutRef.current) clearTimeout(saveTimeoutRef.current); };
        }, [saveData]);

        const addToPalette = () => {
            if (!palette.includes(currentColor)) {
                setPalette([...palette, currentColor]);
            }
        };

        const removeFromPalette = (idx) => {
            setPalette(palette.filter((_, i) => i !== idx));
            if (selectedPaletteIdx === idx) setSelectedPaletteIdx(null);
        };

        const applyToHuman = () => {
            setHumanParts({ ...humanParts, [selectedPart]: currentColor });
        };

        const resetHuman = () => {
            setHumanParts(DEFAULT_PARTS);
        };

        const copyColor = async (color) => {
            try { await navigator.clipboard.writeText(color); } catch (e) {}
        };

        const PART_NAMES = {
            hair: '髪',
            outer: 'アウター',
            inner: 'インナー',
            pants: 'パンツ',
            shoes: 'シューズ',
        };

        // Hue wheel positions
        const wheelCenter = 90;
        const wheelRadius = 65;

        return (
            <>
                <header>
                    <div className="header-content">
                        <div>
                            <span className="logo">COLOR</span>
                            <span className="logo-sub">PICKER</span>
                        </div>
                        <span className="save-status">自動保存</span>
                    </div>
                </header>

                <main>
                    <div className="panel">
                        <div className="panel-header">Color</div>
                        <div className="panel-content">
                            <div className="section-label">Hue Wheel (色相環)</div>
                            <div className="hue-wheel-container">
                                <div className="hue-wheel">
                                    {HUES.map((hue) => {
                                        const pos = getHuePosition(hue, wheelRadius, wheelCenter, wheelCenter);
                                        return (
                                            <button
                                                key={hue}
                                                className={`hue-segment ${selectedHue === hue ? 'selected' : ''}`}
                                                style={{
                                                    background: hslToHex(hue, 100, 50),
                                                    left: pos.x - 18,
                                                    top: pos.y - 18,
                                                }}
                                                onClick={() => setSelectedHue(hue)}
                                            />
                                        );
                                    })}
                                </div>
                            </div>

                            <div className="section-label">Tone (トーン)</div>
                            <div className="tone-container" style={{ marginLeft: '50px', marginBottom: '30px' }}>
                                <div className="tone-axis vertical">
                                    <span>明るい</span>
                                    <span className="tone-arrow">↑</span>
                                    <span>明度</span>
                                    <span className="tone-arrow">↓</span>
                                    <span>暗い</span>
                                </div>
                                <div className="tone-grid">
                                    {LIGHTNESSES.map((l) =>
                                        SATURATIONS.map((s) => (
                                            <button
                                                key={`${s}-${l}`}
                                                className={`tone-btn ${selectedSat === s && selectedLight === l ? 'selected' : ''}`}
                                                style={{ background: hslToHex(selectedHue, s, l) }}
                                                onClick={() => { setSelectedSat(s); setSelectedLight(l); }}
                                            />
                                        ))
                                    )}
                                </div>
                                <div className="tone-axis horizontal">
                                    <span>鮮やか ←</span>
                                    <span>彩度</span>
                                    <span>→ 淡い</span>
                                </div>
                            </div>

                            <div className="current-color">
                                <div className="current-swatch" style={{ background: currentColor }} />
                                <div className="current-info">
                                    <div className="color-code" onClick={() => copyColor(currentColor)}>
                                        {currentColor.toUpperCase()}
                                    </div>
                                    <div style={{ fontSize: '0.65rem', color: '#888' }}>
                                        H:{selectedHue} S:{selectedSat} L:{selectedLight}
                                    </div>
                                </div>
                            </div>

                            <div className="section-label">Palette (パレット)</div>
                            <div className="palette">
                                {palette.map((color, i) => (
                                    <div
                                        key={i}
                                        className={`palette-swatch ${selectedPaletteIdx === i ? 'selected' : ''}`}
                                        style={{ background: color }}
                                        onClick={() => { setSelectedPaletteIdx(i); copyColor(color); }}
                                    >
                                        <span className="delete" onClick={(e) => { e.stopPropagation(); removeFromPalette(i); }}>×</span>
                                    </div>
                                ))}
                                <button className="add-btn" onClick={addToPalette}>+</button>
                            </div>
                        </div>
                    </div>

                    <div className="panel">
                        <div className="panel-header">Outfit Preview</div>
                        <div className="panel-content">
                            <div className="human-container">
                                <HumanFigure
                                    parts={humanParts}
                                    selectedPart={selectedPart}
                                    onSelectPart={setSelectedPart}
                                />

                                <div className="part-buttons">
                                    {Object.entries(PART_NAMES).map(([key, name]) => (
                                        <button
                                            key={key}
                                            className={`part-btn ${selectedPart === key ? 'selected' : ''}`}
                                            onClick={() => setSelectedPart(key)}
                                        >
                                            {name}
                                        </button>
                                    ))}
                                </div>

                                <button className="apply-btn" onClick={applyToHuman}>
                                    {PART_NAMES[selectedPart]}に適用
                                </button>
                                <button className="reset-btn" onClick={resetHuman}>リセット</button>
                            </div>
                        </div>
                    </div>

                    <div className="panel">
                        <div className="panel-header">Parts</div>
                        <div className="panel-content">
                            {Object.entries(PART_NAMES).map(([key, name]) => (
                                <div key={key} style={{ marginBottom: '0.8rem' }}>
                                    <div className="section-label">{name}</div>
                                    <div style={{ display: 'flex', alignItems: 'center', gap: '0.5rem' }}>
                                        <div style={{
                                            width: 30, height: 30,
                                            background: humanParts[key],
                                            border: '3px solid var(--text-dark)',
                                        }} />
                                        <span
                                            style={{ fontSize: '0.75rem', cursor: 'pointer' }}
                                            onClick={() => copyColor(humanParts[key])}
                                        >
                                            {humanParts[key].toUpperCase()}
                                        </span>
                                    </div>
                                </div>
                            ))}
                        </div>
                    </div>
                </main>
            </>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
