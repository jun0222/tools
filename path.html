<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tools</title>
  <link rel="icon" href="img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
  <link href="path/styles.css" rel="stylesheet" />
</head>
<body>
  <!-- 起動アニメーション -->
  <div class="boot-screen">
    <div class="boot-command">
      <span class="boot-prompt">$</span>
      <span class="boot-text">
        <span>t</span><span>o</span><span>o</span><span>l</span><span>s</span>
      </span>
      <span class="boot-cursor"></span>
    </div>
    <div class="boot-execute">⏎ Executing...</div>
  </div>

  <div class="terminal-container">
    <div class="terminal-header">
      <div class="terminal-buttons">
        <span class="terminal-btn btn-close"></span>
        <span class="terminal-btn btn-minimize"></span>
        <span class="terminal-btn btn-maximize"></span>
      </div>
      <div class="terminal-title">tools ~ search</div>
    </div>

    <div class="terminal-body">
      <div class="input-line">
        <span class="prompt">$</span>
        <span class="command-prefix">open</span>
        <input type="text" id="searchInput" placeholder="tool name..." autocomplete="off" autofocus />
      </div>

      <div class="help-hint">
        <span class="hint-key">Enter</span> open
        <span class="hint-key">↑↓</span> navigate
        <span class="hint-key">man</span> all
      </div>

      <div class="results-container" id="resultsContainer">
        <div class="results-list" id="resultsList"></div>
      </div>

      <div class="status-bar">
        <span class="status-left" id="statusLeft">Ready</span>
        <span class="status-right" id="statusRight">0 tools</span>
      </div>
    </div>
  </div>

  <script>
    const tools = [
      { name: "atena", path: "atena" },
      { name: "print", path: "atena/print.html" },
      { name: "gmailq", path: "gmailq" },
      { name: "img2silhouette", path: "img2silhouette" },
      { name: "interval-audio-generator", path: "interval-audio-generator" },
      { name: "nippo", path: "nippo" },
      { name: "colorp", path: "colorp" },
      { name: "giron", path: "giron" },
      { name: "code-memo", path: "code-memo" },
      { name: "jwtd", path: "jwtd" },
      { name: "ango2", path: "ango2" },
      { name: "htmlp", path: "htmlp" },
      { name: "jsonf", path: "jsonf" },
      { name: "progress", path: "progress" },
      { name: "lgtm", path: "lgtm" },
      { name: "shakyo", path: "shakyo" },
      { name: "markdown", path: "markdown" },
      { name: "logo-maker", path: "logo-maker.html" },
      { name: "color", path: "color" },
      { name: "code-review", path: "code-review" },
      { name: "base64", path: "base64" },
      { name: "editor", path: "editor.html" },
      { name: "poketype3", path: "poketype3" },
      { name: "poketype4", path: "poketype4" },
      { name: "favicon", path: "favicon" },
      { name: "poketype2", path: "poketype2" },
      { name: "typing", path: "typing" },
      { name: "curl", path: "curl" },
      { name: "calp", path: "calp" },
      { name: "clipboard-txt", path: "clipboard-txt" },
      { name: "nodev", path: "nodev" },
      { name: "merge_link", path: "merge_link" },
      { name: "ryouri", path: "ryouri.html" },
      { name: "favicon2", path: "favicon2" },
      { name: "htmlf", path: "htmlf" },
      { name: "aa", path: "aa" },
      { name: "anki-automation", path: "anki-automation" },
      { name: "rotation-timer", path: "rotation-timer" },
      { name: "mermaid", path: "mermaid" },
      { name: "anki-card", path: "anki-card" },
      { name: "shoe-size", path: "shoe-size" },
      { name: "todo-priority", path: "todo-priority" },
      { name: "rich-e", path: "rich-e" },
      { name: "nippo2", path: "nippo2" },
      { name: "calp2", path: "calp2" },
      { name: "rand2", path: "rand2" },
      { name: "rand", path: "rand" },
      { name: "testd", path: "testd" },
      { name: "dist", path: "snipet/dist" },
      { name: "dollerd", path: "dollerd" },
      { name: "dist", path: "sh-tool/md2html/dist" },
      { name: "png2svg", path: "png2svg" },
      { name: "ango", path: "ango" },
      { name: "poketype", path: "poketype" },
      { name: "rollp", path: "rollp" },
      { name: "metronome", path: "metronome" },
      { name: "path", path: "path.html" },
      { name: "cheat", path: "cheat" },
      { name: "dev-blog", path: "Dev Blog", url: "https://www.juns-app.com" },
    ];

    const BASE_URL = "https://tools.juns-app.com/";
    let selectedIndex = 0;
    let filteredTools = [];

    const searchInput = document.getElementById("searchInput");
    const resultsList = document.getElementById("resultsList");
    const statusLeft = document.getElementById("statusLeft");
    const statusRight = document.getElementById("statusRight");

    function renderResults(items, highlight = "") {
      resultsList.innerHTML = "";

      if (items.length === 0 && highlight !== "") {
        resultsList.innerHTML = '<div class="no-results">No matching tools found</div>';
        statusRight.textContent = "0 tools";
        return;
      }

      if (items.length === 0) {
        statusRight.textContent = `${tools.length} tools available`;
        return;
      }

      items.forEach((tool, index) => {
        const item = document.createElement("div");
        item.className = `result-item ${index === selectedIndex ? "selected" : ""}`;
        item.dataset.index = index;

        let nameHtml = tool.name;
        if (highlight && highlight.toLowerCase() !== "man") {
          const regex = new RegExp(`(${highlight.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, "gi");
          nameHtml = tool.name.replace(regex, "<mark>$1</mark>");
        }

        item.innerHTML = `
          <span class="result-arrow">${index === selectedIndex ? ">" : " "}</span>
          <span class="result-name">${nameHtml}</span>
          <span class="result-path">${tool.path}</span>
        `;

        item.addEventListener("click", () => openTool(index));
        item.addEventListener("mouseenter", () => {
          selectedIndex = index;
          updateSelection();
        });

        resultsList.appendChild(item);
      });

      statusRight.textContent = `${items.length} tool${items.length !== 1 ? "s" : ""}`;
    }

    function updateSelection() {
      const items = resultsList.querySelectorAll(".result-item");
      items.forEach((item, index) => {
        if (index === selectedIndex) {
          item.classList.add("selected");
          item.querySelector(".result-arrow").textContent = ">";
          item.scrollIntoView({ block: "nearest" });
        } else {
          item.classList.remove("selected");
          item.querySelector(".result-arrow").textContent = " ";
        }
      });
    }

    function filterTools(query) {
      if (query === "") {
        return [];
      }
      if (query.toLowerCase() === "man") {
        statusLeft.textContent = "Showing all tools";
        return [...tools].sort((a, b) => a.name.localeCompare(b.name));
      }
      statusLeft.textContent = "Searching...";

      const q = query.toLowerCase();
      return tools
        .filter(t => t.name.toLowerCase().includes(q) || t.path.toLowerCase().includes(q))
        .sort((a, b) => {
          const aStarts = a.name.toLowerCase().startsWith(q);
          const bStarts = b.name.toLowerCase().startsWith(q);
          if (aStarts && !bStarts) return -1;
          if (!aStarts && bStarts) return 1;
          return a.name.localeCompare(b.name);
        });
    }

    function openTool(index) {
      if (filteredTools[index]) {
        const tool = filteredTools[index];
        const url = tool.url || (BASE_URL + tool.path);
        statusLeft.textContent = `Opening ${tool.name}...`;
        window.open(url, "_blank");
      }
    }

    searchInput.addEventListener("input", (e) => {
      const query = e.target.value.trim();
      selectedIndex = 0;
      filteredTools = filterTools(query);
      renderResults(filteredTools, query);

      if (query === "") {
        statusLeft.textContent = "Ready";
      }
    });

    searchInput.addEventListener("keydown", (e) => {
      if (e.key === "ArrowDown") {
        e.preventDefault();
        if (filteredTools.length > 0) {
          selectedIndex = (selectedIndex + 1) % filteredTools.length;
          updateSelection();
        }
      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        if (filteredTools.length > 0) {
          selectedIndex = (selectedIndex - 1 + filteredTools.length) % filteredTools.length;
          updateSelection();
        }
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (filteredTools.length > 0) {
          openTool(selectedIndex);
        }
      } else if (e.key === "Escape") {
        searchInput.value = "";
        filteredTools = [];
        renderResults([]);
        statusLeft.textContent = "Ready";
      }
    });

    // 初期状態
    renderResults([]);
    statusLeft.textContent = "Ready";

    // ページロード時にフォーカス
    setTimeout(() => {
      searchInput.focus();
    }, 2000);
  </script>
</body>
</html>
