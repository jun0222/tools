<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>メトロノーム</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
        }

        .container {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        h1 {
            font-size: 32px;
            margin-bottom: 30px;
            font-weight: 600;
        }

        .beat-indicator {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            margin: 0 auto 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 48px;
            font-weight: bold;
            transition: all 0.05s ease;
            border: 3px solid rgba(255, 255, 255, 0.3);
        }

        .beat-indicator.active {
            background: rgba(255, 255, 255, 0.9);
            color: #667eea;
            transform: scale(1.1);
            box-shadow: 0 0 30px rgba(255, 255, 255, 0.8);
        }

        .bpm-display {
            font-size: 64px;
            font-weight: bold;
            margin-bottom: 10px;
        }

        .bpm-label {
            font-size: 18px;
            opacity: 0.9;
            margin-bottom: 20px;
        }

        .slider-container {
            margin: 30px 0;
        }

        .slider {
            width: 100%;
            height: 8px;
            border-radius: 5px;
            background: rgba(255, 255, 255, 0.3);
            outline: none;
            -webkit-appearance: none;
        }

        .slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .slider::-moz-range-thumb {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: white;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
        }

        .controls {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 30px;
        }

        .btn {
            padding: 15px 40px;
            font-size: 18px;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        .btn-start {
            background: #4ade80;
            color: white;
        }

        .btn-start:hover {
            background: #22c55e;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn-stop {
            background: #f87171;
            color: white;
        }

        .btn-stop:hover {
            background: #ef4444;
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.3);
        }

        .btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn:disabled:hover {
            transform: none;
        }

        .presets {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .preset-btn {
            padding: 8px 16px;
            font-size: 14px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .preset-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tap-tempo {
            margin-top: 20px;
        }

        .tap-btn {
            padding: 12px 30px;
            font-size: 16px;
            background: rgba(255, 255, 255, 0.2);
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.4);
            border-radius: 30px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .tap-btn:hover {
            background: rgba(255, 255, 255, 0.3);
        }

        .tap-btn:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎵 メトロノーム</h1>

        <div class="beat-indicator" id="beatIndicator">♩</div>

        <div class="bpm-display" id="bpmDisplay">120</div>
        <div class="bpm-label">BPM (Beats Per Minute)</div>

        <div class="slider-container">
            <input type="range" min="40" max="240" value="120" class="slider" id="bpmSlider">
        </div>

        <div class="presets">
            <button class="preset-btn" onclick="setBPM(60)">60</button>
            <button class="preset-btn" onclick="setBPM(80)">80</button>
            <button class="preset-btn" onclick="setBPM(100)">100</button>
            <button class="preset-btn" onclick="setBPM(120)">120</button>
            <button class="preset-btn" onclick="setBPM(140)">140</button>
            <button class="preset-btn" onclick="setBPM(160)">160</button>
        </div>

        <div class="controls">
            <button class="btn btn-start" id="startBtn" onclick="start()">スタート</button>
            <button class="btn btn-stop" id="stopBtn" onclick="stop()" disabled>ストップ</button>
        </div>

        <div class="tap-tempo">
            <button class="tap-btn" onclick="tapTempo()">タップでテンポ設定</button>
        </div>
    </div>

    <script>
        // DOM要素
        const bpmSlider = document.getElementById('bpmSlider');
        const bpmDisplay = document.getElementById('bpmDisplay');
        const beatIndicator = document.getElementById('beatIndicator');
        const startBtn = document.getElementById('startBtn');
        const stopBtn = document.getElementById('stopBtn');

        // メトロノームの状態
        let bpm = 120;
        let isPlaying = false;
        let intervalId = null;
        let audioContext = null;

        // タップテンポ用
        let tapTimes = [];
        const maxTapInterval = 2000; // 2秒以上間隔が空いたらリセット

        // BPM変更時の処理
        bpmSlider.addEventListener('input', (e) => {
            bpm = parseInt(e.target.value);
            bpmDisplay.textContent = bpm;
            saveBPM();

            // 再生中なら再起動
            if (isPlaying) {
                stop();
                start();
            }
        });

        // BPMを設定
        function setBPM(value) {
            bpm = value;
            bpmSlider.value = value;
            bpmDisplay.textContent = value;
            saveBPM();

            // 再生中なら再起動
            if (isPlaying) {
                stop();
                start();
            }
        }

        // メトロノーム開始
        function start() {
            if (isPlaying) return;

            isPlaying = true;
            startBtn.disabled = true;
            stopBtn.disabled = false;

            // AudioContextを初期化
            if (!audioContext) {
                audioContext = new (window.AudioContext || window.webkitAudioContext)();
            }

            // 最初のビートを即座に再生
            playBeat();

            // インターバルで繰り返し
            const interval = 60000 / bpm; // ミリ秒単位のインターバル
            intervalId = setInterval(playBeat, interval);
        }

        // メトロノーム停止
        function stop() {
            if (!isPlaying) return;

            isPlaying = false;
            startBtn.disabled = false;
            stopBtn.disabled = true;

            if (intervalId) {
                clearInterval(intervalId);
                intervalId = null;
            }

            beatIndicator.classList.remove('active');
        }

        // ビートを再生
        function playBeat() {
            // ビジュアルフィードバック
            beatIndicator.classList.add('active');
            setTimeout(() => {
                beatIndicator.classList.remove('active');
            }, 100);

            // 音を再生
            playSound();
        }

        // Web Audio APIで音を生成
        function playSound() {
            if (!audioContext) return;

            const oscillator = audioContext.createOscillator();
            const gainNode = audioContext.createGain();

            oscillator.connect(gainNode);
            gainNode.connect(audioContext.destination);

            // 音の設定
            oscillator.frequency.value = 1000; // 1000Hz
            oscillator.type = 'sine';

            // 音量エンベロープ
            gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
            gainNode.gain.exponentialRampToValueAtTime(0.01, audioContext.currentTime + 0.1);

            // 再生
            oscillator.start(audioContext.currentTime);
            oscillator.stop(audioContext.currentTime + 0.1);
        }

        // タップテンポ機能
        function tapTempo() {
            const now = Date.now();

            // 前回のタップから2秒以上経過していたらリセット
            if (tapTimes.length > 0 && now - tapTimes[tapTimes.length - 1] > maxTapInterval) {
                tapTimes = [];
            }

            tapTimes.push(now);

            // 2回以上タップされたらBPMを計算
            if (tapTimes.length >= 2) {
                // 最後の4回のタップから平均BPMを計算
                const recentTaps = tapTimes.slice(-4);
                const intervals = [];

                for (let i = 1; i < recentTaps.length; i++) {
                    intervals.push(recentTaps[i] - recentTaps[i - 1]);
                }

                const avgInterval = intervals.reduce((a, b) => a + b) / intervals.length;
                const calculatedBPM = Math.round(60000 / avgInterval);

                // BPMの範囲チェック
                if (calculatedBPM >= 40 && calculatedBPM <= 240) {
                    setBPM(calculatedBPM);
                }
            }

            // 10回以上溜まったら古いものを削除
            if (tapTimes.length > 10) {
                tapTimes.shift();
            }
        }

        // BPMをlocalStorageに保存
        function saveBPM() {
            localStorage.setItem('metronome-bpm', bpm);
        }

        // BPMをlocalStorageから読み込み
        function loadBPM() {
            const saved = localStorage.getItem('metronome-bpm');
            if (saved) {
                const value = parseInt(saved);
                if (value >= 40 && value <= 240) {
                    setBPM(value);
                }
            }
        }

        // 初期化
        loadBPM();

        // スペースキーでスタート/ストップ
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                if (isPlaying) {
                    stop();
                } else {
                    start();
                }
            }
        });
    </script>
</body>
</html>
