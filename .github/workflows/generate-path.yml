name: Generate path.html

on:
  schedule:
    # 毎日 9:00 と 21:00 (JST) に実行
    - cron: '0 0 * * *'   # UTC 0:00 = JST 9:00
    - cron: '0 12 * * *'  # UTC 12:00 = JST 21:00
  workflow_dispatch: # 手動実行も可能

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate path.html
        run: |
          # ツール一覧を自動生成
          cat > path.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html lang="ja">
          <head>
            <meta charset="UTF-8">
            <meta name="viewport" content="width=device-width, initial-scale=1.0">
            <title>tools</title>
            <link rel="preconnect" href="https://fonts.googleapis.com">
            <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
            <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Fira+Code:wght@400;500;600&display=swap" rel="stylesheet">
            <link href="path/styles.css" rel="stylesheet" />
          </head>
          <body>
            <!-- 起動アニメーション -->
            <div class="boot-screen">
              <div class="boot-command">
                <span class="boot-prompt">$</span>
                <span class="boot-text">
                  <span>t</span><span>o</span><span>o</span><span>l</span><span>s</span>
                </span>
                <span class="boot-cursor"></span>
              </div>
              <div class="boot-execute">⏎ Executing...</div>
            </div>

            <h1>ツール一覧</h1>
            <ul>
          HTMLEOF

          # index.htmlを持つディレクトリとルートのhtmlファイルを検索
          {
            # index.htmlを持つディレクトリ
            find . -name "index.html" -type f ! -path "./archive/*" ! -path "./node_modules/*" ! -path "./.git/*" | while read -r file; do
              dir=$(dirname "$file" | sed 's|^\./||')
              if [ "$dir" != "." ]; then
                echo "$dir"
              fi
            done

            # ルートレベルの.htmlファイル（path.htmlを除く）
            find . -maxdepth 1 -name "*.html" -type f ! -name "path.html" | while read -r file; do
              basename "$file"
            done
          } | sort -u | while read -r path; do
            echo "    <li><a href=\"https://tools.juns-app.com/${path}\">./${path}</a></li>" >> path.html
          done

          cat >> path.html << 'HTMLEOF'
            </ul>

            <script>
              // ページロード時にリンクを再構築
              document.addEventListener('DOMContentLoaded', function() {
                const ul = document.querySelector('ul');
                const links = Array.from(ul.querySelectorAll('li'));

                // URLからパス部分を抽出してソート用のデータを作成
                const linkData = links.map(li => {
                  const a = li.querySelector('a');
                  const hrefText = a.textContent;
                  const cleanPath = hrefText.replace(/^\.\//, '');
                  const firstChar = cleanPath.charAt(0).toLowerCase();

                  return {
                    element: li,
                    href: a.href,
                    path: cleanPath,
                    firstChar: firstChar,
                    sortKey: cleanPath.toLowerCase()
                  };
                });

                // アルファベット順にソート
                linkData.sort((a, b) => a.sortKey.localeCompare(b.sortKey));

                // カテゴリごとにグループ化
                const categories = {};
                linkData.forEach(item => {
                  const category = item.firstChar;
                  if (!categories[category]) {
                    categories[category] = [];
                  }
                  categories[category].push(item);
                });

                // 既存のulを空にする
                ul.innerHTML = '';

                // カテゴリごとに再構築
                Object.keys(categories).sort().forEach((category, categoryIndex) => {
                  const items = categories[category];

                  // カテゴリセクションを作成
                  const section = document.createElement('div');
                  section.className = `category-section category-${category}`;
                  section.style.animationDelay = `${categoryIndex * 0.1}s`;

                  // カテゴリヘッダーを作成
                  const header = document.createElement('div');
                  header.className = 'category-header';
                  header.textContent = `[${category.toUpperCase()}]`;
                  header.setAttribute('data-count', `${items.length} tools`);
                  section.appendChild(header);

                  // カテゴリ内のリストを作成
                  const categoryUl = document.createElement('ul');

                  items.forEach((item, index) => {
                    const li = document.createElement('li');
                    li.style.animationDelay = `${(categoryIndex * 0.1) + (index * 0.02)}s`;

                    const a = document.createElement('a');
                    a.href = item.href;

                    // URLのベース部分
                    const baseSpan = document.createElement('span');
                    baseSpan.className = 'url-base';
                    baseSpan.textContent = 'https://tools.juns-app.com';

                    // パス部分
                    const pathSpan = document.createElement('span');
                    pathSpan.className = 'url-path';
                    pathSpan.textContent = `/${item.path}`;

                    a.appendChild(baseSpan);
                    a.appendChild(pathSpan);
                    li.appendChild(a);
                    categoryUl.appendChild(li);
                  });

                  section.appendChild(categoryUl);
                  ul.parentElement.insertBefore(section, ul);
                });

                // 元のulを削除
                ul.remove();
              });
            </script>
          </body>
          </html>
          HTMLEOF

      - name: Commit and push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add path.html
          git diff --staged --quiet || git commit -m "chore: auto-generate path.html [skip ci]"
          git push
