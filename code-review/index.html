<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIコードレビュー - Gemini Nano</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>AIコードレビュー (Gemini Nano)</h1>

      <div v-if="!apiAvailable" class="error-message">
        <p>お使いのブラウザでGemini Nano APIが利用できません。</p>
        <p>Chrome Canaryで以下のフラグを有効にしてください：</p>
        <ul>
          <li>chrome://flags/#optimization-guide-on-device-model - Enable</li>
          <li>chrome://flags/#prompt-api-for-gemini-nano - Enable</li>
        </ul>
      </div>

      <div v-else>
        <div class="status-message" v-if="statusMessage">
          {{ statusMessage }}
        </div>

        <div class="input-section">
          <label for="code-input">レビューするコードを入力:</label>
          <textarea
            v-model="codeInput"
            id="code-input"
            placeholder="コードをここに貼り付けてください..."
            rows="15"
            :disabled="isReviewing"
          ></textarea>
        </div>

        <div class="controls">
          <div class="review-type">
            <label for="review-type">レビュー観点:</label>
            <select v-model="reviewType" id="review-type" :disabled="isReviewing">
              <option value="general">総合的なレビュー</option>
              <option value="security">セキュリティ問題</option>
              <option value="performance">パフォーマンス</option>
              <option value="best-practices">ベストプラクティス</option>
              <option value="bugs">潜在的なバグ</option>
            </select>
          </div>

          <button @click="reviewCode" :disabled="!codeInput || isReviewing" class="review-btn">
            {{ isReviewing ? 'レビュー中...' : 'コードをレビュー' }}
          </button>
        </div>

        <div v-if="reviewResult" class="output-section">
          <h2>レビュー結果</h2>
          <div class="review-output">
            <pre>{{ reviewResult }}</pre>
          </div>
        </div>
      </div>
    </div>

    <script>
      const app = new Vue({
        el: "#app",
        data: {
          codeInput: "",
          reviewType: "general",
          reviewResult: "",
          apiAvailable: false,
          isReviewing: false,
          statusMessage: "",
          session: null
        },
        async mounted() {
          await this.checkAPIAvailability();
        },
        methods: {
          async checkAPIAvailability() {
            try {
              if (typeof LanguageModel === 'undefined') {
                this.apiAvailable = false;
                console.error('LanguageModel is not available');
                return;
              }

              this.apiAvailable = true;
              this.statusMessage = 'Gemini Nanoの準備完了！';
            } catch (error) {
              console.error('Error checking API availability:', error);
              this.apiAvailable = false;
            }
          },

          getReviewPrompt() {
            const prompts = {
              general: "あなたは非常に厳しいシニアエンジニアです。以下のコードのバグや改善点を、日本語で簡潔かつ具体的に指摘してください。コード品質、可読性、保守性、潜在的な改善点について包括的にレビューしてください：",
              security: "あなたはセキュリティエキスパートです。以下のコードのセキュリティ脆弱性、潜在的な攻撃のリスク、セキュリティベストプラクティスについて日本語で分析してください：",
              performance: "あなたはパフォーマンスチューニングの専門家です。以下のコードのパフォーマンス最適化、効率性、潜在的なボトルネックについて日本語でレビューしてください：",
              "best-practices": "あなたは経験豊富なアーキテクトです。以下のコードについて、コーディングベストプラクティス、デザインパターン、業界標準に基づいて日本語で改善提案をしてください：",
              bugs: "あなたはバグハンターです。以下のコードの潜在的なバグ、エッジケース、論理エラー、ランタイムエラーについて日本語で詳しく分析してください："
            };

            return prompts[this.reviewType] || prompts.general;
          },

          async reviewCode() {
            this.isReviewing = true;
            this.reviewResult = "";
            this.statusMessage = "コードを分析中...";

            // 前回のセッションがあれば破棄
            if (this.session) {
              this.session.destroy();
              this.session = null;
            }

            try {
              console.log("%c🚀 Gemini Nano を起動中...", "color: #4285F4; font-weight: bold;");

              // セッションの作成（日本語出力と役割を指定）
              this.session = await LanguageModel.create({
                expectedOutputLanguage: 'ja',
                systemPrompt: this.getReviewPrompt()
              });

              console.log("%c🧐 レビュー対象のコード:", "color: #9AA0A6;");
              console.log(this.codeInput);

              // プロンプトの実行
              console.log("%c🤖 レビュー結果:", "color: #34A853; font-weight: bold;");
              const result = await this.session.prompt(`このコードをレビューして改善案を出してください:\n\n\`\`\`\n${this.codeInput}\n\`\`\``);

              this.reviewResult = result;
              console.log(result);
              this.statusMessage = "レビュー完了！";

            } catch (error) {
              console.error("❌ エラーが発生しました:", error);
              this.reviewResult = `エラー: ${error.message}`;
              this.statusMessage = "レビューに失敗しました。";
            } finally {
              this.isReviewing = false;

              // セッションの終了（リソース解放）
              if (this.session) {
                this.session.destroy();
                this.session = null;
              }
            }
          }
        },
        beforeDestroy() {
          // コンポーネント破棄時にセッションをクリーンアップ
          if (this.session) {
            this.session.destroy();
            this.session = null;
          }
        }
      });
    </script>
  </body>
</html>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #333;
    min-height: 100vh;
    padding: 20px;
  }

  #app {
    max-width: 1200px;
    margin: 0 auto;
    background-color: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  }

  h1 {
    text-align: center;
    color: #667eea;
    margin-bottom: 30px;
    font-size: 2.5rem;
    font-weight: 700;
  }

  h2 {
    color: #667eea;
    margin-bottom: 15px;
    font-size: 1.5rem;
  }

  .error-message {
    background-color: #fee;
    border: 2px solid #f88;
    border-radius: 8px;
    padding: 20px;
    margin: 20px 0;
  }

  .error-message p {
    margin-bottom: 10px;
    color: #c33;
  }

  .error-message ul {
    margin-left: 20px;
    color: #c33;
  }

  .status-message {
    background-color: #e3f2fd;
    border-left: 4px solid #2196f3;
    padding: 12px 20px;
    margin-bottom: 20px;
    border-radius: 4px;
    color: #1565c0;
    font-weight: 500;
  }

  .input-section {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #555;
  }

  textarea {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    resize: vertical;
    transition: border-color 0.3s;
  }

  textarea:focus {
    outline: none;
    border-color: #667eea;
  }

  textarea:disabled {
    background-color: #f5f5f5;
    cursor: not-allowed;
  }

  .controls {
    display: flex;
    gap: 20px;
    align-items: flex-end;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .review-type {
    flex: 1;
    min-width: 200px;
  }

  select {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.3s;
  }

  select:focus {
    outline: none;
    border-color: #667eea;
  }

  select:disabled {
    background-color: #f5f5f5;
    cursor: not-allowed;
  }

  .review-btn {
    padding: 12px 30px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s;
    min-width: 150px;
  }

  .review-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
  }

  .review-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .review-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
  }

  .output-section {
    margin-top: 30px;
    padding-top: 30px;
    border-top: 2px solid #eee;
  }

  .review-output {
    background-color: #f8f9fa;
    border: 2px solid #e9ecef;
    border-radius: 8px;
    padding: 20px;
    max-height: 600px;
    overflow-y: auto;
  }

  .review-output pre {
    white-space: pre-wrap;
    word-wrap: break-word;
    font-family: 'Courier New', monospace;
    font-size: 14px;
    line-height: 1.6;
    color: #333;
  }

  @media (max-width: 768px) {
    #app {
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
    }

    .controls {
      flex-direction: column;
      align-items: stretch;
    }

    .review-btn {
      width: 100%;
    }
  }
</style>
