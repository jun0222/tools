<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIコードレビュー - Gemini Nano</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  </head>
  <body>
    <div id="app">
      <h1>AIコードレビュー (Gemini Nano)</h1>

      <div v-if="!apiAvailable" class="error-message">
        <p>お使いのブラウザでGemini Nano APIが利用できません。</p>
        <p>Chrome Canaryで以下のフラグを有効にしてください：</p>
        <ul>
          <li>chrome://flags/#optimization-guide-on-device-model - Enable</li>
          <li>chrome://flags/#prompt-api-for-gemini-nano - Enable</li>
        </ul>
      </div>

      <div v-else>
        <div class="status-message" v-if="statusMessage">
          {{ statusMessage }}
        </div>

        <div class="input-section">
          <label for="code-input">レビューするコードを入力:</label>
          <textarea
            v-model="codeInput"
            id="code-input"
            placeholder="コードをここに貼り付けてください..."
            rows="15"
            :disabled="isReviewing"
          ></textarea>
        </div>

        <div class="controls">
          <div class="review-type">
            <label for="review-type">レビュー観点:</label>
            <select v-model="reviewType" id="review-type" :disabled="isReviewing">
              <option value="general">総合的なレビュー</option>
              <option value="security">セキュリティ問題</option>
              <option value="performance">パフォーマンス</option>
              <option value="best-practices">ベストプラクティス</option>
              <option value="bugs">潜在的なバグ</option>
            </select>
          </div>

          <button @click="reviewCode" :disabled="!codeInput || isReviewing" class="review-btn">
            {{ isReviewing ? 'レビュー中...' : 'コードをレビュー' }}
          </button>
        </div>

        <!-- プログレスバーと経過時間 -->
        <div v-if="isReviewing" class="progress-section">
          <div class="progress-bar">
            <div class="progress-bar-fill"></div>
          </div>
          <div class="elapsed-time">経過時間: {{ elapsedTime }}秒</div>
        </div>

        <div v-if="reviewResult" class="output-section">
          <h2>レビュー結果</h2>
          <div class="review-output" v-html="parsedReviewResult"></div>
        </div>
      </div>
    </div>

    <script>
      const app = new Vue({
        el: "#app",
        data: {
          codeInput: "",
          reviewType: "general",
          reviewResult: "",
          apiAvailable: false,
          isReviewing: false,
          statusMessage: "",
          session: null,
          elapsedTime: 0,
          timerInterval: null
        },
        async mounted() {
          await this.checkAPIAvailability();
        },
        computed: {
          parsedReviewResult() {
            if (!this.reviewResult) return '';
            return marked.parse(this.reviewResult);
          }
        },
        methods: {
          async checkAPIAvailability() {
            try {
              if (typeof LanguageModel === 'undefined') {
                this.apiAvailable = false;
                console.error('LanguageModel is not available');
                return;
              }

              this.apiAvailable = true;
              this.statusMessage = 'Gemini Nanoの準備完了！';
            } catch (error) {
              console.error('Error checking API availability:', error);
              this.apiAvailable = false;
            }
          },

          getReviewPrompt() {
            const prompts = {
              general: "あなたは厳しいシニアエンジニアです。以下のコードの主要な問題点を3〜5個、箇条書きで簡潔に指摘してください。具体的な改善案も含めてください。",
              security: "セキュリティの専門家として、以下のコードの主要な脆弱性を3〜5個、箇条書きで簡潔に指摘してください。",
              performance: "パフォーマンス専門家として、以下のコードの主要なボトルネックを3〜5個、箇条書きで簡潔に指摘してください。",
              "best-practices": "アーキテクトとして、以下のコードの主要な改善点を3〜5個、箇条書きで簡潔に指摘してください。",
              bugs: "バグハンターとして、以下のコードの潜在的なバグを3〜5個、箇条書きで簡潔に指摘してください。"
            };

            return prompts[this.reviewType] || prompts.general;
          },

          startTimer() {
            this.elapsedTime = 0;
            this.timerInterval = setInterval(() => {
              this.elapsedTime++;
            }, 1000);
          },

          stopTimer() {
            if (this.timerInterval) {
              clearInterval(this.timerInterval);
              this.timerInterval = null;
            }
          },

          async reviewCode() {
            this.isReviewing = true;
            this.reviewResult = "";
            this.statusMessage = "コードを分析中...";
            this.startTimer();

            // 前回のセッションがあれば破棄
            if (this.session) {
              this.session.destroy();
              this.session = null;
            }

            try {
              console.log("%c🚀 Gemini Nano を起動中...", "color: #4285F4; font-weight: bold;");

              // セッションの作成（日本語出力と役割を指定）
              this.session = await LanguageModel.create({
                expectedOutputLanguage: 'ja',
                systemPrompt: this.getReviewPrompt()
              });

              console.log("%c🧐 レビュー対象のコード:", "color: #9AA0A6;");
              console.log(this.codeInput);

              // ストリーミングでプロンプトの実行
              console.log("%c🤖 レビュー結果:", "color: #34A853; font-weight: bold;");
              const stream = await this.session.promptStreaming(`このコードをレビューして改善案を出してください:\n\n\`\`\`\n${this.codeInput}\n\`\`\``);

              // ストリーミング結果を1文字ずつ表示
              this.reviewResult = "";
              for await (const chunk of stream) {
                this.reviewResult = chunk;
              }

              console.log(this.reviewResult);
              this.statusMessage = "レビュー完了！";

            } catch (error) {
              console.error("❌ エラーが発生しました:", error);
              this.reviewResult = `エラー: ${error.message}`;
              this.statusMessage = "レビューに失敗しました。";
            } finally {
              this.isReviewing = false;
              this.stopTimer();

              // セッションの終了（リソース解放）
              if (this.session) {
                this.session.destroy();
                this.session = null;
              }
            }
          }
        },
        beforeDestroy() {
          // コンポーネント破棄時にセッションをクリーンアップ
          if (this.session) {
            this.session.destroy();
            this.session = null;
          }
        }
      });
    </script>
  </body>
</html>

<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #333;
    min-height: 100vh;
    padding: 20px;
  }

  #app {
    max-width: 1200px;
    margin: 0 auto;
    background-color: #fff;
    padding: 30px;
    border-radius: 12px;
    box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
  }

  h1 {
    text-align: center;
    color: #667eea;
    margin-bottom: 30px;
    font-size: 2.5rem;
    font-weight: 700;
  }

  h2 {
    color: #667eea;
    margin-bottom: 15px;
    font-size: 1.5rem;
  }

  .error-message {
    background-color: #fee;
    border: 2px solid #f88;
    border-radius: 8px;
    padding: 20px;
    margin: 20px 0;
  }

  .error-message p {
    margin-bottom: 10px;
    color: #c33;
  }

  .error-message ul {
    margin-left: 20px;
    color: #c33;
  }

  .status-message {
    background-color: #e3f2fd;
    border-left: 4px solid #2196f3;
    padding: 12px 20px;
    margin-bottom: 20px;
    border-radius: 4px;
    color: #1565c0;
    font-weight: 500;
  }

  .input-section {
    margin-bottom: 20px;
  }

  label {
    display: block;
    margin-bottom: 8px;
    font-weight: 600;
    color: #555;
  }

  textarea {
    width: 100%;
    padding: 15px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    font-family: 'Courier New', monospace;
    resize: vertical;
    transition: border-color 0.3s;
  }

  textarea:focus {
    outline: none;
    border-color: #667eea;
  }

  textarea:disabled {
    background-color: #f5f5f5;
    cursor: not-allowed;
  }

  .controls {
    display: flex;
    gap: 20px;
    align-items: flex-end;
    margin-bottom: 30px;
    flex-wrap: wrap;
  }

  .review-type {
    flex: 1;
    min-width: 200px;
  }

  select {
    width: 100%;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 14px;
    cursor: pointer;
    transition: border-color 0.3s;
  }

  select:focus {
    outline: none;
    border-color: #667eea;
  }

  select:disabled {
    background-color: #f5f5f5;
    cursor: not-allowed;
  }

  .review-btn {
    padding: 12px 30px;
    border: none;
    border-radius: 8px;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    color: #fff;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.2s, box-shadow 0.3s;
    min-width: 150px;
  }

  .review-btn:hover:not(:disabled) {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
  }

  .review-btn:active:not(:disabled) {
    transform: translateY(0);
  }

  .review-btn:disabled {
    background: #ccc;
    cursor: not-allowed;
    transform: none;
  }

  .output-section {
    margin-top: 30px;
    padding-top: 30px;
    border-top: 2px solid #eee;
  }

  .progress-section {
    margin-bottom: 20px;
  }

  .progress-bar {
    width: 100%;
    height: 8px;
    background-color: #e0e0e0;
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 10px;
  }

  .progress-bar-fill {
    height: 100%;
    background: linear-gradient(90deg, #667eea 0%, #764ba2 50%, #667eea 100%);
    background-size: 200% 100%;
    animation: progressAnimation 1.5s linear infinite;
  }

  @keyframes progressAnimation {
    0% {
      background-position: 0% 0%;
    }
    100% {
      background-position: 200% 0%;
    }
  }

  .elapsed-time {
    text-align: center;
    color: #667eea;
    font-weight: 600;
    font-size: 14px;
  }

  .review-output {
    background-color: #f8f9fa;
    border: 2px solid #e9ecef;
    border-radius: 8px;
    padding: 20px;
    max-height: 600px;
    overflow-y: auto;
    line-height: 1.8;
  }

  .review-output h1,
  .review-output h2,
  .review-output h3 {
    color: #667eea;
    margin-top: 20px;
    margin-bottom: 10px;
  }

  .review-output h1 {
    font-size: 1.8rem;
    border-bottom: 2px solid #667eea;
    padding-bottom: 8px;
  }

  .review-output h2 {
    font-size: 1.5rem;
  }

  .review-output h3 {
    font-size: 1.2rem;
  }

  .review-output ul,
  .review-output ol {
    margin-left: 20px;
    margin-bottom: 15px;
  }

  .review-output li {
    margin-bottom: 8px;
  }

  .review-output p {
    margin-bottom: 12px;
  }

  .review-output code {
    background-color: #f3e5f5;
    padding: 2px 6px;
    border-radius: 4px;
    font-family: 'Courier New', monospace;
    font-size: 0.9em;
    color: #764ba2;
  }

  .review-output pre {
    background-color: #2d2d2d;
    color: #f8f8f2;
    padding: 15px;
    border-radius: 8px;
    overflow-x: auto;
    margin-bottom: 15px;
  }

  .review-output pre code {
    background-color: transparent;
    padding: 0;
    color: #f8f8f2;
  }

  .review-output blockquote {
    border-left: 4px solid #667eea;
    padding-left: 15px;
    margin-left: 0;
    color: #666;
    font-style: italic;
  }

  .review-output strong {
    color: #764ba2;
    font-weight: 700;
  }

  .review-output a {
    color: #667eea;
    text-decoration: none;
  }

  .review-output a:hover {
    text-decoration: underline;
  }

  @media (max-width: 768px) {
    #app {
      padding: 20px;
    }

    h1 {
      font-size: 2rem;
    }

    .controls {
      flex-direction: column;
      align-items: stretch;
    }

    .review-btn {
      width: 100%;
    }
  }
</style>
