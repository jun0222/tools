<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoe Size Converter</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --accent-yellow: #ffde03;
            --accent-red: #ff2e63;
            --accent-blue: #08d9d6;
            --accent-green: #9dff00;
            --text-dark: #1a1a1a;
            --text-light: #f5f0e6;
            --border-weight: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                );
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: var(--border-weight) solid var(--text-dark);
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: 1.8rem;
            color: var(--text-dark);
            position: relative;
            display: inline-block;
        }

        .logo::before {
            content: 'SHOE SIZE';
            position: absolute;
            left: 2px;
            top: 2px;
            color: var(--accent-red);
            z-index: -1;
        }

        .logo-sub {
            font-size: 0.8rem;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.2rem 0.5rem;
            margin-left: 0.5rem;
        }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .converter-card {
            background: white;
            border: var(--border-weight) solid var(--text-dark);
            box-shadow: 8px 8px 0 var(--text-dark);
            width: 100%;
            max-width: 400px;
        }

        .card-header {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.6rem 1rem;
        }

        .card-content {
            padding: 1.5rem;
        }

        .input-group {
            margin-bottom: 1.5rem;
        }

        .input-label {
            font-size: 0.75rem;
            font-weight: 500;
            text-transform: uppercase;
            margin-bottom: 0.5rem;
            display: block;
        }

        .input-row {
            display: flex;
            gap: 0.5rem;
        }

        select, input {
            font-family: 'DM Mono', monospace;
            font-size: 1rem;
            padding: 0.8rem;
            border: 3px solid var(--text-dark);
            background: var(--bg-primary);
            outline: none;
            transition: all 0.15s;
        }

        select {
            width: 120px;
            cursor: pointer;
        }

        input {
            flex: 1;
            width: 100%;
        }

        select:focus, input:focus {
            background: var(--accent-yellow);
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--text-dark);
        }

        .results {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.5rem;
        }

        .result-item {
            border: 2px solid var(--text-dark);
            padding: 0.8rem;
            cursor: pointer;
            transition: all 0.1s;
            position: relative;
        }

        .result-item:hover {
            background: var(--accent-blue);
        }

        .result-item.copied {
            background: var(--accent-green);
        }

        .result-item.active {
            background: var(--accent-yellow);
            border-width: 3px;
        }

        .result-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            opacity: 0.7;
            margin-bottom: 0.2rem;
        }

        .result-value {
            font-size: 1.3rem;
            font-weight: 500;
        }

        .result-unit {
            font-size: 0.75rem;
            opacity: 0.6;
        }

        .hint {
            font-size: 0.7rem;
            color: #666;
            margin-top: 1rem;
            text-align: center;
        }

        .gender-toggle {
            display: flex;
            gap: 0;
            margin-bottom: 1rem;
        }

        .gender-btn {
            flex: 1;
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            padding: 0.6rem;
            border: 3px solid var(--text-dark);
            background: white;
            cursor: pointer;
            transition: all 0.1s;
        }

        .gender-btn:first-child {
            border-right: none;
        }

        .gender-btn.active {
            background: var(--text-dark);
            color: var(--text-light);
        }

        .gender-btn:hover:not(.active) {
            background: var(--bg-primary);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.8rem 1.5rem;
            font-size: 0.85rem;
            border: 3px solid var(--accent-green);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1000;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<header>
    <span class="logo">SHOE SIZE</span>
    <span class="logo-sub">CONVERTER</span>
</header>

<main>
    <div class="converter-card">
        <div class="card-header">Size Converter</div>
        <div class="card-content">
            <div class="gender-toggle">
                <button class="gender-btn active" data-gender="men">Men</button>
                <button class="gender-btn" data-gender="women">Women</button>
            </div>

            <div class="input-group">
                <label class="input-label">Enter Size</label>
                <div class="input-row">
                    <select id="baseSystem">
                        <option value="JP">JP</option>
                        <option value="EU">EU</option>
                        <option value="US">US</option>
                        <option value="UK">UK</option>
                        <option value="CN">CN</option>
                    </select>
                    <input type="number" id="sizeInput" step="0.5" value="28" placeholder="28">
                </div>
            </div>

            <div class="results" id="results">
                <div class="result-item" data-system="JP">
                    <div class="result-label">JP</div>
                    <div class="result-value" id="result-jp">28</div>
                    <div class="result-unit">cm</div>
                </div>
                <div class="result-item" data-system="EU">
                    <div class="result-label">EU</div>
                    <div class="result-value" id="result-eu">44</div>
                </div>
                <div class="result-item" data-system="US">
                    <div class="result-label">US</div>
                    <div class="result-value" id="result-us">11</div>
                </div>
                <div class="result-item" data-system="UK">
                    <div class="result-label">UK</div>
                    <div class="result-value" id="result-uk">10</div>
                </div>
                <div class="result-item" data-system="CN">
                    <div class="result-label">CN</div>
                    <div class="result-value" id="result-cn">46</div>
                </div>
                <div class="result-item" data-system="MM">
                    <div class="result-label">MM</div>
                    <div class="result-value" id="result-mm">280</div>
                    <div class="result-unit">mm</div>
                </div>
            </div>

            <p class="hint">Click result to copy</p>
        </div>
    </div>
</main>

<div class="toast" id="toast"></div>

<script>
    const baseSystem = document.getElementById('baseSystem');
    const sizeInput = document.getElementById('sizeInput');
    const resultItems = document.querySelectorAll('.result-item');
    const genderBtns = document.querySelectorAll('.gender-btn');
    const toast = document.getElementById('toast');

    let gender = 'men';

    // Gender toggle
    genderBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            genderBtns.forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            gender = btn.dataset.gender;
            convert();
        });
    });

    function toJP(value, system) {
        const v = parseFloat(value);
        if (isNaN(v)) return null;

        // Men: JP28 = EU44, UK10, US11, CN46
        // Women: US/UK typically 1.5 size smaller display
        switch (system) {
            case 'JP': return v;
            case 'EU': return v - 16;
            case 'US': return gender === 'men' ? v + 17 : v + 18.5;
            case 'UK': return v + 18;
            case 'CN': return v - 18;
            case 'MM': return v / 10;
            default: return v;
        }
    }

    function fromJP(jp) {
        if (jp === null) return null;

        const round = (n) => Math.round(n * 2) / 2;

        return {
            JP: round(jp),
            EU: Math.round(jp + 16),
            US: gender === 'men' ? round(jp - 17) : round(jp - 18.5),
            UK: round(jp - 18),
            CN: Math.round(jp + 18),
            MM: Math.round(jp * 10)
        };
    }

    function convert() {
        const system = baseSystem.value;
        const value = sizeInput.value;
        const jp = toJP(value, system);
        const results = fromJP(jp);

        if (results === null) {
            document.getElementById('result-jp').textContent = '-';
            document.getElementById('result-eu').textContent = '-';
            document.getElementById('result-us').textContent = '-';
            document.getElementById('result-uk').textContent = '-';
            document.getElementById('result-cn').textContent = '-';
            document.getElementById('result-mm').textContent = '-';
            return;
        }

        document.getElementById('result-jp').textContent = results.JP;
        document.getElementById('result-eu').textContent = results.EU;
        document.getElementById('result-us').textContent = results.US;
        document.getElementById('result-uk').textContent = results.UK;
        document.getElementById('result-cn').textContent = results.CN;
        document.getElementById('result-mm').textContent = results.MM;

        // Highlight active system
        resultItems.forEach(item => {
            item.classList.toggle('active', item.dataset.system === system);
        });
    }

    // Real-time conversion
    sizeInput.addEventListener('input', convert);
    baseSystem.addEventListener('change', convert);

    // Copy on click
    resultItems.forEach(item => {
        item.addEventListener('click', async () => {
            const value = item.querySelector('.result-value').textContent;
            const label = item.querySelector('.result-label').textContent;
            const unit = item.querySelector('.result-unit')?.textContent || '';

            try {
                await navigator.clipboard.writeText(value);
                item.classList.add('copied');
                setTimeout(() => item.classList.remove('copied'), 300);
                showToast(`Copied: ${label} ${value}${unit}`);
            } catch (err) {
                showToast('Copy failed');
            }
        });
    });

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 1500);
    }

    // Initial conversion
    convert();
</script>
</body>
</html>
