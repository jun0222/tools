<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Viewer</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
    <script src="https://cdn.jsdelivr.net/npm/highlight.js@11"></script>
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --bg-secondary: #1a1a1a;
            --accent-yellow: #ffde03;
            --accent-red: #ff2e63;
            --accent-blue: #08d9d6;
            --accent-green: #9dff00;
            --accent-orange: #ff9f43;
            --text-dark: #1a1a1a;
            --text-light: #f5f0e6;
            --border-weight: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                );
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.4;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: var(--border-weight) solid var(--text-dark);
            position: relative;
            overflow: hidden;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: -0.03em;
            position: relative;
            display: inline-block;
        }

        .logo::before {
            content: 'MARKDOWN';
            position: absolute;
            left: 3px;
            top: 3px;
            color: var(--accent-orange);
            z-index: -1;
        }

        .logo-sub {
            font-family: 'DM Mono', monospace;
            font-size: 0.9rem;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.3rem 0.8rem;
            display: inline-block;
            transform: rotate(-2deg);
            margin-left: 1rem;
        }

        .header-actions {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            height: calc(100vh - 80px);
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
                height: auto;
            }
        }

        .editor-panel {
            border-right: var(--border-weight) solid var(--text-dark);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .panel-header {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.6rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .template-buttons {
            display: flex;
            gap: 0.3rem;
        }

        .template-btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.65rem;
            padding: 0.3rem 0.5rem;
            border: 2px solid var(--text-light);
            background: transparent;
            color: var(--text-light);
            cursor: pointer;
            transition: all 0.15s;
        }

        .template-btn:hover {
            background: var(--text-light);
            color: var(--text-dark);
        }

        textarea {
            width: 100%;
            flex: 1;
            font-family: 'DM Mono', monospace;
            font-size: 0.9rem;
            padding: 1.5rem;
            border: none;
            background: #fefdfb;
            outline: none;
            resize: none;
            line-height: 1.7;
        }

        .preview-panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: white;
        }

        .preview-header {
            background: var(--accent-orange);
            color: var(--text-dark);
        }

        .preview-content {
            flex: 1;
            overflow: auto;
            padding: 2rem;
        }

        /* Markdown Styles */
        .markdown-body {
            font-family: 'Inter', sans-serif;
            font-size: 1rem;
            line-height: 1.8;
            color: #24292e;
        }

        .markdown-body h1,
        .markdown-body h2,
        .markdown-body h3,
        .markdown-body h4,
        .markdown-body h5,
        .markdown-body h6 {
            font-weight: 700;
            margin-top: 1.5em;
            margin-bottom: 0.5em;
            line-height: 1.3;
        }

        .markdown-body h1 {
            font-size: 2em;
            padding-bottom: 0.3em;
            border-bottom: 3px solid var(--accent-orange);
        }

        .markdown-body h2 {
            font-size: 1.5em;
            padding-bottom: 0.2em;
            border-bottom: 2px solid #eee;
        }

        .markdown-body h3 { font-size: 1.25em; }
        .markdown-body h4 { font-size: 1em; }

        .markdown-body p {
            margin-bottom: 1em;
        }

        .markdown-body a {
            color: #0366d6;
            text-decoration: none;
        }

        .markdown-body a:hover {
            text-decoration: underline;
        }

        .markdown-body code {
            font-family: 'DM Mono', monospace;
            font-size: 0.9em;
            background: #f6f8fa;
            padding: 0.2em 0.4em;
            border-radius: 3px;
        }

        .markdown-body pre {
            background: #0d1117;
            border-radius: 6px;
            padding: 1rem;
            overflow-x: auto;
            margin: 1em 0;
        }

        .markdown-body pre code {
            background: transparent;
            padding: 0;
            color: #c9d1d9;
        }

        .markdown-body blockquote {
            border-left: 4px solid var(--accent-orange);
            padding-left: 1em;
            margin: 1em 0;
            color: #57606a;
            background: #fff8f0;
            padding: 1em;
        }

        .markdown-body ul,
        .markdown-body ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        .markdown-body li {
            margin: 0.3em 0;
        }

        .markdown-body table {
            border-collapse: collapse;
            width: 100%;
            margin: 1em 0;
        }

        .markdown-body th,
        .markdown-body td {
            border: 1px solid #d0d7de;
            padding: 0.6em 1em;
            text-align: left;
        }

        .markdown-body th {
            background: #f6f8fa;
            font-weight: 600;
        }

        .markdown-body tr:nth-child(even) {
            background: #f6f8fa;
        }

        .markdown-body img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        .markdown-body hr {
            border: none;
            border-top: 3px solid #eee;
            margin: 2em 0;
        }

        .markdown-body input[type="checkbox"] {
            margin-right: 0.5em;
        }

        .btn-action {
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            padding: 0.6rem 1rem;
            border: 3px solid var(--text-dark);
            background: white;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-action:hover {
            background: var(--accent-yellow);
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--text-dark);
        }

        .btn-primary {
            background: var(--accent-green);
            font-family: 'Archivo Black', sans-serif;
            text-transform: uppercase;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: var(--text-light);
            padding: 1rem 2rem;
            font-family: 'DM Mono', monospace;
            border: 3px solid var(--accent-green);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        /* Word count */
        .word-count {
            font-size: 0.7rem;
            opacity: 0.7;
        }
    </style>
</head>
<body>
<div class="noise-overlay"></div>

<header>
    <div class="header-content">
        <div>
            <span class="logo">MARKDOWN</span>
            <span class="logo-sub">VIEWER</span>
        </div>
        <div class="header-actions">
            <button class="btn-action" id="copy-md">Copy MD</button>
            <button class="btn-action" id="copy-html">Copy HTML</button>
            <button class="btn-action btn-primary" id="download-html">Download</button>
        </div>
    </div>
</header>

<main>
    <div class="editor-panel">
        <div class="panel-header">
            <span>Editor <span class="word-count" id="word-count">0 words</span></span>
            <div class="template-buttons">
                <button class="template-btn" data-template="readme">README</button>
                <button class="template-btn" data-template="blog">Blog</button>
                <button class="template-btn" data-template="api">API Doc</button>
                <button class="template-btn" data-template="meeting">Meeting</button>
            </div>
        </div>
        <textarea id="markdown-input" placeholder="Markdownを入力..."># Welcome to Markdown Viewer

これは**マークダウンビューワー**です。リアルタイムでプレビューが更新されます。

## Features

- リアルタイムプレビュー

- 複数のテンプレート
- HTML/MDコピー

## Code Example

    console.log(`Hello, ${name}!`);
    return true;
}

greet('World');
```

## Table Example

| Preview | Done | High |
| Export | Done | Medium |
| Themes | Planned | Low |

## Quote

> プログラミングは思考を整理する手段である。
> コードは他の開発者への手紙である。

## Task List

- [x] リアルタイムプレビュー

Made with Markdown Viewer</textarea>
    </div>

    <div class="preview-panel">
        <div class="panel-header preview-header">
            <span>Preview</span>
        </div>
        <div class="preview-content">
            <div class="markdown-body" id="preview-output"></div>
        </div>
    </div>
</main>

<div class="toast" id="toast">コピーしました！</div>

<script>
    const input = document.getElementById('markdown-input');
    const output = document.getElementById('preview-output');
    const wordCount = document.getElementById('word-count');
    const toast = document.getElementById('toast');
    const templateBtns = document.querySelectorAll('.template-btn');
    const copyMdBtn = document.getElementById('copy-md');
    const copyHtmlBtn = document.getElementById('copy-html');
    const downloadBtn = document.getElementById('download-html');

    const templates = {
        readme: `# Project Name

Short description of your project.

## Installation

\`\`\`bash
npm install your-package
\`\`\`

## Usage

\`\`\`javascript

something.doAwesome();
\`\`\`

## API Reference

### \`functionName(param)\`

Description of the function.

| Parameter | Type | Description |
|-----------|------|-------------|
| param | string | Description |

**Returns:** \`ReturnType\` - Description

## Contributing

1. Fork the repository
2. Create your feature branch (\`git checkout -b feature/amazing\`)
3. Commit your changes (\`git commit -m 'Add amazing feature'\`)
4. Push to the branch (\`git push origin feature/amazing\`)
5. Open a Pull Request

## License

MIT License - see [LICENSE](LICENSE) for details.`,

        blog: `# Blog Post Title

*Published: ${new Date().toLocaleDateString('ja-JP')} | Author: Your Name*

![Hero Image](https://via.placeholder.com/800x400)

## Introduction

Start with an engaging introduction that hooks the reader. Explain what they'll learn or gain from reading this post.

## Main Content

### Section 1

Your first main point goes here. Use examples and explanations to make your point clear.

> "A relevant quote that supports your point."

### Section 2

Continue developing your ideas. Include code examples if relevant:

\`\`\`python
def example():
    return "Hello, World!"
\`\`\`

### Section 3

Wrap up your main arguments.

## Key Takeaways

- Point 1
- Point 2
- Point 3

## Conclusion

Summarize your post and include a call-to-action.

---

*Did you find this helpful? Share it with others!*`,

        api: `# API Documentation

Base URL: \`https://api.example.com/v1\`

## Authentication

All requests require an API key in the header:

\`\`\`
Authorization: Bearer YOUR_API_KEY
\`\`\`

## Endpoints

### Get All Users

GET /users
\`\`\`

**Query Parameters:**

| Parameter | Type | Required | Description |
|-----------|------|----------|-------------|
| page | integer | No | Page number (default: 1) |
| limit | integer | No | Items per page (default: 20) |

**Response:**

\`\`\`json
{
  "data": [
    {
      "id": 1,
      "name": "John Doe",
      "email": "john@example.com"
    }
  ],
  "meta": {
    "total": 100,
    "page": 1,
    "limit": 20
  }
}
\`\`\`

### Create User

**Request Body:**

  "password": "securepassword"

\`\`\`

**Response:** \`201 Created\`

## Error Codes

| Code | Description |
|------|-------------|
| 400 | Bad Request |
| 401 | Unauthorized |
| 404 | Not Found |
| 500 | Server Error |`,

        meeting: `# Meeting Notes

**Date:** ${new Date().toLocaleDateString('ja-JP')}

    };

    // Configure marked
    marked.setOptions({
        highlight: function(code, lang) {
            if (lang && hljs.getLanguage(lang)) {
                return hljs.highlight(code, { language: lang }).value;
            }
            return hljs.highlightAuto(code).value;
        },
        breaks: true,
        gfm: true
    });

    function renderMarkdown() {
        const md = input.value;
        output.innerHTML = marked.parse(md);

        // Update word count
        const words = md.trim().split(/\s+/).filter(w => w.length > 0).length;
        wordCount.textContent = `${words} words`;
    }

    // Real-time render
    input.addEventListener('input', renderMarkdown);

    // Template buttons
    templateBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const template = btn.dataset.template;
            if (templates[template]) {
                input.value = templates[template];
                renderMarkdown();
            }
        });
    });

    // Copy markdown
    copyMdBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(input.value);
            showToast('Markdownをコピーしました！');
        } catch (err) {
            showToast('コピーに失敗しました');
        }
    });

    // Copy HTML
    copyHtmlBtn.addEventListener('click', async () => {
        try {
            await navigator.clipboard.writeText(output.innerHTML);
            showToast('HTMLをコピーしました！');
        } catch (err) {
            showToast('コピーに失敗しました');
        }
    });

    // Download HTML
    downloadBtn.addEventListener('click', () => {
        const htmlContent = `<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown Document</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=DM+Mono&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/highlight.js@11/styles/github-dark.min.css">
    <style>
        body { font-family: 'Inter', sans-serif; max-width: 800px; margin: 0 auto; padding: 2rem; line-height: 1.8; color: #24292e; }
        h1, h2, h3, h4 { font-weight: 700; margin-top: 1.5em; }
        h1 { border-bottom: 3px solid #ff9f43; padding-bottom: 0.3em; }
        h2 { border-bottom: 2px solid #eee; padding-bottom: 0.2em; }
        code { font-family: 'DM Mono', monospace; background: #f6f8fa; padding: 0.2em 0.4em; border-radius: 3px; }
        pre { background: #0d1117; border-radius: 6px; padding: 1rem; overflow-x: auto; }
        pre code { background: transparent; color: #c9d1d9; }
        blockquote { border-left: 4px solid #ff9f43; padding: 1em; margin: 1em 0; background: #fff8f0; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #d0d7de; padding: 0.6em 1em; }
        th { background: #f6f8fa; }
        a { color: #0366d6; }
        img { max-width: 100%; }
    </style>
</head>
<body>
${output.innerHTML}
</body>
</html>`;

        const blob = new Blob([htmlContent], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.download = `markdown-${Date.now()}.html`;
        link.href = url;
        link.click();
        URL.revokeObjectURL(url);
    });

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Initial render
    renderMarkdown();
</script>
</body>
</html>
