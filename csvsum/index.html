<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CSVカラム合計ツール</title>
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        font-family: Arial, sans-serif;
        background-color: #f4f4f9;
        color: #333;
        margin: 0;
        padding: 20px;
      }

      #app {
        width: 95%;
        max-width: 960px;
        margin: 0 auto;
        background-color: #fff;
        padding: 30px;
        border-radius: 8px;
        box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
      }

      h1 {
        text-align: center;
        color: #16a085;
        margin-bottom: 8px;
        font-size: 1.5rem;
      }

      .sub {
        text-align: center;
        color: #777;
        font-size: 0.85rem;
        margin-bottom: 24px;
      }

      #dropZone {
        border: 2px dashed #ccc;
        border-radius: 8px;
        padding: 32px 16px;
        text-align: center;
        color: #777;
        cursor: pointer;
        transition: border-color 0.2s, background-color 0.2s;
      }

      #dropZone.dragover {
        border-color: #16a085;
        background-color: #f0fdf9;
        color: #16a085;
      }

      #dropZone .main-hint {
        font-size: 1rem;
        margin-bottom: 6px;
      }

      #dropZone .sub-hint {
        font-size: 0.8rem;
        color: #aaa;
      }

      #fileInput {
        display: none;
      }

      #fileName {
        margin-top: 10px;
        font-size: 0.85rem;
        color: #555;
        text-align: center;
        word-break: break-all;
      }

      .options {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
        align-items: center;
        margin: 20px 0;
        padding: 14px 16px;
        background: #f9f9f9;
        border-radius: 8px;
        border: 1px solid #eee;
        font-size: 0.88rem;
      }

      .options label {
        display: flex;
        align-items: center;
        gap: 6px;
        white-space: nowrap;
      }

      .options select {
        padding: 4px 6px;
        border-radius: 6px;
        border: 1px solid #ccc;
      }

      .options input[type="checkbox"] {
        accent-color: #16a085;
        cursor: pointer;
      }

      #status {
        font-size: 0.85rem;
        color: #b00;
        margin: 4px 0 0;
        min-height: 1.2em;
      }

      #resultSection {
        display: none;
        margin-top: 24px;
      }

      .meta-line {
        font-size: 0.85rem;
        color: #666;
        margin-bottom: 12px;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.9rem;
      }

      th,
      td {
        border: 1px solid #e5e5e5;
        padding: 8px 10px;
        text-align: right;
      }

      th:first-child,
      td:first-child {
        text-align: left;
      }

      thead th {
        background-color: #16a085;
        color: #fff;
        font-weight: normal;
      }

      tbody tr:nth-child(even) {
        background-color: #fafafa;
      }

      tbody tr.text-row td {
        color: #aaa;
      }

      tbody tr.number-row {
        cursor: pointer;
      }

      tbody tr.number-row:hover {
        background-color: #f0fdf9;
      }

      .type-badge {
        display: inline-block;
        font-size: 0.72rem;
        padding: 2px 8px;
        border-radius: 10px;
        background: #eee;
        color: #888;
      }

      .type-badge.number {
        background: #e3f7ef;
        color: #16a085;
      }

      .sum-cell {
        font-weight: bold;
        color: #16a085;
        font-family: "Courier New", monospace;
      }

      .text-row .sum-cell {
        font-weight: normal;
        color: #ccc;
      }

      #previewSection {
        margin-top: 28px;
      }

      #previewSection h2 {
        font-size: 1rem;
        color: #555;
        margin-bottom: 8px;
      }

      .preview-wrap {
        overflow-x: auto;
        overflow-y: auto;
        max-height: 480px;
        border: 1px solid #eee;
        border-radius: 8px;
      }

      .preview-wrap table {
        font-size: 0.8rem;
      }

      .preview-wrap th {
        background-color: #f0f0f0;
        color: #555;
        position: sticky;
        top: 0;
      }

      .preview-note {
        font-size: 0.78rem;
        color: #aaa;
        margin-top: 6px;
      }

      #toast {
        visibility: hidden;
        min-width: 200px;
        background-color: #333;
        color: #fff;
        text-align: center;
        border-radius: 6px;
        padding: 12px 20px;
        position: fixed;
        z-index: 100;
        left: 50%;
        transform: translateX(-50%);
        bottom: 30px;
        font-size: 14px;
        opacity: 0;
        transition: opacity 0.3s;
      }

      #toast.show {
        visibility: visible;
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <div id="app">
      <h1>CSVカラム合計ツール</h1>
      <p class="sub">CSVファイルを開いて、数値の列だけを自動判定して合計します。文字列の列は壊さずスキップします。</p>

      <div id="dropZone">
        <div class="main-hint">ここにCSVファイルをドラッグ&ドロップ、またはクリックして選択</div>
        <div class="sub-hint">カンマ入りの数値（例: 1,234,567）にも対応しています</div>
      </div>
      <input type="file" id="fileInput" accept=".csv,text/csv,.tsv,text/plain" />
      <div id="fileName"></div>

      <div class="options">
        <label>
          <input type="checkbox" id="hasHeader" checked />
          先頭行をヘッダーとして扱う
        </label>
        <label>
          区切り文字:
          <select id="delimiterSelect">
            <option value="auto" selected>自動判定</option>
            <option value=",">カンマ ( , )</option>
            <option value="\t">タブ</option>
            <option value=";">セミコロン ( ; )</option>
          </select>
        </label>
        <label>
          文字コード:
          <select id="encodingSelect">
            <option value="auto" selected>自動判定</option>
            <option value="utf-8">UTF-8</option>
            <option value="shift_jis">Shift-JIS (Excel等)</option>
          </select>
        </label>
      </div>
      <p id="status"></p>

      <div id="resultSection">
        <p class="meta-line" id="metaLine"></p>
        <table>
          <thead>
            <tr>
              <th>カラム名</th>
              <th>種別</th>
              <th>対象件数</th>
              <th>合計</th>
            </tr>
          </thead>
          <tbody id="resultBody"></tbody>
        </table>

        <div id="previewSection">
          <h2>データ（全<span id="previewRowCount">0</span>行）</h2>
          <div class="preview-wrap">
            <table id="previewTable"></table>
          </div>
          <p class="preview-note">列名や区切り文字が想定と違う場合は、上のオプションを変更してください。</p>
        </div>
      </div>
    </div>

    <div id="toast">コピーしました</div>

    <script>
      const dropZone = document.getElementById("dropZone");
      const fileInput = document.getElementById("fileInput");
      const fileNameEl = document.getElementById("fileName");
      const statusEl = document.getElementById("status");
      const hasHeaderEl = document.getElementById("hasHeader");
      const delimiterSelect = document.getElementById("delimiterSelect");
      const encodingSelect = document.getElementById("encodingSelect");
      const resultSection = document.getElementById("resultSection");
      const metaLine = document.getElementById("metaLine");
      const resultBody = document.getElementById("resultBody");
      const previewTable = document.getElementById("previewTable");

      let lastArrayBuffer = null;

      dropZone.addEventListener("click", () => fileInput.click());
      dropZone.addEventListener("dragover", (e) => {
        e.preventDefault();
        dropZone.classList.add("dragover");
      });
      dropZone.addEventListener("dragleave", () => dropZone.classList.remove("dragover"));
      dropZone.addEventListener("drop", (e) => {
        e.preventDefault();
        dropZone.classList.remove("dragover");
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          handleFile(e.dataTransfer.files[0]);
        }
      });
      fileInput.addEventListener("change", () => {
        if (fileInput.files && fileInput.files[0]) {
          handleFile(fileInput.files[0]);
        }
      });
      hasHeaderEl.addEventListener("change", rerender);
      delimiterSelect.addEventListener("change", rerender);
      encodingSelect.addEventListener("change", rerender);

      function handleFile(file) {
        fileNameEl.textContent = file.name + "（" + file.size.toLocaleString("ja-JP") + " bytes）";
        statusEl.textContent = "";
        const reader = new FileReader();
        reader.onload = () => {
          lastArrayBuffer = reader.result;
          rerender();
        };
        reader.onerror = () => {
          statusEl.textContent = "ファイルの読み込みに失敗しました。";
        };
        reader.readAsArrayBuffer(file);
      }

      function decodeBuffer(buffer, encodingChoice) {
        if (encodingChoice === "utf-8") {
          return new TextDecoder("utf-8").decode(buffer).replace(/^﻿/, "");
        }
        if (encodingChoice === "shift_jis") {
          return new TextDecoder("shift_jis").decode(buffer);
        }
        // auto: 有効なUTF-8ならUTF-8として、それ以外はShift-JISとして解釈
        try {
          return new TextDecoder("utf-8", { fatal: true }).decode(buffer).replace(/^﻿/, "");
        } catch (e) {
          return new TextDecoder("shift_jis").decode(buffer);
        }
      }

      function detectDelimiter(text) {
        const sample = text.split(/\r\n|\r|\n/).slice(0, 5).join("\n");
        const counts = {
          ",": sample.split(",").length - 1,
          "\t": sample.split("\t").length - 1,
          ";": sample.split(";").length - 1,
        };
        let best = ",";
        let bestCount = counts[","];
        for (const d of ["\t", ";"]) {
          if (counts[d] > bestCount) {
            best = d;
            bestCount = counts[d];
          }
        }
        return bestCount > 0 ? best : ",";
      }

      // RFC4180準拠の簡易CSVパーサー（引用符・改行入りフィールドに対応）
      function parseCSV(text, delimiter) {
        const rows = [];
        let row = [];
        let field = "";
        let inQuotes = false;
        let i = 0;
        const len = text.length;

        while (i < len) {
          const char = text[i];
          if (inQuotes) {
            if (char === '"') {
              if (text[i + 1] === '"') {
                field += '"';
                i += 2;
                continue;
              }
              inQuotes = false;
              i++;
              continue;
            }
            field += char;
            i++;
            continue;
          }
          if (char === '"') {
            inQuotes = true;
            i++;
            continue;
          }
          if (char === delimiter) {
            row.push(field);
            field = "";
            i++;
            continue;
          }
          if (char === "\r") {
            i++;
            continue;
          }
          if (char === "\n") {
            row.push(field);
            rows.push(row);
            row = [];
            field = "";
            i++;
            continue;
          }
          field += char;
          i++;
        }
        if (field.length > 0 || row.length > 0) {
          row.push(field);
          rows.push(row);
        }
        return rows.filter((r) => !(r.length === 1 && r[0].trim() === ""));
      }

      // "1,234", "¥1,234.5", "(123)", "12%", "▲1,234", "1,234-", "－1234" などを数値として解釈する
      function parseNumericValue(raw) {
        if (raw == null) return null;
        let s = String(raw).trim();
        if (s === "") return null;

        // 全角マイナス類を半角マイナスに正規化
        s = s.replace(/[－−–—]/g, "-");

        let negative = false;

        // 会計でよく使う▲/△（三角記号）による負数表記
        if (/^[▲△]/.test(s)) {
          negative = true;
          s = s.replace(/^[▲△]\s*/, "");
        }

        // 括弧表記の負数: (123) → -123
        if (/^\(.*\)$/.test(s)) {
          negative = true;
          s = s.slice(1, -1).trim();
        }

        // 末尾マイナス表記: 1,234- (会計フォーマットでよく使われる)
        if (s.endsWith("-")) {
          negative = true;
          s = s.slice(0, -1).trim();
        }

        if (s.startsWith("-")) {
          negative = true;
          s = s.slice(1).trim();
        } else if (s.startsWith("+")) {
          s = s.slice(1).trim();
        }

        // 全角数字を半角数字に変換
        s = s.replace(/[０-９]/g, (ch) => String.fromCharCode(ch.charCodeAt(0) - 0xfee0));

        // 桁区切りのカンマ・通貨記号・空白を除去
        s = s.replace(/[¥$€£,\s]/g, "");

        if (s.endsWith("%")) {
          s = s.slice(0, -1);
        }

        if (s === "" || !/^\d+(\.\d+)?$/.test(s)) return null;

        const num = parseFloat(s);
        return negative ? -num : num;
      }

      function getDelimiter(text) {
        const choice = delimiterSelect.value;
        if (choice === "auto") return detectDelimiter(text);
        if (choice === "\\t") return "\t";
        return choice;
      }

      function rerender() {
        if (!lastArrayBuffer) return;

        const text = decodeBuffer(lastArrayBuffer, encodingSelect.value);
        const delimiter = getDelimiter(text);
        const rows = parseCSV(text, delimiter);

        if (rows.length === 0) {
          statusEl.textContent = "CSVの内容を読み取れませんでした。";
          resultSection.style.display = "none";
          return;
        }
        statusEl.textContent = "";

        const hasHeader = hasHeaderEl.checked;
        const header = hasHeader ? rows[0] : null;
        const dataRows = hasHeader ? rows.slice(1) : rows;
        const columnCount = rows.reduce((max, r) => Math.max(max, r.length), 0);

        const columnNames = [];
        for (let c = 0; c < columnCount; c++) {
          columnNames.push(header && header[c] !== undefined && header[c].trim() !== "" ? header[c] : "列" + (c + 1));
        }

        resultBody.innerHTML = "";
        for (let c = 0; c < columnCount; c++) {
          const values = dataRows.map((r) => (r[c] !== undefined ? r[c] : ""));
          const nonEmpty = values.filter((v) => v.trim() !== "");

          const tr = document.createElement("tr");
          const nameTd = document.createElement("td");
          nameTd.textContent = columnNames[c];
          tr.appendChild(nameTd);

          const typeTd = document.createElement("td");
          const countTd = document.createElement("td");
          const sumTd = document.createElement("td");
          sumTd.className = "sum-cell";

          if (nonEmpty.length === 0) {
            typeTd.innerHTML = '<span class="type-badge">空</span>';
            countTd.textContent = "0";
            sumTd.textContent = "-";
            tr.className = "text-row";
          } else {
            const parsed = nonEmpty.map(parseNumericValue);
            const isNumeric = parsed.every((p) => p !== null);
            if (isNumeric) {
              const sum = parsed.reduce((a, b) => a + b, 0);
              typeTd.innerHTML = '<span class="type-badge number">数値</span>';
              countTd.textContent = parsed.length.toLocaleString("ja-JP");
              const sumText = new Intl.NumberFormat("ja-JP", { maximumFractionDigits: 10 }).format(sum);
              sumTd.textContent = sumText;
              tr.className = "number-row";
              tr.title = "クリックで合計値をコピー";
              tr.addEventListener("click", () => copyToClipboard(String(sum)));
            } else {
              typeTd.innerHTML = '<span class="type-badge">文字列</span>';
              countTd.textContent = nonEmpty.length.toLocaleString("ja-JP");
              sumTd.textContent = "-";
              tr.className = "text-row";
            }
          }

          tr.appendChild(typeTd);
          tr.appendChild(countTd);
          tr.appendChild(sumTd);
          resultBody.appendChild(tr);
        }

        const delimiterLabel = delimiter === "\t" ? "タブ" : delimiter === ";" ? "セミコロン" : "カンマ";
        metaLine.textContent =
          "データ行数: " + dataRows.length.toLocaleString("ja-JP") + " / 列数: " + columnCount + " / 区切り文字: " + delimiterLabel;

        document.getElementById("previewRowCount").textContent = dataRows.length.toLocaleString("ja-JP");
        renderPreview(columnNames, dataRows, columnCount);

        resultSection.style.display = "block";
      }

      function renderPreview(columnNames, previewRows, columnCount) {
        previewTable.innerHTML = "";
        const thead = document.createElement("thead");
        const headTr = document.createElement("tr");
        for (let c = 0; c < columnCount; c++) {
          const th = document.createElement("th");
          th.textContent = columnNames[c];
          headTr.appendChild(th);
        }
        thead.appendChild(headTr);
        previewTable.appendChild(thead);

        const tbody = document.createElement("tbody");
        previewRows.forEach((row) => {
          const tr = document.createElement("tr");
          for (let c = 0; c < columnCount; c++) {
            const td = document.createElement("td");
            td.style.textAlign = "left";
            td.textContent = row[c] !== undefined ? row[c] : "";
            tr.appendChild(td);
          }
          tbody.appendChild(tr);
        });
        previewTable.appendChild(tbody);
      }

      function copyToClipboard(text) {
        navigator.clipboard
          .writeText(text)
          .then(() => showToast("合計値「" + text + "」をコピーしました"))
          .catch(() => showToast("コピーに失敗しました"));
      }

      function showToast(message) {
        const toast = document.getElementById("toast");
        toast.textContent = message;
        toast.classList.add("show");
        setTimeout(() => toast.classList.remove("show"), 2200);
      }
    </script>
  </body>
</html>
