<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Viewer</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #111;
      --surface: #1e1e1e;
      --border: #333;
      --text: #e0e0e0;
      --muted: #888;
      --accent: #4a9eff;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 12px 20px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    header h1 { font-size: 15px; font-weight: 600; }

    #count { font-size: 12px; color: var(--muted); flex: 1; }

    /* ---- Empty / Error state ---- */
    #message {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 14px;
      color: var(--muted);
      font-size: 14px;
      padding: 40px;
      text-align: center;
      line-height: 1.8;
    }

    #message code {
      display: inline-block;
      background: var(--surface);
      border: 1px solid var(--border);
      padding: 8px 18px;
      border-radius: 6px;
      font-size: 13px;
      color: var(--accent);
      font-family: monospace;
    }

    /* ---- Grid ---- */
    #grid {
      display: none;
      padding: 16px;
      grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
      gap: 10px;
      overflow-y: auto;
      flex: 1;
    }

    .thumb {
      position: relative;
      aspect-ratio: 1;
      border-radius: 8px;
      overflow: hidden;
      background: var(--surface);
      cursor: pointer;
      border: 1px solid var(--border);
      transition: transform 0.15s, border-color 0.15s;
    }

    .thumb:hover { transform: scale(1.03); border-color: var(--accent); z-index: 1; }

    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }

    .thumb .info {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      padding: 6px 8px 5px;
      background: linear-gradient(transparent, rgba(0,0,0,0.78));
      font-size: 10px;
      color: #ddd;
      display: flex;
      flex-direction: column;
      gap: 1px;
      opacity: 0;
      transition: opacity 0.15s;
    }

    .thumb:hover .info { opacity: 1; }
    .info .name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .info .date { color: #aaa; }

    /* ---- Lightbox ---- */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #lightbox.open { display: flex; }

    #lbImg {
      max-width: calc(100vw - 120px);
      max-height: calc(100vh - 100px);
      object-fit: contain;
      border-radius: 4px;
      user-select: none;
    }

    #lbInfo { margin-top: 12px; font-size: 12px; color: var(--muted); text-align: center; }

    .lbNav {
      position: fixed;
      top: 50%;
      transform: translateY(-50%);
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      font-size: 28px;
      width: 48px;
      height: 80px;
      border-radius: 8px;
      cursor: pointer;
      transition: background 0.15s;
    }

    .lbNav:hover { background: rgba(255,255,255,0.18); }
    #lbPrev { left: 12px; }
    #lbNext { right: 12px; }

    #lbClose {
      position: fixed;
      top: 14px;
      right: 18px;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      font-size: 22px;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      cursor: pointer;
      transition: background 0.15s;
    }

    #lbClose:hover { background: rgba(255,255,255,0.18); }

    #lbCounter {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 12px;
      color: var(--muted);
    }
  </style>
</head>
<body>

<header>
  <h1>Image Viewer</h1>
  <span id="count"></span>
</header>

<div id="message">
  <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2" opacity="0.35">
    <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
    <circle cx="12" cy="13" r="2.5"/>
  </svg>
  <span>画像データが見つかりません。</span>
  <span>① <code>images/</code> フォルダに画像を入れる</span>
  <span>② ターミナルで実行:</span>
  <code>bash update.sh</code>
  <span>③ ページを再読み込み</span>
</div>

<div id="grid"></div>

<div id="lightbox">
  <button class="lbNav" id="lbPrev">&#8249;</button>
  <img id="lbImg" src="" alt="">
  <div id="lbInfo"></div>
  <button class="lbNav" id="lbNext">&#8250;</button>
  <button id="lbClose">&#x2715;</button>
  <div id="lbCounter"></div>
</div>

<!--
  update.sh が生成する data.js を読み込む。
  data.js は以下の形式で IMAGE_DATA を定義する:
    const IMAGE_DATA = [
      { name: "photo.jpg", path: "images/photo.jpg", date: 1715000000000 },
      ...  // 新しい順
    ];
-->
<script src="data.js"></script>
<script>
  const images    = (typeof IMAGE_DATA !== 'undefined') ? IMAGE_DATA : [];
  let currentIdx  = 0;

  const messageEl = document.getElementById('message');
  const grid      = document.getElementById('grid');
  const countEl   = document.getElementById('count');
  const lightbox  = document.getElementById('lightbox');
  const lbImg     = document.getElementById('lbImg');
  const lbInfo    = document.getElementById('lbInfo');
  const lbCounter = document.getElementById('lbCounter');

  function formatDate(ts) {
    const d   = new Date(ts);
    const pad = n => String(n).padStart(2, '0');
    return `${d.getFullYear()}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
  }

  function render() {
    if (images.length === 0) return;

    images.forEach((img, idx) => {
      const thumb = document.createElement('div');
      thumb.className = 'thumb';
      thumb.innerHTML = `
        <img src="${img.path}" alt="${img.name}" loading="lazy">
        <div class="info">
          <span class="name">${img.name}</span>
          <span class="date">${formatDate(img.date)}</span>
        </div>`;
      thumb.addEventListener('click', () => openLightbox(idx));
      grid.appendChild(thumb);
    });

    countEl.textContent = `${images.length} 枚`;
    messageEl.style.display = 'none';
    grid.style.display = 'grid';
  }

  // ---- Lightbox ----
  function openLightbox(idx) { currentIdx = idx; showCurrent(); lightbox.classList.add('open'); }

  function showCurrent() {
    const { path, name, date } = images[currentIdx];
    lbImg.src        = path;
    lbInfo.textContent  = `${name}  ·  ${formatDate(date)}`;
    lbCounter.textContent = `${currentIdx + 1} / ${images.length}`;
  }

  function closeLightbox() { lightbox.classList.remove('open'); lbImg.src = ''; }
  function prev() { currentIdx = (currentIdx - 1 + images.length) % images.length; showCurrent(); }
  function next() { currentIdx = (currentIdx + 1) % images.length; showCurrent(); }

  document.getElementById('lbPrev').addEventListener('click', prev);
  document.getElementById('lbNext').addEventListener('click', next);
  document.getElementById('lbClose').addEventListener('click', closeLightbox);
  lightbox.addEventListener('click', e => { if (e.target === lightbox) closeLightbox(); });

  document.addEventListener('keydown', e => {
    if (!lightbox.classList.contains('open')) return;
    if (e.key === 'Escape')     closeLightbox();
    if (e.key === 'ArrowLeft')  prev();
    if (e.key === 'ArrowRight') next();
  });

  let touchStartX = 0;
  lightbox.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
  lightbox.addEventListener('touchend',   e => {
    const dx = e.changedTouches[0].clientX - touchStartX;
    if (Math.abs(dx) > 50) { dx < 0 ? next() : prev(); }
  });

  render();
</script>
</body>
</html>
