<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>tmp memo</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    .textarea-wrapper {
      position: relative;
    }

    .compose-textarea {
      width: 100%;
      background: #fff;
      border: 1px solid #ccc;
      color: #333;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      font-family: inherit;
      min-height: 80vh;
      padding: 10px;
      padding-top: 28px;
    }

    .compose-textarea:focus {
      border-color: #999;
    }

    .textarea-buttons {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 2px;
    }

    .icon-btn {
      border: 1px solid #ddd;
      background: #fafafa;
      color: #888;
      cursor: pointer;
      font-size: 11px;
      padding: 4px 8px;
    }

    .icon-btn:hover {
      background: #eee;
      color: #555;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useRef } = React;

    const SECRET_KEY = 'ango2_secret_key_2024';

    function encrypt(text) {
      let shift = 0;
      for (let i = 0; i < SECRET_KEY.length; i++) shift += SECRET_KEY.charCodeAt(i);
      shift = shift % 1000;
      let result = '';
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '\n') {
          result += char;
        } else {
          result += String.fromCharCode(text.charCodeAt(i) + shift);
        }
      }
      return result;
    }

    function decrypt(text) {
      let shift = 0;
      for (let i = 0; i < SECRET_KEY.length; i++) shift += SECRET_KEY.charCodeAt(i);
      shift = shift % 1000;
      let result = '';
      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        if (char === '\n') {
          result += char;
        } else {
          result += String.fromCharCode(text.charCodeAt(i) - shift);
        }
      }
      return result;
    }

    function App() {
      const [input, setInput] = useState('');
      const textareaRef = useRef(null);

      // 復号: テキストエリアの内容を復号
      const handleDecrypt = () => {
        if (!input.trim()) return;
        setInput(decrypt(input));
      };

      // 暗号化: テキストエリアの内容を暗号化してテキストエリアに
      const handleEncrypt = () => {
        if (!input.trim()) return;
        setInput(encrypt(input));
      };

      // コピー: テキストエリアの内容をコピー
      const handleCopy = async () => {
        if (!input.trim()) return;
        try { await navigator.clipboard.writeText(input); } catch (err) {}
      };

      // クリア
      const handleClear = () => setInput('');

      // カーソル位置にテキストを挿入
      const insertAtCursor = (textToInsert) => {
        const textarea = textareaRef.current;
        if (!textarea) return;
        const start = textarea.selectionStart;
        const end = textarea.selectionEnd;
        const newText = input.substring(0, start) + textToInsert + input.substring(end);
        setInput(newText);
        // カーソル位置を挿入後に移動
        setTimeout(() => {
          textarea.focus();
          textarea.selectionStart = textarea.selectionEnd = start + textToInsert.length;
        }, 0);
      };

      // リスト挿入
      const handleInsertList = () => insertAtCursor('- ');

      // チェックボックス挿入
      const handleInsertCheckbox = () => insertAtCursor('- [ ] ');

      return (
        <div className="container">
          <div className="textarea-wrapper">
            <div className="textarea-buttons">
              <button className="icon-btn" onClick={handleInsertList}>-</button>
              <button className="icon-btn" onClick={handleInsertCheckbox}>☐</button>
              <button className="icon-btn" onClick={handleDecrypt}>←</button>
              <button className="icon-btn" onClick={handleEncrypt}>→</button>
              <button className="icon-btn" onClick={handleCopy}>copy</button>
            </div>
            <textarea
              ref={textareaRef}
              className="compose-textarea"
              value={input}
              onChange={(e) => setInput(e.target.value)}
            />
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
