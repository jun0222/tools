<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>ango2</title>
  <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      margin: 0;
      padding: 0;
      background: #fff;
      color: #333;
      min-height: 100vh;
    }

    .container {
      max-width: 500px;
      margin: 0 auto;
      padding: 20px;
    }

    .textarea-wrapper {
      position: relative;
    }

    .compose-textarea {
      width: 100%;
      background: #fff;
      border: 1px solid #ccc;
      color: #333;
      font-size: 14px;
      line-height: 1.5;
      resize: vertical;
      outline: none;
      font-family: inherit;
      min-height: 120px;
      padding: 10px;
      padding-top: 32px;
    }

    .compose-textarea:focus {
      border-color: #999;
    }

    .compose-textarea::placeholder {
      color: #999;
    }

    .textarea-buttons {
      position: absolute;
      top: 4px;
      right: 4px;
      display: flex;
      gap: 2px;
    }

    .icon-btn {
      width: 20px;
      height: 20px;
      border: 1px solid #ddd;
      background: #fafafa;
      color: #888;
      cursor: pointer;
      font-size: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
    }

    .icon-btn:hover {
      background: #eee;
      border-color: #bbb;
      color: #555;
    }

    .dot-counter {
      margin-top: 4px;
      font-size: 8px;
      color: #ddd;
      letter-spacing: 0px;
      min-height: 10px;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // 固定の暗号キー（ango2専用）
    const SECRET_KEY = 'ango2_secret_key_2024';

    // 暗号化
    function encrypt(text) {
      let shift = 0;
      for (let i = 0; i < SECRET_KEY.length; i++) {
        shift += SECRET_KEY.charCodeAt(i);
      }
      shift = shift % 1000;

      let result = '';
      for (let i = 0; i < text.length; i++) {
        let code = text.charCodeAt(i);
        let newCode = code + shift;
        result += String.fromCharCode(newCode);
      }
      return result;
    }

    // 復号化
    function decrypt(text) {
      let shift = 0;
      for (let i = 0; i < SECRET_KEY.length; i++) {
        shift += SECRET_KEY.charCodeAt(i);
      }
      shift = shift % 1000;

      let result = '';
      for (let i = 0; i < text.length; i++) {
        let code = text.charCodeAt(i);
        let originalCode = code - shift;
        result += String.fromCharCode(originalCode);
      }
      return result;
    }

    function App() {
      const [messages, setMessages] = useState([]);
      const [input, setInput] = useState('');
      const textareaRef = useRef(null);

      // 初期化
      useEffect(() => {
        const stored = localStorage.getItem('ango2_messages');
        if (stored) {
          setMessages(JSON.parse(stored));
        }
      }, []);

      // 保存
      useEffect(() => {
        localStorage.setItem('ango2_messages', JSON.stringify(messages));
      }, [messages]);

      // 投稿 (Shift+Enter)
      const handlePost = () => {
        if (!input.trim()) return;

        const encrypted = encrypt(input.trim());
        const newMessage = {
          id: Date.now(),
          encrypted: encrypted
        };

        setMessages([newMessage, ...messages]);
        setInput('');
      };

      // クリア
      const handleClear = () => {
        setMessages([]);
      };

      // 全体コピー（暗号文を---区切りで）
      const handleCopyAll = async () => {
        if (messages.length === 0) return;
        const text = messages.map(m => m.encrypted).join('\n---\n');
        try {
          await navigator.clipboard.writeText(text);
        } catch (err) {}
      };

      // クリップボードから復号
      const handleDecryptClipboard = async () => {
        try {
          const clipboardText = await navigator.clipboard.readText();
          if (!clipboardText.trim()) return;

          const parts = clipboardText.split('\n---\n');
          const decrypted = parts.map(part => decrypt(part.trim())).join('\n---\n');

          await navigator.clipboard.writeText(decrypted);
        } catch (err) {}
      };

      // キーボードイベント
      const handleKeyDown = (e) => {
        if (e.key === 'Enter' && e.shiftKey) {
          e.preventDefault();
          handlePost();
        }
      };

      return (
        <div className="container">
          <div className="textarea-wrapper">
            <div className="textarea-buttons">
              <button className="icon-btn" onClick={handleCopyAll} title="コピー">□</button>
              <button className="icon-btn" onClick={handleDecryptClipboard} title="復号">-</button>
              <button className="icon-btn" onClick={handleClear} title="クリア">×</button>
            </div>
            <textarea
              ref={textareaRef}
              className="compose-textarea"
              placeholder=""
              value={input}
              onChange={(e) => setInput(e.target.value)}
              onKeyDown={handleKeyDown}
            />
          </div>
          <div className="dot-counter">{'.'.repeat(messages.length)}</div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
