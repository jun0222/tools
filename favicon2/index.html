<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>アイコンライブラリ - 50+ Icons</title>
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap');

        :root {
            --bg-primary: #0a0a0f;
            --bg-secondary: #15151f;
            --bg-card: #1a1a28;
            --accent-1: #6366f1;
            --accent-2: #8b5cf6;
            --accent-3: #ec4899;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border: #2d2d3d;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Outfit', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            line-height: 1.6;
            overflow-x: hidden;
        }

        .header {
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
            border-bottom: 1px solid var(--border);
            padding: 3rem 2rem;
            text-align: center;
            position: sticky;
            top: 0;
            backdrop-filter: blur(20px);
            z-index: 100;
        }

        h1 {
            font-size: 3rem;
            font-weight: 700;
            background: linear-gradient(135deg, #6366f1 0%, #8b5cf6 50%, #ec4899 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -0.02em;
        }

        .subtitle {
            color: var(--text-secondary);
            font-size: 1.125rem;
            font-weight: 300;
        }

        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .btn {
            background: var(--bg-card);
            border: 1px solid var(--border);
            color: var(--text-primary);
            padding: 0.875rem 1.75rem;
            font-size: 0.9375rem;
            border-radius: 12px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            font-family: 'Outfit', sans-serif;
            position: relative;
            overflow: hidden;
        }

        .btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(99, 102, 241, 0.3), transparent);
            transition: left 0.5s;
        }

        .btn:hover::before {
            left: 100%;
        }

        .btn:hover {
            border-color: var(--accent-1);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(99, 102, 241, 0.3);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            border: none;
        }

        .btn-primary:hover {
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.5);
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2rem;
        }

        .icon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 1.5rem;
            margin-bottom: 4rem;
        }

        .icon-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            position: relative;
        }

        .icon-card:hover {
            border-color: var(--accent-1);
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(99, 102, 241, 0.2);
        }

        .icon-card.selected {
            border-color: var(--accent-2);
            background: linear-gradient(135deg, rgba(99, 102, 241, 0.1) 0%, rgba(139, 92, 246, 0.1) 100%);
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .icon-wrapper svg {
            width: 48px;
            height: 48px;
            transition: transform 0.3s;
        }

        .icon-card:hover .icon-wrapper svg {
            transform: scale(1.1);
        }

        .icon-name {
            font-size: 0.8125rem;
            color: var(--text-secondary);
            text-align: center;
            font-weight: 500;
        }

        .selected-count {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            background: linear-gradient(135deg, var(--accent-1) 0%, var(--accent-2) 100%);
            color: white;
            padding: 1rem 1.5rem;
            border-radius: 50px;
            font-weight: 600;
            box-shadow: 0 8px 32px rgba(99, 102, 241, 0.4);
            z-index: 50;
            display: none;
            animation: slideIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .selected-count.show {
            display: block;
        }

        @keyframes slideIn {
            from {
                transform: translateY(100px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .footer {
            text-align: center;
            padding: 3rem 2rem;
            color: var(--text-secondary);
            border-top: 1px solid var(--border);
            font-size: 0.9375rem;
        }

        @media (max-width: 768px) {
            h1 {
                font-size: 2rem;
            }

            .icon-grid {
                grid-template-columns: repeat(auto-fill, minmax(100px, 1fr));
                gap: 1rem;
            }

            .icon-card {
                padding: 1rem;
            }
        }
    </style>
</head>
<body>
<div class="header">
    <h1>✨ アイコンライブラリ</h1>
    <p class="subtitle">50種類以上の美しいSVGアイコン - クリックして選択、ダウンロード</p>
    <div class="controls">
        <button class="btn btn-primary" onclick="downloadAll()">すべてダウンロード (ZIP)</button>
        <button class="btn" onclick="downloadSelected()">選択したものをダウンロード</button>
        <button class="btn" onclick="selectAll()">すべて選択</button>
        <button class="btn" onclick="clearSelection()">選択解除</button>
    </div>
</div>

<div class="container">
    <div class="icon-grid" id="iconGrid"></div>
</div>

<div class="selected-count" id="selectedCount">
    <span id="countText">0個選択中</span>
</div>

<div class="footer">
    <p>各アイコンをクリックして選択 • SVG形式 • 32×32px • カスタマイズ可能</p>
</div>

        { name: 'unlock', svg: '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><rect x="8" y="14" width="16" height="12" rx="2" fill="#10b981"/><path d="M12 14V10a4 4 0 018 0" fill="none" stroke="#10b981" stroke-width="2.5" stroke-linecap="round"/></svg>' },
        { name: 'eye', svg: '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M2 16s6-10 14-10 14 10 14 10-6 10-14 10S2 16 2 16z" fill="none" stroke="#3b82f6" stroke-width="2.5"/><circle cx="16" cy="16" r="4" fill="#3b82f6"/></svg>' },
        { name: 'eye-off', svg: '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M4 4l24 24M12 12a4 4 0 005 5" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/><path d="M8 8C4 11 2 16 2 16s6 10 14 10c2 0 4-.5 6-1.5M24 24c4-3 6-8 6-8s-6-10-14-10c-2 0-4 .5-6 1.5" fill="none" stroke="#94a3b8" stroke-width="2.5" stroke-linecap="round"/></svg>' },
        { name: 'link', svg: '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M14 18a6 6 0 009-1l3-3a6 6 0 10-9-9l-2 2" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/><path d="M18 14a6 6 0 00-9 1l-3 3a6 6 0 109 9l2-2" fill="none" stroke="#06b6d4" stroke-width="2.5" stroke-linecap="round"/></svg>' },
        { name: 'tag', svg: '<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg"><path d="M4 4h10l14 14-10 10L4 14V4z" fill="#ec4899"/><circle cx="11" cy="11" r="2" fill="#fff"/></svg>' },
    ];

    let selectedIcons = new Set();

    function renderIcons() {
        const grid = document.getElementById('iconGrid');
        grid.innerHTML = icons.map((icon, index) => `
                <div class="icon-card" onclick="toggleSelection(${index})">
                    <div class="icon-wrapper">
                        ${icon.svg}
                    </div>
                    <div class="icon-name">${icon.name}</div>
                </div>
            `).join('');
    }

    function toggleSelection(index) {
        const cards = document.querySelectorAll('.icon-card');
        if (selectedIcons.has(index)) {
            selectedIcons.delete(index);
            cards[index].classList.remove('selected');
        } else {
            selectedIcons.add(index);
            cards[index].classList.add('selected');
        }
        updateSelectedCount();
    }

    function updateSelectedCount() {
        const countElement = document.getElementById('selectedCount');
        const countText = document.getElementById('countText');
        const count = selectedIcons.size;

        if (count > 0) {
            countElement.classList.add('show');
            countText.textContent = `${count}個選択中`;
        } else {
            countElement.classList.remove('show');
        }
    }

    function selectAll() {
        const cards = document.querySelectorAll('.icon-card');
        selectedIcons.clear();
        icons.forEach((_, index) => {
            selectedIcons.add(index);
            cards[index].classList.add('selected');
        });
        updateSelectedCount();
    }

    function clearSelection() {
        const cards = document.querySelectorAll('.icon-card');
        selectedIcons.clear();
        cards.forEach(card => card.classList.remove('selected'));
        updateSelectedCount();
    }

    async function downloadSelected() {
        if (selectedIcons.size === 0) {
            alert('アイコンを選択してください');
            return;
        }

        const zip = new JSZip();
        const folder = zip.folder('selected-icons');

        selectedIcons.forEach(index => {
            const icon = icons[index];
            folder.file(`${icon.name}.svg`, icon.svg);
        });

        const content = await zip.generateAsync({ type: 'blob' });
        downloadBlob(content, 'selected-icons.zip');
    }

    async function downloadAll() {
        const zip = new JSZip();
        const folder = zip.folder('all-icons');

        icons.forEach(icon => {
            folder.file(`${icon.name}.svg`, icon.svg);
        });

        const content = await zip.generateAsync({ type: 'blob' });
        downloadBlob(content, 'all-icons.zip');
    }

    function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement('a');
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
    }

    // 初期化
    renderIcons();
</script>
</body>
</html>
