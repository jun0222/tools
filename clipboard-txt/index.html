<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard to TXT</title>

    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            max-width: 600px;
            width: 90%;
            padding: 40px;
            background: white;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            border-radius: 16px;
        }

        h1 {
            margin: 0 0 10px 0;
            color: #333;
            font-size: 28px;
        }

        .subtitle {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .preview-area {
            background: #f8f9fa;
            border: 2px dashed #ddd;
            border-radius: 8px;
            padding: 20px;
            min-height: 200px;
            max-height: 400px;
            overflow-y: auto;
            margin-bottom: 20px;
            white-space: pre-wrap;
            word-wrap: break-word;
            line-height: 1.6;
            font-size: 14px;
            color: #333;
        }

        .preview-area.empty {
            color: #999;
            display: flex;
            align-items: center;
            justify-content: center;
            font-style: italic;
        }

        button {
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 18px;
            font-weight: 700;
            transition: all 0.2s;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        button:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
        }

        button:active {
            transform: scale(0.98);
        }

        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }

        .status {
            margin-top: 15px;
            padding: 10px;
            border-radius: 6px;
            font-size: 14px;
            text-align: center;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
    </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
    const { useState } = React;

    function App() {
        const [text, setText] = useState("");
        const [status, setStatus] = useState(null);

        const handlePaste = async () => {
            try {
                const clipboardText = await navigator.clipboard.readText();
                if (clipboardText.trim()) {
                    setText(clipboardText);
                    setStatus({ type: 'success', message: 'クリップボードから貼り付けました' });
                    setTimeout(() => setStatus(null), 3000);
                } else {
                    setStatus({ type: 'error', message: 'クリップボードが空です' });
                }
            } catch (err) {
                setStatus({ type: 'error', message: 'クリップボードの読み取りに失敗しました' });
                console.error('Clipboard error:', err);
            }
        };

        const handleDownload = () => {
            if (!text.trim()) {
                setStatus({ type: 'error', message: 'ダウンロードする内容がありません' });
                return;
            }

            // ファイル名を入力させる
            const now = new Date();
            const timestamp = now.toISOString().replace(/[:.]/g, '-').slice(0, -5);
            const defaultFilename = `clipboard_${timestamp}`;

            let filename = prompt('ファイル名を入力してください（拡張子なし）:', defaultFilename);

            // キャンセルされた場合
            if (filename === null) {
                return;
            }

            // 空の場合はデフォルト
            filename = filename.trim() || defaultFilename;

            // .txtを削除（もし入力されていたら）
            filename = filename.replace(/\.txt$/i, '');

            // テキストファイルとしてダウンロード
            const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `${filename}.txt`;

            a.click();
            URL.revokeObjectURL(url);

            setStatus({ type: 'success', message: 'ダウンロードしました！' });
            setTimeout(() => setStatus(null), 3000);
        };

        return (
            <div className="container">
                <h1>📋 Clipboard to TXT</h1>
                <p className="subtitle">クリップボードの内容をテキストファイル化</p>

                <div className={`preview-area ${!text.trim() ? 'empty' : ''}`}>
                    {text.trim() || 'クリップボードから貼り付けた内容がここに表示されます'}
                </div>

                <button
                    onClick={handlePaste}
                    style={{ marginBottom: '10px' }}
                >
                    📋 クリップボードから貼り付け
                </button>

                <button
                    onClick={handleDownload}
                    disabled={!text.trim()}
                >
                    💾 TXTダウンロード
                </button>

                {status && (
                    <div className={`status ${status.type}`}>
                        {status.message}
                    </div>
                )}
            </div>
        );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
</script>

</body>
</html>
