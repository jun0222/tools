<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報</title>
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --bg-secondary: #1a1a1a;
            --accent-yellow: #ffde03;
            --accent-red: #ff2e63;
            --accent-blue: #08d9d6;
            --accent-green: #9dff00;
            --accent-purple: #6c5ce7;
            --text-dark: #1a1a1a;
            --text-light: #f5f0e6;
            --border-weight: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                );
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.4;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            padding: 1.5rem 2rem;
            border-bottom: var(--border-weight) solid var(--text-dark);
            position: relative;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: -0.03em;
            position: relative;
            display: inline-block;
        }

        .logo::before {
            content: '日報';
            position: absolute;
            left: 3px;
            top: 3px;
            color: var(--accent-blue);
            z-index: -1;
        }

        .logo-sub {
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.3rem 0.8rem;
            display: inline-block;
            transform: rotate(-2deg);
            margin-left: 0.8rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .save-status {
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            border: 2px solid var(--text-dark);
            background: white;
        }

        .save-status.saving {
            background: var(--accent-yellow);
        }

        .save-status.saved {
            background: var(--accent-green);
        }

        main {
            max-width: 900px;
            margin: 0 auto;
            padding: 2rem;
        }

        .tabs {
            display: flex;
            gap: 0;
            margin-bottom: -4px;
            position: relative;
            z-index: 1;
        }

        .tab {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.8rem 2rem;
            border: var(--border-weight) solid var(--text-dark);
            background: #e0dbd1;
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s;
            border-bottom: none;
            position: relative;
        }

        .tab:first-child {
            border-right: none;
        }

        .tab:hover:not(.active) {
            background: #d5d0c6;
        }

        .tab.active {
            background: white;
            z-index: 2;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: -4px;
            left: 0;
            right: 0;
            height: 4px;
            background: white;
        }

        .tab-badge {
            font-family: 'DM Mono', monospace;
            font-size: 0.6rem;
            padding: 0.15rem 0.4rem;
            margin-left: 0.5rem;
            color: white;
        }

        .tab-badge.morning {
            background: var(--accent-blue);
        }

        .tab-badge.evening {
            background: var(--accent-purple);
        }

        .control-group {
            border: var(--border-weight) solid var(--text-dark);
            background: white;
            position: relative;
            box-shadow: 6px 6px 0 var(--text-dark);
        }

        .control-content {
            padding: 1.5rem;
        }

        .settings-row {
            display: flex;
            gap: 1rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1.5rem;
            padding-bottom: 1rem;
            border-bottom: 2px dashed #ddd;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .setting-label {
            font-size: 0.8rem;
            font-weight: 500;
        }

        select {
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            padding: 0.5rem 0.8rem;
            border: 3px solid var(--text-dark);
            background: white;
            cursor: pointer;
            outline: none;
        }

        select:focus {
            background: var(--accent-yellow);
        }

        textarea {
            width: 100%;
            font-family: 'DM Mono', monospace;
            font-size: 0.95rem;
            padding: 1rem;
            border: 3px solid var(--text-dark);
            background: var(--bg-primary);
            outline: none;
            resize: vertical;
            line-height: 1.6;
            transition: background 0.2s, box-shadow 0.2s;
            min-height: 300px;
        }

        textarea:focus {
            background: #fffef5;
            box-shadow: inset 0 0 0 2px var(--accent-blue);
        }

        .action-buttons {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-top: 1.5rem;
        }

        .btn-primary {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.8rem 1.5rem;
            border: var(--border-weight) solid var(--text-dark);
            background: var(--accent-green);
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            flex: 1;
            min-width: 140px;
        }

        .btn-primary:hover {
            transform: translate(-3px, -3px);
            box-shadow: 5px 5px 0 var(--text-dark);
        }

        .btn-primary:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .btn-primary.blue {
            background: var(--accent-blue);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: var(--text-light);
            padding: 1rem 2rem;
            font-family: 'DM Mono', monospace;
            border: 3px solid var(--accent-green);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .tab-content {
            animation: fadeIn 0.2s ease-out;
        }
    </style>
</head>
<body>
<div class="noise-overlay"></div>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    const STORAGE_KEY = 'latestReport';

    function App() {
        const [message1, setMessage1] = useState('');
        const [message2, setMessage2] = useState('');
        const [dateFormat, setDateFormat] = useState('short');
        const [saveStatus, setSaveStatus] = useState('saved');
        const [activeTab, setActiveTab] = useState('morning');
        const [toast, setToast] = useState({ show: false, message: '' });

        const saveTimeoutRef = useRef(null);

        // Load from localStorage on mount
        useEffect(() => {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    setMessage1(data.message1 || '');
                    setMessage2(data.message2 || '');
                } catch (e) {
                    console.error('Failed to parse stored data', e);
                }
            }
        }, []);

        // Auto-save with debounce
        const saveToStorage = useCallback(() => {
            const date = getFormattedDate(dateFormat);
            const data = { date, message1, message2 };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            setSaveStatus('saved');
        }, [message1, message2, dateFormat]);

        useEffect(() => {
            setSaveStatus('saving');
            if (saveTimeoutRef.current) {
                clearTimeout(saveTimeoutRef.current);
            }
            saveTimeoutRef.current = setTimeout(() => {
                saveToStorage();
            }, 500);

            return () => {
                if (saveTimeoutRef.current) {
                    clearTimeout(saveTimeoutRef.current);
                }
            };
        }, [message1, message2, saveToStorage]);

        // Get formatted date
        const getFormattedDate = (format) => {
            const today = new Date();
            if (format === 'short') {
                return today.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' });
            } else {
                return today.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' });
            }
        };

        // Show toast
        const showToast = (message) => {
            setToast({ show: true, message });
            setTimeout(() => setToast({ show: false, message: '' }), 2000);
        };

        // Copy handler
        const handleCopy = async () => {
            const date = getFormattedDate(dateFormat);
            const text = activeTab === 'morning'
                ? `${date} ${message1}`
                : `${date} ${message2}`;

            try {
                await navigator.clipboard.writeText(text);
                showToast(activeTab === 'morning' ? '始業メッセージをコピーしました' : '終業メッセージをコピーしました');
            } catch (err) {
                showToast('コピーに失敗しました');
            }
        };

        return (
            <>
                <header>
                    <div className="header-content">
                        <div>
                            <span className="logo">日報</span>
                            <span className="logo-sub">NIPPO</span>
                        </div>
                        <div className="header-right">
                            <span className={`save-status ${saveStatus}`}>
                                {saveStatus === 'saving' ? '保存中...' : '保存済み'}
                            </span>
                        </div>
                    </div>
                </header>

                <main>
                    <div className="tabs">
                        <button
                            className={`tab ${activeTab === 'morning' ? 'active' : ''}`}
                            onClick={() => setActiveTab('morning')}
                        >
                            始業<span className="tab-badge morning">MORNING</span>
                        </button>
                        <button
                            className={`tab ${activeTab === 'evening' ? 'active' : ''}`}
                            onClick={() => setActiveTab('evening')}
                        >
                            終業<span className="tab-badge evening">EVENING</span>
                        </button>
                    </div>

                    <div className="control-group">
                        <div className="control-content">
                            <div className="settings-row">
                                <div className="setting-item">
                                    <span className="setting-label">日付形式:</span>
                                    <select
                                        value={dateFormat}
                                        onChange={(e) => setDateFormat(e.target.value)}
                                    >
                                        <option value="short">11/11</option>
                                        <option value="long">11月11日(月)</option>
                                    </select>
                                </div>
                            </div>

                            <div className="tab-content" key={activeTab}>
                                {activeTab === 'morning' ? (
                                    <textarea
                                        value={message1}
                                        onChange={(e) => setMessage1(e.target.value)}
                                        placeholder="始業メッセージを入力..."
                                    />
                                ) : (
                                    <textarea
                                        value={message2}
                                        onChange={(e) => setMessage2(e.target.value)}
                                        placeholder="終業メッセージを入力..."
                                    />
                                )}
                            </div>

                            <div className="action-buttons">
                                <button
                                    className={`btn-primary ${activeTab === 'morning' ? 'blue' : ''}`}
                                    onClick={handleCopy}
                                >
                                    コピー
                                </button>
                            </div>
                        </div>
                    </div>
                </main>

                <div className={`toast ${toast.show ? 'show' : ''}`}>
                    {toast.message}
                </div>
            </>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
