<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>日報</title>
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --bg-secondary: #1a1a1a;
            --accent-yellow: #ffde03;
            --accent-red: #ff2e63;
            --accent-blue: #08d9d6;
            --accent-green: #9dff00;
            --accent-purple: #6c5ce7;
            --text-dark: #1a1a1a;
            --text-light: #f5f0e6;
            --border-weight: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                );
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.4;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            padding: 1rem 1.5rem;
            border-bottom: var(--border-weight) solid var(--text-dark);
            position: relative;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            max-width: 900px;
            margin: 0 auto;
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(1.5rem, 5vw, 2.5rem);
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: -0.03em;
            position: relative;
            display: inline-block;
        }

        .logo::before {
            content: '日報';
            position: absolute;
            left: 3px;
            top: 3px;
            color: var(--accent-blue);
            z-index: -1;
        }

        .logo-sub {
            font-family: 'DM Mono', monospace;
            font-size: 0.8rem;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.3rem 0.8rem;
            display: inline-block;
            transform: rotate(-2deg);
            margin-left: 0.8rem;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .save-status {
            font-size: 0.75rem;
            padding: 0.4rem 0.8rem;
            border: 2px solid var(--text-dark);
            background: white;
        }

        .save-status.saving {
            background: var(--accent-yellow);
        }

        .save-status.saved {
            background: var(--accent-green);
        }

        main {
            max-width: 1400px;
            margin: 0 auto;
            padding: 1rem;
            display: grid;
            grid-template-columns: 1fr 300px;
            gap: 1rem;
        }

        @media (max-width: 1200px) {
            main {
                grid-template-columns: 1fr;
            }

        .control-group {
            border: var(--border-weight) solid var(--text-dark);
            background: white;
            position: relative;
            box-shadow: 6px 6px 0 var(--text-dark);
        }

        .control-content {
            padding: 1rem;
        }

        .settings-row {
            display: flex;
            gap: 0.8rem;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 1rem;
            padding-bottom: 0.8rem;
            border-bottom: 2px dashed #ddd;
        }

        .setting-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .setting-label {
            font-size: 0.8rem;
            font-weight: 500;
        }

        select {
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            padding: 0.5rem 0.8rem;
            border: 3px solid var(--text-dark);
            background: white;
            cursor: pointer;
            outline: none;

        textarea {

            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;

            background: var(--bg-primary);

        .action-buttons {

            gap: 0.6rem;
            flex-wrap: wrap;
            margin-top: 1rem;
        }

        .btn-primary {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.6rem 1.2rem;
            border: 3px solid var(--text-dark);
            background: var(--accent-green);
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
            flex: 1;
            min-width: 120px;
        }

        .btn-primary:hover {
            transform: translate(-3px, -3px);
            box-shadow: 5px 5px 0 var(--text-dark);
        }

        .btn-primary:active {
            transform: translate(0, 0);

        }

        .btn-primary.blue {
            background: var(--accent-blue);
        }

        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: var(--text-light);
            padding: 1rem 2rem;
            font-family: 'DM Mono', monospace;
            border: 3px solid var(--accent-green);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }

        .gantt-container {
            margin-top: 1rem;
            padding-top: 0.8rem;
            border-top: 2px dashed #ddd;
        }

        .gantt-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            margin-bottom: 0.6rem;
        }

        .gantt {
            border: 3px solid var(--text-dark);
            background: white;
        }

        .gantt-header {
            display: flex;
            border-bottom: 2px solid var(--text-dark);
            background: var(--bg-primary);
        }

        .gantt-time-slot {
            flex: 1;
            text-align: left;
            font-size: 0.55rem;
            padding: 0.3rem 0 0.3rem 0.2rem;
            border-right: 1px solid #ddd;
            color: #666;
        }

        .gantt-time-slot.hour-mark {
            font-weight: 500;
            border-right: 2px solid #999;
            border-left: 2px solid #999;
        }

        .gantt-time-slot:last-child {
            border-right: none;
        }

        .gantt-rows {
            position: relative;
            min-height: 24px;
        }

        .gantt-grid {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            display: flex;
        }

        .gantt-grid-col {
            flex: 1;
            border-right: 1px dashed #eee;
        }

        .gantt-grid-col:last-child {
            border-right: none;
        }

        .gantt-row {
            position: relative;
            height: 24px;
            border-bottom: 1px solid #eee;
        }

        .gantt-row:last-child {
            border-bottom: none;
        }

        .gantt-bar {
            position: absolute;
            top: 2px;
            height: 18px;
            border: 2px solid var(--text-dark);
            display: flex;
            align-items: center;
            padding: 0 0.3rem;
            font-size: 0.6rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            min-width: 20px;
            cursor: pointer;
        }

        .gantt-bar:hover::after {
            content: attr(data-label);
            position: absolute;
            left: 50%;
            bottom: calc(100% + 8px);
            transform: translateX(-50%);
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.4rem 0.8rem;
            border-radius: 4px;
            white-space: nowrap;
            z-index: 100;
            font-size: 0.7rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .gantt-bar:hover::before {
            content: '';
            position: absolute;
            left: 50%;
            bottom: calc(100% + 2px);
            transform: translateX(-50%);
            border: 6px solid transparent;
            border-top-color: var(--text-dark);
            z-index: 100;
        }

        .gantt-bar.default {
            background: #ccc;
            color: #666;
        }

        .gantt-bar.completed {
            background: var(--accent-green);
            color: var(--text-dark);
        }

        .gantt-bar.in-progress {
            background: var(--accent-blue);
            color: var(--text-dark);
        }

        .gantt-check {
            position: absolute;
            right: 100%;
            margin-right: 0.3rem;
            color: #22c55e;
            font-weight: bold;
        }

        .gantt-progress {
            position: absolute;
            right: 100%;
            margin-right: 0.5rem;
            width: 40px;
            height: 16px;
            border: 2px solid var(--text-dark);
            background: white;
            overflow: hidden;
        }

        .gantt-progress-fill {
            height: 100%;
            background: var(--accent-blue);
            animation: progress-animation 2s ease-in-out infinite;
        }

        @keyframes progress-animation {
            0%, 100% { width: 30%; }
            50% { width: 70%; }
        }


        .gantt-empty {
            text-align: center;
            color: #999;
            font-size: 0.75rem;
            padding: 1rem;
        }

        .summary-section {
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
        }

        .summary-group {
            border: 2px solid var(--text-dark);
            background: white;
            box-shadow: 3px 3px 0 var(--text-dark);
        }

        .summary-header {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.4rem 0.8rem;
            border-bottom: 2px solid var(--text-dark);
        }

        .summary-header.completed {
            background: var(--accent-green);
        }

        .summary-header.in-progress {
            background: var(--accent-blue);
        }

        .summary-header.default {
            background: #ccc;
        }

        .summary-items {
            padding: 0.6rem;
        }

        .summary-item {
            font-size: 0.65rem;
            padding: 0.3rem 0;
            border-bottom: 1px dashed #eee;
            line-height: 1.3;
        }

        .summary-item:last-child {
            border-bottom: none;
        }

        .summary-time {
            color: #666;
            font-size: 0.6rem;
        }

        .summary-empty {
            text-align: center;
            color: #999;
            font-size: 0.6rem;
            padding: 0.6rem;
        }
    </style>
</head>
<body>
<div class="noise-overlay"></div>
<div id="root"></div>

<script type="text/babel">
    const { useState, useEffect, useRef, useCallback, useMemo } = React;

    const STORAGE_KEY = 'latestReport';

    // Parse time entries from text
    function parseTimeEntries(text) {
        const lines = text.split('\n');
        const entries = [];
        // Match time range: HH:MM~HH:MM or HH:MM〜HH:MM or HH:MM-HH:MM (with optional 完了 at end)
        const timeRangeRegex = /(\d{1,2}):(\d{2})\s*[~〜\-]\s*(\d{1,2}):(\d{2})/g;
        // Match single time: HH:MM
        const singleTimeRegex = /(\d{1,2}):(\d{2})/g;
        // Check for 完了 at end of line
        const completedRegex = /完了\s*$/;
        // Check for 進行中 at end of line
        const inProgressRegex = /進行中\s*$/;

        for (const line of lines) {
            const isCompleted = completedRegex.test(line);
            const isInProgress = inProgressRegex.test(line);
            const lineWithoutStatus = line.replace(completedRegex, '').replace(inProgressRegex, '').trim();

            // Extract label: text after ・ (no character limit)
            let label = '';
            const bulletIndex = lineWithoutStatus.indexOf('・');
            if (bulletIndex !== -1) {
                const afterBullet = lineWithoutStatus.slice(bulletIndex + 1).trim();
                // Remove all time patterns to get the label
                const withoutTimes = afterBullet.replace(/\d{1,2}:\d{2}\s*[~〜\-]?\s*\d{0,2}:?\d{0,2}/g, '').replace(/[,、]/g, '').trim();
                label = withoutTimes;
            } else {
                const withoutTimes = lineWithoutStatus.replace(/\d{1,2}:\d{2}\s*[~〜\-]?\s*\d{0,2}:?\d{0,2}/g, '').replace(/[,、]/g, '').trim();
                label = withoutTimes;
            }

            // Split by comma or 、 to get multiple time ranges
            const timeSegments = lineWithoutStatus.split(/[,、]/);
            const lineEntries = [];

            for (const segment of timeSegments) {
                const trimmedSegment = segment.trim();
                let startHours, startMinutes, endHours, endMinutes, hasEndTime = false;

                // Reset regex lastIndex
                timeRangeRegex.lastIndex = 0;
                const rangeMatch = timeRangeRegex.exec(trimmedSegment);

                if (rangeMatch) {
                    startHours = parseInt(rangeMatch[1], 10);
                    startMinutes = parseInt(rangeMatch[2], 10);
                    endHours = parseInt(rangeMatch[3], 10);
                    endMinutes = parseInt(rangeMatch[4], 10);
                    hasEndTime = true;
                } else {
                    singleTimeRegex.lastIndex = 0;
                    const singleMatch = singleTimeRegex.exec(trimmedSegment);
                    if (singleMatch) {
                        startHours = parseInt(singleMatch[1], 10);
                        startMinutes = parseInt(singleMatch[2], 10);
                    }
                }

                if (startHours !== undefined && startHours >= 0 && startHours <= 23 && startMinutes >= 0 && startMinutes <= 59) {
                    const timeStr = hasEndTime
                        ? `${startHours}:${String(startMinutes).padStart(2, '0')}~${endHours}:${String(endMinutes).padStart(2, '0')}`
                        : `${startHours}:${String(startMinutes).padStart(2, '0')}`;

                    lineEntries.push({
                        hours: startHours,
                        minutes: startMinutes,
                        endHours: hasEndTime ? endHours : null,
                        endMinutes: hasEndTime ? endMinutes : null,
                        hasEndTime,
                        time: timeStr,
                        label: label || '---',
                        completed: isCompleted,
                        inProgress: isInProgress,
                        lineGroup: entries.length, // Track which line this belongs to
                    });
                }
            }

            // Add all entries from this line
            if (lineEntries.length > 0) {
                entries.push(...lineEntries);
            }
        }

        return entries.sort((a, b) => {
            // First sort by lineGroup to keep entries from the same line together
            if (a.lineGroup !== b.lineGroup) {
                return a.lineGroup - b.lineGroup;
            }
            // Then sort by time within the same line
            return a.hours * 60 + a.minutes - (b.hours * 60 + b.minutes);
        });
    }

    // Summary component
    function Summary({ entries, onCopySummary }) {
        const completed = entries.filter(e => e.completed);
        const inProgress = entries.filter(e => e.inProgress && !e.completed);
        const pending = entries.filter(e => !e.completed && !e.inProgress);

        // Group by lineGroup to avoid duplicates and collect all times
        const groupByLine = (items) => {
            const groups = {};
            items.forEach(item => {
                if (!groups[item.lineGroup]) {
                    const allTimes = items.filter(i => i.lineGroup === item.lineGroup).map(i => i.time);
                    groups[item.lineGroup] = { ...item, allTimes };
                }
            });
            return Object.values(groups);
        };

        const completedItems = groupByLine(completed);
        const inProgressItems = groupByLine(inProgress);
        const pendingItems = groupByLine(pending);

        return (
            <div className="summary-section">
                <div className="summary-group">
                    <div className="summary-header completed">完了 ({completedItems.length})</div>
                    <div className="summary-items">
                        {completedItems.length > 0 ? (
                            completedItems.map((item, idx) => (
                                <div key={idx} className="summary-item">
                                    ・{item.label}
                                    <div className="summary-time">{item.allTimes.join(', ')}</div>
                                </div>
                            ))
                        ) : (
                            <div className="summary-empty">なし</div>
                        )}
                    </div>
                </div>

                <div className="summary-group">
                    <div className="summary-header in-progress">進行中 ({inProgressItems.length})</div>
                    <div className="summary-items">
                        {inProgressItems.length > 0 ? (
                            inProgressItems.map((item, idx) => (
                                <div key={idx} className="summary-item">
                                    ・{item.label}
                                    <div className="summary-time">{item.allTimes.join(', ')}</div>
                                </div>
                            ))
                        ) : (
                            <div className="summary-empty">なし</div>
                        )}
                    </div>
                </div>

                <div className="summary-group">
                    <div className="summary-header default">未着手 ({pendingItems.length})</div>
                    <div className="summary-items">
                        {pendingItems.length > 0 ? (
                            pendingItems.map((item, idx) => (
                                <div key={idx} className="summary-item">
                                    ・{item.label}
                                    <div className="summary-time">{item.allTimes.join(', ')}</div>
                                </div>
                            ))
                        ) : (
                            <div className="summary-empty">なし</div>
                        )}
                    </div>
                </div>

                <button className="btn-primary" onClick={onCopySummary}>
                    サマリをコピー
                </button>
            </div>
        );
    }

    // Gantt chart component
    function Gantt({ text }) {
        const entries = useMemo(() => parseTimeEntries(text), [text]);
        const startHour = 6;
        const endHour = 24;
        const totalHours = endHour - startHour;
        const totalMinutes = totalHours * 60;

        const getPosition = (hours, minutes) => {
            const mins = (hours - startHour) * 60 + minutes;
            return Math.max(0, Math.min(100, (mins / totalMinutes) * 100));
        };

        // Calculate bar width (use end time if specified, otherwise default 30 minutes)
        const getWidth = (entry) => {
            const currentMins = entry.hours * 60 + entry.minutes;
            let endMins;

            if (entry.hasEndTime) {
                // Use specified end time
                endMins = entry.endHours * 60 + entry.endMinutes;
            } else {
                // Default to 30 minutes if no end time specified
                endMins = currentMins + 30;
            }

            const durationMins = endMins - currentMins;
            return Math.max(1, (durationMins / totalMinutes) * 100);
        };

        // Generate 5-minute time slots
        const timeSlots = [];
        for (let h = startHour; h < endHour; h++) {
            for (let m = 0; m < 60; m += 5) {
                timeSlots.push({ hour: h, minute: m });
            }
        }

        // Group entries by lineGroup to display on the same row
        const groupedEntries = useMemo(() => {
            const groups = {};
            entries.forEach(entry => {
                if (!groups[entry.lineGroup]) {
                    groups[entry.lineGroup] = [];
                }
                groups[entry.lineGroup].push(entry);
            });
            return Object.values(groups);
        }, [entries]);

        if (entries.length === 0) {
            return (
                <div className="gantt-container">
                    <div className="gantt-label">Gantt Chart (5分刻み)</div>
                    <div className="gantt-empty">
                        行末に時間 (例: 10:00~11:00, 13:00~14:00) を入力するとガントチャートに表示されます
                    </div>
                </div>
            );
        }

        return (
            <div className="gantt-container">
                <div className="gantt-label">Gantt Chart (5分刻み)</div>
                <div className="gantt">
                    <div className="gantt-header">
                        {timeSlots.map((slot, idx) => (
                            <div
                                key={idx}
                                className={`gantt-time-slot ${slot.minute === 0 ? 'hour-mark' : ''}`}
                            >
                                {slot.minute === 0 ? slot.hour : ''}
                            </div>
                        ))}
                    </div>
                    <div className="gantt-rows">
                        <div className="gantt-grid">
                            {timeSlots.map((slot, idx) => (
                                <div key={idx} className="gantt-grid-col" />
                            ))}
                        </div>
                        {groupedEntries.map((group, groupIdx) => (
                            <div key={groupIdx} className="gantt-row">
                                {group.map((entry, entryIdx) => {
                                    const statusClass = entry.completed ? 'completed' : entry.inProgress ? 'in-progress' : 'default';
                                    return (
                                        <div
                                            key={entryIdx}
                                            className={`gantt-bar ${statusClass}`}
                                            data-label={entry.label}
                                            style={{
                                                left: `${getPosition(entry.hours, entry.minutes)}%`,
                                                width: `${getWidth(entry)}%`,
                                            }}
                                        >
                                            {entry.completed && entryIdx === 0 && <span className="gantt-check">✓</span>}
                                            {entry.inProgress && entryIdx === 0 && (
                                                <div className="gantt-progress">
                                                    <div className="gantt-progress-fill" />
                                                </div>
                                            )}
                                        </div>
                                    );
                                })}
                            </div>
                        ))}
                    </div>
                </div>
            </div>
        );
    }

    function App() {
        const [message, setMessage] = useState('');
        const [dateFormat, setDateFormat] = useState('long');
        const [saveStatus, setSaveStatus] = useState('saved');
        const [toast, setToast] = useState({ show: false, message: '' });

        const saveTimeoutRef = useRef(null);

        // Load from localStorage on mount
        useEffect(() => {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                try {
                    const data = JSON.parse(stored);
                    setMessage(data.message || data.message1 || '');
                } catch (e) {
                    console.error('Failed to parse stored data', e);
                }
            }
        }, []);

        // Auto-save with debounce
        const saveToStorage = useCallback(() => {
            const date = getFormattedDate(dateFormat);
            const data = { date, message };
            localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
            setSaveStatus('saved');
        }, [message, dateFormat]);

        useEffect(() => {
            setSaveStatus('saving');
            if (saveTimeoutRef.current) {
                clearTimeout(saveTimeoutRef.current);
            }
            saveTimeoutRef.current = setTimeout(() => {
                saveToStorage();
            }, 500);

            return () => {
                if (saveTimeoutRef.current) {
                    clearTimeout(saveTimeoutRef.current);
                }
            };
        }, [message, saveToStorage]);

        // Get formatted date
        const getFormattedDate = (format) => {
            const today = new Date();
            if (format === 'short') {
                return today.toLocaleDateString('ja-JP', { month: '2-digit', day: '2-digit' });
            } else {
                return today.toLocaleDateString('ja-JP', { month: 'numeric', day: 'numeric', weekday: 'short' });
            }
        };

        // Show toast
        const showToast = (message) => {
            setToast({ show: true, message });
            setTimeout(() => setToast({ show: false, message: '' }), 2000);
        };

        // Copy handler
        const handleCopy = async () => {
            const date = getFormattedDate(dateFormat);
            const text = `${date}\n${message}`;

            try {
                await navigator.clipboard.writeText(text);
                showToast('メッセージをコピーしました');
            } catch (err) {
                showToast('コピーに失敗しました');
            }
        };

        // Copy summary handler
        const handleCopySummary = async () => {
            const date = getFormattedDate(dateFormat);
            const entries = parseTimeEntries(message);

            // Group by lineGroup to avoid duplicates
            const groupByLine = (items) => {
                const groups = {};
                items.forEach(item => {
                    if (!groups[item.lineGroup]) {
                        // Collect all times for this line group
                        const allTimes = items.filter(i => i.lineGroup === item.lineGroup).map(i => i.time);
                        groups[item.lineGroup] = { ...item, allTimes };
                    }
                });
                return Object.values(groups);
            };

            const completed = groupByLine(entries.filter(e => e.completed));
            const inProgress = groupByLine(entries.filter(e => e.inProgress && !e.completed));
            const pending = groupByLine(entries.filter(e => !e.completed && !e.inProgress));

            let summaryText = `${date}\n`;

            if (completed.length > 0) {
                summaryText += '\n【完了】\n';
                completed.forEach(item => {
                    const times = item.allTimes.join(', ');
                    summaryText += `・${item.label} ${times}\n`;
                });
            }

            if (inProgress.length > 0) {
                summaryText += '\n【進行中】\n';
                inProgress.forEach(item => {
                    const times = item.allTimes.join(', ');
                    summaryText += `・${item.label} ${times}\n`;
                });
            }

            if (pending.length > 0) {
                summaryText += '\n【未着手】\n';
                pending.forEach(item => {
                    const times = item.allTimes.join(', ');
                    summaryText += `・${item.label} ${times}\n`;
                });
            }

            try {
                await navigator.clipboard.writeText(summaryText);
                showToast('サマリをコピーしました');
            } catch (err) {
                showToast('コピーに失敗しました');
            }
        };

        return (
            <>
                <header>
                    <div className="header-content">
                        <div>
                            <span className="logo">日報</span>
                            <span className="logo-sub">NIPPO</span>
                        </div>
                        <div className="header-right">
                            <span className={`save-status ${saveStatus}`}>
                                {saveStatus === 'saving' ? '保存中...' : '保存済み'}
                            </span>
                        </div>
                    </div>
                </header>

                <main>
                    <div className="control-group">
                        <div className="control-content">
                            <div className="settings-row">
                                <div className="setting-item">
                                    <span className="setting-label">日付形式:</span>
                                    <select
                                        value={dateFormat}
                                        onChange={(e) => setDateFormat(e.target.value)}
                                    >
                                        <option value="short">11/11</option>
                                        <option value="long">11月11日(月)</option>
                                    </select>
                                </div>
                            </div>

                            <textarea
                                value={message}
                                onChange={(e) => setMessage(e.target.value)}
                                placeholder="メッセージを入力... (例: 10:00~11:00, 13:00~14:00 ・会議 完了)"
                            />
                            <Gantt text={message} />

                            <div className="action-buttons">
                                <button
                                    className="btn-primary blue"
                                    onClick={handleCopy}
                                >
                                    コピー
                                </button>
                            </div>
                        </div>
                    </div>

                    <Summary entries={parseTimeEntries(message)} onCopySummary={handleCopySummary} />
                </main>

                <div className={`toast ${toast.show ? 'show' : ''}`}>
                    {toast.message}
                </div>
            </>
        );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
