<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>インターバル音声生成</title>
    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/lamejs@1.2.0/lame.min.js"></script>
    <style>
        body {
            min-height: 100vh;
        }

        .progress-bar {
            transition: width 0.3s ease;
        }
    </style>
</head>
<body class="bg-gradient-to-br from-indigo-50 via-white to-purple-50">

    <div class="max-w-2xl mx-auto p-6 min-h-screen flex items-center justify-center">
        <div class="bg-white rounded-3xl shadow-2xl p-8 w-full">

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-slate-800 mb-2">🔊 インターバル音声生成</h1>
                <p class="text-sm text-slate-500">バックグラウンド再生用の音声ファイルを作成</p>
            </div>

            <!-- 設定エリア -->
            <div class="space-y-6 mb-8">
                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        インターバル（秒）
                    </label>
                    <input
                        type="number"
                        id="interval"
                        value="20"
                        min="5"
                        max="300"
                        class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-lg font-bold text-center focus:outline-none focus:border-indigo-400"
                    >
                </div>

                <div>
                    <label class="block text-sm font-semibold text-slate-700 mb-2">
                        繰り返し回数
                    </label>
                    <input
                        type="number"
                        id="repeat"
                        value="7"
                        min="1"
                        max="100"
                        class="w-full border-2 border-slate-200 rounded-xl px-4 py-3 text-lg font-bold text-center focus:outline-none focus:border-indigo-400"
                    >
                </div>
            </div>

            <!-- プレビュー情報 -->
            <div class="bg-gradient-to-r from-indigo-500 to-purple-500 text-white rounded-2xl p-6 mb-6">
                <div class="text-center">
                    <div class="text-sm opacity-80 mb-1">総時間</div>
                    <div class="text-3xl font-black" id="totalTime">2分20秒</div>
                    <div class="text-xs opacity-80 mt-2">
                        ファイル名: interval_<span id="filenamePrev">20s_x7</span>.mp3
                    </div>
                </div>
            </div>

            <!-- 生成ボタン -->
            <button
                onclick="generateAudio()"
                id="generateBtn"
                class="w-full bg-gradient-to-r from-indigo-500 to-purple-500 hover:from-indigo-600 hover:to-purple-600 text-white font-bold py-4 rounded-2xl shadow-lg transition-all text-lg mb-4"
            >
                音声ファイルを生成
            </button>

            <!-- プログレスバー -->
            <div id="progressContainer" class="mt-6 hidden">
                <div class="flex justify-between items-center mb-2">
                    <span class="text-sm font-medium text-slate-600">生成中...</span>
                    <span class="text-sm font-bold text-indigo-600" id="progressText">0%</span>
                </div>
                <div class="w-full bg-slate-200 rounded-full h-3 overflow-hidden">
                    <div class="progress-bar bg-gradient-to-r from-indigo-500 to-purple-500 h-3 rounded-full" id="progressBar" style="width: 0%"></div>
                </div>
            </div>

            <!-- 説明 -->
            <div class="mt-8 p-4 bg-slate-50 rounded-xl">
                <p class="text-xs text-slate-600 leading-relaxed">
                    <strong>使い方：</strong><br>
                    1. インターバル秒数と繰り返し回数を設定<br>
                    2. 「音声ファイルを生成」ボタンをクリック<br>
                    3. 生成された音声ファイル(.mp3)をダウンロード<br>
                    4. スマホなどで再生してバックグラウンドでタイマーとして使用<br><br>
                    <strong>仕組み：</strong><br>
                    インターバル経過後、毎回ビープ音が鳴ります。<br>
                    最後のビープ音だけ3回鳴るので、終了がわかります。<br>
                    ファイル名に繰り返し回数が記録されているので、何周したかわかります。
                </p>
            </div>

        </div>
    </div>

    <script>
        const intervalInput = document.getElementById('interval');
        const repeatInput = document.getElementById('repeat');
        const totalTimeDisplay = document.getElementById('totalTime');
        const filenamePrev = document.getElementById('filenamePrev');
        const generateBtn = document.getElementById('generateBtn');
        const progressContainer = document.getElementById('progressContainer');
        const progressBar = document.getElementById('progressBar');
        const progressText = document.getElementById('progressText');

        // 総時間とファイル名プレビューの更新
        function updatePreview() {
            const interval = parseInt(intervalInput.value) || 0;
            const repeat = parseInt(repeatInput.value) || 0;
            const totalSeconds = interval * repeat;

            const minutes = Math.floor(totalSeconds / 60);
            const seconds = totalSeconds % 60;

            totalTimeDisplay.textContent = `${minutes}分${seconds.toString().padStart(2, '0')}秒`;
            filenamePrev.textContent = `${interval}s_x${repeat}`;
        }

        // イベントリスナー
        intervalInput.addEventListener('input', updatePreview);
        repeatInput.addEventListener('input', updatePreview);

        // 音声生成メイン処理
        async function generateAudio() {
            const interval = parseInt(intervalInput.value);
            const repeat = parseInt(repeatInput.value);

            if (!interval || !repeat) {
                alert('インターバルと繰り返し回数を入力してください');
                return;
            }

            // UI更新
            generateBtn.disabled = true;
            generateBtn.textContent = '生成中...';
            progressContainer.classList.remove('hidden');
            progressBar.style.width = '0%';
            progressText.textContent = '0%';

            try {
                await generateIntervalAudio(interval, repeat);
            } catch (error) {
                console.error('Error:', error);
                alert('音声生成に失敗しました: ' + error.message);
            } finally {
                // UI復元
                generateBtn.disabled = false;
                generateBtn.textContent = '音声ファイルを生成';
                progressContainer.classList.add('hidden');
            }
        }

        // 音声生成処理
        async function generateIntervalAudio(interval, repeat) {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const sampleRate = audioContext.sampleRate;

            // ビープ音の設定
            const beepDuration = 0.2; // ビープ音の長さ（秒）
            const beepGap = 0.15; // ビープ音の間隔（秒）

            // 全体の長さを計算（最後だけ3回分のビープ音を考慮）
            const totalDuration = (interval + beepDuration) * repeat + beepGap * 2 + beepDuration * 2;
            const totalSamples = Math.floor(totalDuration * sampleRate);

            const audioBuffer = audioContext.createBuffer(1, totalSamples, sampleRate);
            const channelData = audioBuffer.getChannelData(0);

            let currentPos = 0;

            // 各インターバルでビープ音を生成
            for (let i = 0; i < repeat; i++) {
                const progress = ((i + 1) / repeat * 100).toFixed(0);
                progressBar.style.width = progress + '%';
                progressText.textContent = progress + '%';

                // インターバル分進める
                currentPos += Math.floor(interval * sampleRate);

                const isLastBeep = (i === repeat - 1);
                const beepCount = isLastBeep ? 3 : 1;

                // ビープ音を生成
                for (let b = 0; b < beepCount; b++) {
                    const beepStartPos = currentPos;
                    const beepSamples = Math.floor(beepDuration * sampleRate);

                    // ビープ音を生成（800Hz）
                    for (let j = 0; j < beepSamples && (beepStartPos + j) < totalSamples; j++) {
                        const t = j / sampleRate;
                        const envelope = Math.exp(-t * 8); // エンベロープ
                        channelData[beepStartPos + j] = Math.sin(2 * Math.PI * 800 * t) * envelope * 0.4;
                    }

                    currentPos += beepSamples;

                    // ビープの間に隙間を追加（最後のビープ以外）
                    if (b < beepCount - 1) {
                        currentPos += Math.floor(beepGap * sampleRate);
                    }
                }

                // 少し待機（UIの更新のため）
                await new Promise(resolve => setTimeout(resolve, 10));
            }

            // MP3ファイルに変換
            const mp3Blob = audioBufferToMp3(audioBuffer);

            // ダウンロード
            const url = URL.createObjectURL(mp3Blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `interval_${interval}s_x${repeat}.mp3`;
            a.click();
            URL.revokeObjectURL(url);

            alert(`音声ファイルの生成が完了しました！\n\nファイル名: interval_${interval}s_x${repeat}.mp3\n繰り返し回数: ${repeat}回\n（最後のビープ音は3回鳴ります）`);
        }

        // AudioBufferをMP3ファイルに変換
        function audioBufferToMp3(buffer) {
            const channels = 1; // モノラル
            const sampleRate = buffer.sampleRate;
            const samples = buffer.getChannelData(0);

            // Float32ArrayをInt16Arrayに変換
            const int16Samples = new Int16Array(samples.length);
            for (let i = 0; i < samples.length; i++) {
                const s = Math.max(-1, Math.min(1, samples[i]));
                int16Samples[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
            }

            // MP3エンコーダーを初期化
            const mp3encoder = new lamejs.Mp3Encoder(channels, sampleRate, 128);
            const mp3Data = [];

            const sampleBlockSize = 1152; // MP3フレームサイズ
            for (let i = 0; i < int16Samples.length; i += sampleBlockSize) {
                const sampleChunk = int16Samples.subarray(i, i + sampleBlockSize);
                const mp3buf = mp3encoder.encodeBuffer(sampleChunk);
                if (mp3buf.length > 0) {
                    mp3Data.push(mp3buf);
                }
            }

            // 最後のフレームを書き込み
            const mp3buf = mp3encoder.flush();
            if (mp3buf.length > 0) {
                mp3Data.push(mp3buf);
            }

            return new Blob(mp3Data, { type: 'audio/mp3' });
        }

        // 初期化
        updatePreview();
    </script>

</body>
</html>
