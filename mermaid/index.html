<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mermaid Viewer</title>
    <link rel="icon" href="../img/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    <style>
        :root {
            --bg-primary: #f5f0e6;
            --bg-secondary: #1a1a1a;
            --accent-yellow: #ffde03;
            --accent-red: #ff2e63;
            --accent-blue: #08d9d6;
            --accent-green: #9dff00;
            --accent-purple: #6c5ce7;
            --text-dark: #1a1a1a;
            --text-light: #f5f0e6;
            --border-weight: 4px;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'DM Mono', monospace;
            background: var(--bg-primary);
            min-height: 100vh;
            overflow-x: hidden;
            background-image:
                repeating-linear-gradient(
                    0deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                ),
                repeating-linear-gradient(
                    90deg,
                    transparent,
                    transparent 50px,
                    rgba(0,0,0,0.03) 50px,
                    rgba(0,0,0,0.03) 51px
                );
        }

        .noise-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.4;
            z-index: 1000;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
        }

        header {
            padding: 2rem;
            border-bottom: var(--border-weight) solid var(--text-dark);
            position: relative;
            overflow: hidden;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            font-family: 'Archivo Black', sans-serif;
            font-size: clamp(1.5rem, 6vw, 3rem);
            color: var(--text-dark);
            text-transform: uppercase;
            letter-spacing: -0.03em;
            position: relative;
            display: inline-block;
        }

        .logo::before {
            content: 'MERMAID';
            position: absolute;
            left: 3px;
            top: 3px;
            color: var(--accent-purple);
            z-index: -1;
        }

        .logo-sub {
            font-family: 'DM Mono', monospace;
            font-size: 0.9rem;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.3rem 0.8rem;
            display: inline-block;
            transform: rotate(-2deg);
            margin-left: 1rem;
        }

        .tagline {
            font-size: 0.85rem;
            color: var(--text-dark);
            opacity: 0.7;
            max-width: 300px;
        }

        main {
            display: grid;
            grid-template-columns: 1fr 1fr;
            min-height: calc(100vh - 120px);
        }

        @media (max-width: 900px) {
            main {
                grid-template-columns: 1fr;
            }
        }

        .editor-panel {
            padding: 1.5rem;
            border-right: var(--border-weight) solid var(--text-dark);
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .control-group {
            border: var(--border-weight) solid var(--text-dark);
            background: white;
            position: relative;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .control-label {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.5rem 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .control-content {
            padding: 1rem;
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            flex: 1;
            min-height: 300px;
            font-family: 'DM Mono', monospace;
            font-size: 0.9rem;
            padding: 1rem;
            border: 3px solid var(--text-dark);
            background: var(--bg-primary);
            outline: none;
            resize: none;
            line-height: 1.6;
            transition: all 0.2s;
        }

        textarea:focus {
            background: #fffef5;
            transform: translate(-2px, -2px);
            box-shadow: 4px 4px 0 var(--text-dark);
        }

        .template-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            margin-bottom: 1rem;
        }

        .template-btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.75rem;
            padding: 0.5rem 0.8rem;
            border: 2px solid var(--text-dark);
            background: white;
            cursor: pointer;
            transition: all 0.15s;
        }

        .template-btn:hover {
            background: var(--accent-yellow);
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--text-dark);
        }

        .snippets-section {
            border-top: 2px dashed var(--text-dark);
            padding-top: 0.8rem;
            margin-top: 0.5rem;
        }

        .snippets-label {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #666;
            margin-bottom: 0.5rem;
        }

        .snippets-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 0.3rem;
        }

        .snippet-btn {
            font-family: 'DM Mono', monospace;
            font-size: 0.7rem;
            padding: 0.3rem 0.5rem;
            border: 1px solid #ccc;
            background: #f8f8f8;
            cursor: pointer;
            transition: all 0.1s;
            border-radius: 2px;
        }

        .snippet-btn:hover {
            background: var(--accent-blue);
            border-color: var(--accent-blue);
            color: var(--text-dark);
        }

        .snippet-btn.copied {
            background: var(--accent-green);
            border-color: var(--accent-green);
        }

        .preview-panel {
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            background:
                repeating-linear-gradient(
                    45deg,
                    #e8e3d9,
                    #e8e3d9 10px,
                    #f5f0e6 10px,
                    #f5f0e6 20px
                );
            position: relative;
        }

        .preview-container {
            flex: 1;
            border: var(--border-weight) solid var(--text-dark);
            background: white;
            position: relative;
            box-shadow: 8px 8px 0 var(--text-dark);
            overflow: hidden;
        }

        .preview-label {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 0.15em;
            background: var(--accent-purple);
            color: white;
            padding: 0.4rem 0.8rem;
            position: absolute;
            top: -12px;
            left: 20px;
            transform: rotate(-3deg);
            z-index: 10;
        }

        .zoom-controls {
            position: absolute;
            bottom: 1rem;
            right: 1rem;
            display: flex;
            gap: 0.3rem;
            z-index: 10;
            background: white;
            padding: 0.3rem;
            border: 2px solid var(--text-dark);
        }

        .zoom-btn {
            width: 32px;
            height: 32px;
            border: 2px solid var(--text-dark);
            background: white;
            font-family: 'DM Mono', monospace;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.1s;
        }

        .zoom-btn:hover {
            background: var(--accent-yellow);
        }

        .zoom-level {
            min-width: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.75rem;
            font-weight: 500;
            border: 2px solid var(--text-dark);
            background: var(--bg-primary);
        }

        #mermaid-output {
            padding: 2rem;
            min-height: 100%;
            cursor: grab;
            transform-origin: 0 0;
            transition: none;
        }

        #mermaid-output.dragging {
            cursor: grabbing;
        }

        #mermaid-output svg {
            display: block;
        }

        .error-message {
            color: var(--accent-red);
            font-size: 0.85rem;
            padding: 1rem;
            background: #fff0f3;
            border: 2px solid var(--accent-red);
        }

        .action-buttons {
            display: flex;
            gap: 0.8rem;
            margin-top: 1rem;
            flex-wrap: wrap;
        }

        .btn-primary {
            font-family: 'Archivo Black', sans-serif;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 0.8rem 1.5rem;
            border: var(--border-weight) solid var(--text-dark);
            background: var(--accent-green);
            color: var(--text-dark);
            cursor: pointer;
            transition: all 0.15s;
            position: relative;
        }

        .btn-primary:hover {
            transform: translate(-3px, -3px);
            box-shadow: 5px 5px 0 var(--text-dark);
        }

        .btn-primary:active {
            transform: translate(0, 0);
            box-shadow: none;
        }

        .btn-secondary {
            font-family: 'DM Mono', monospace;
            font-size: 0.85rem;
            padding: 0.8rem 1.2rem;
            border: 3px solid var(--text-dark);
            background: white;
            cursor: pointer;
            transition: all 0.15s;
        }

        .btn-secondary:hover {
            background: var(--bg-primary);
            transform: translate(-2px, -2px);
            box-shadow: 3px 3px 0 var(--text-dark);
        }

        footer {
            padding: 1rem 2rem;
            border-top: var(--border-weight) solid var(--text-dark);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 0.5rem;
            font-size: 0.8rem;
        }

        .footer-badge {
            background: var(--text-dark);
            color: var(--text-light);
            padding: 0.3rem 0.6rem;
            font-size: 0.7rem;
        }

        /* Animation */
        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .control-group {
            animation: slideIn 0.5s ease-out backwards;
        }

        .preview-container {
            animation: slideIn 0.6s ease-out 0.2s backwards;
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 2rem;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--text-dark);
            color: var(--text-light);
            padding: 1rem 2rem;
            font-family: 'DM Mono', monospace;
            border: 3px solid var(--accent-green);
            opacity: 0;
            transition: all 0.3s ease;
            z-index: 1001;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>
<div class="noise-overlay"></div>

<header>
    <div class="header-content">
        <div>
            <span class="logo">MERMAID</span>
            <span class="logo-sub">VIEWER</span>
        </div>
        <p class="tagline">テキストから美しいダイアグラムを生成</p>
    </div>
</header>

<main>
    <div class="editor-panel">
        <div class="control-group">
            <label class="control-label">
                <span>Mermaid Code</span>
            </label>
            <div class="control-content">
                <div class="template-buttons">
                    <button class="template-btn" data-template="flowchart">Flowchart</button>
                    <button class="template-btn" data-template="sequence">Sequence</button>
                    <button class="template-btn" data-template="class">Class</button>
                    <button class="template-btn" data-template="er">ER Diagram</button>
                    <button class="template-btn" data-template="gantt">Gantt</button>
                    <button class="template-btn" data-template="pie">Pie Chart</button>
                </div>

                <div class="snippets-section">
                    <div class="snippets-label">Snippets (click to copy)</div>
                    <div class="snippets-grid" id="snippets-grid">
                        <!-- Flowchart -->
                        <button class="snippet-btn" data-snippet="A --> B">--></button>
                        <button class="snippet-btn" data-snippet="A -->|text| B">-->|text|</button>
                        <button class="snippet-btn" data-snippet="A --- B">---</button>
                        <button class="snippet-btn" data-snippet="A -.-> B">-.-></button>
                        <button class="snippet-btn" data-snippet="A ==> B">==></button>
                        <button class="snippet-btn" data-snippet="[Rectangle]">[Box]</button>
                        <button class="snippet-btn" data-snippet="(Rounded)">(Round)</button>
                        <button class="snippet-btn" data-snippet="{Diamond}">{Decision}</button>
                        <button class="snippet-btn" data-snippet="[(Database)]">[(DB)]</button>
                        <button class="snippet-btn" data-snippet="((Circle))">((Circle))</button>
                        <button class="snippet-btn" data-snippet="[[Subroutine]]">[[Sub]]</button>
                        <button class="snippet-btn" data-snippet="subgraph Name&#10;    &#10;end">subgraph</button>
                        <!-- Sequence -->
                        <button class="snippet-btn" data-snippet="->>">->> sync</button>
                        <button class="snippet-btn" data-snippet="-->>">-->> reply</button>
                        <button class="snippet-btn" data-snippet="-)">-) async</button>
                        <button class="snippet-btn" data-snippet="Note over A,B: text">Note over</button>
                        <button class="snippet-btn" data-snippet="loop Description&#10;    &#10;end">loop</button>
                        <button class="snippet-btn" data-snippet="alt Condition&#10;    &#10;else Other&#10;    &#10;end">alt/else</button>
                        <button class="snippet-btn" data-snippet="participant A as Alias">participant</button>
                        <!-- Class -->
                        <button class="snippet-btn" data-snippet="class Name {&#10;    +method()&#10;}">class {}</button>
                        <button class="snippet-btn" data-snippet="A <|-- B"><|-- extend</button>
                        <button class="snippet-btn" data-snippet="A *-- B">*-- compose</button>
                        <button class="snippet-btn" data-snippet="A o-- B">o-- aggregate</button>
                        <!-- ER -->
                        <button class="snippet-btn" data-snippet="A ||--o{ B : has">||--o{ 1:N</button>
                        <button class="snippet-btn" data-snippet="A ||--|| B : is">||--|| 1:1</button>
                        <button class="snippet-btn" data-snippet="A }o--o{ B : many">}o--o{ N:N</button>
                    </div>
                </div>
                <textarea id="mermaid-input" placeholder="Mermaidコードを入力...">flowchart TD
    subgraph Frontend
        A[User] --> B[React App]
        B --> C[Redux Store]
        C --> D[API Client]
    end

    subgraph Backend
        E[API Gateway] --> F[Auth Service]
        E --> G[User Service]
        E --> H[Order Service]
        F --> I[(Redis Cache)]
        G --> J[(PostgreSQL)]
        H --> J
        H --> K[Payment Service]
    end

    subgraph External
        K --> L[Stripe API]
        M[Email Service] --> N[SendGrid]
    end

    D --> E
    G --> M
    H --> M</textarea>
            </div>
        </div>
    </div>

    <div class="preview-panel">
        <div class="preview-container" id="preview-container">
            <span class="preview-label">Preview</span>
            <div id="mermaid-output"></div>
            <div class="zoom-controls">
                <button class="zoom-btn" id="zoom-out">−</button>
                <span class="zoom-level" id="zoom-level">100%</span>
                <button class="zoom-btn" id="zoom-in">+</button>
                <button class="zoom-btn" id="zoom-reset">↺</button>
            </div>
        </div>
        <div class="action-buttons">
            <button class="btn-primary" id="download-svg">
                SVG
            </button>
            <button class="btn-primary" id="download-png">
                PNG
            </button>
            <button class="btn-secondary" id="copy-btn">
                クリップボードにコピー
            </button>
            <button class="btn-secondary" id="fullscreen-btn">
                別タブで開く
            </button>
        </div>
    </div>
</main>

<footer>
    <span>Diagram as Code</span>
    <span class="footer-badge">VISUALIZE</span>
</footer>

<div class="toast" id="toast">コピーしました！</div>

<script>
    const input = document.getElementById('mermaid-input');
    const output = document.getElementById('mermaid-output');
    const previewContainer = document.getElementById('preview-container');
    const templateBtns = document.querySelectorAll('.template-btn');
    const downloadSvgBtn = document.getElementById('download-svg');
    const downloadPngBtn = document.getElementById('download-png');
    const copyBtn = document.getElementById('copy-btn');
    const toast = document.getElementById('toast');
    const zoomInBtn = document.getElementById('zoom-in');
    const zoomOutBtn = document.getElementById('zoom-out');
    const zoomResetBtn = document.getElementById('zoom-reset');
    const zoomLevelDisplay = document.getElementById('zoom-level');

    // Zoom & Pan state
    let scale = 1;
    let panX = 0;
    let panY = 0;
    let isDragging = false;
    let startX, startY;

    function updateTransform() {
        output.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
        zoomLevelDisplay.textContent = Math.round(scale * 100) + '%';
    }

    function resetView() {
        scale = 1;
        panX = 0;
        panY = 0;
        updateTransform();
    }

    // Zoom controls
    zoomInBtn.addEventListener('click', () => {
        scale = Math.min(scale * 1.2, 5);
        updateTransform();
    });

    zoomOutBtn.addEventListener('click', () => {
        scale = Math.max(scale / 1.2, 0.1);
        updateTransform();
    });

    zoomResetBtn.addEventListener('click', resetView);

    // Mouse wheel zoom
    previewContainer.addEventListener('wheel', (e) => {
        e.preventDefault();
        const rect = previewContainer.getBoundingClientRect();
        const mouseX = e.clientX - rect.left;
        const mouseY = e.clientY - rect.top;

        const delta = e.deltaY > 0 ? 0.9 : 1.1;
        const newScale = Math.min(Math.max(scale * delta, 0.1), 5);

        // Zoom toward mouse position
        const scaleChange = newScale / scale;
        panX = mouseX - (mouseX - panX) * scaleChange;
        panY = mouseY - (mouseY - panY) * scaleChange;
        scale = newScale;

        updateTransform();
    });

    // Pan with mouse drag
    output.addEventListener('mousedown', (e) => {
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
        output.classList.add('dragging');
    });

    document.addEventListener('mousemove', (e) => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    document.addEventListener('mouseup', () => {
        isDragging = false;
        output.classList.remove('dragging');
    });

    // Snippets
    const snippetBtns = document.querySelectorAll('.snippet-btn');
    snippetBtns.forEach(btn => {
        btn.addEventListener('click', async () => {
            const snippet = btn.dataset.snippet;
            try {
                await navigator.clipboard.writeText(snippet);
                btn.classList.add('copied');
                setTimeout(() => btn.classList.remove('copied'), 500);
                showToast('Copied: ' + snippet.split('\n')[0]);
            } catch (err) {
                showToast('Copy failed');
            }
        });
    });

    const templates = {
        flowchart: `flowchart TD
    subgraph Frontend
        A[User] --> B[React App]
        B --> C[Redux Store]
        C --> D[API Client]
    end

    subgraph Backend
        E[API Gateway] --> F[Auth Service]
        E --> G[User Service]
        E --> H[Order Service]
        F --> I[(Redis Cache)]
        G --> J[(PostgreSQL)]
        H --> J
        H --> K[Payment Service]
    end

    subgraph External
        K --> L[Stripe API]
        M[Email Service] --> N[SendGrid]
    end

    D --> E
    G --> M
    H --> M`,
        sequence: `sequenceDiagram
    autonumber
    participant U as User
    participant F as Frontend
    participant A as API Gateway
    participant Auth as Auth Service
    participant DB as Database
    participant Cache as Redis
    participant Email as Email Service

    U->>F: Login Request
    F->>A: POST /auth/login
    A->>Auth: Validate Credentials
    Auth->>DB: Query User
    DB-->>Auth: User Data
    Auth->>Auth: Generate JWT
    Auth->>Cache: Store Session
    Auth-->>A: JWT Token
    A-->>F: 200 OK + Token
    F->>F: Store Token
    F-->>U: Login Success

    Note over U,Email: User makes a purchase

    U->>F: Add to Cart
    F->>A: POST /cart/items
    A->>DB: Update Cart
    DB-->>A: Confirmation
    A-->>F: 200 OK
    F-->>U: Item Added

    U->>F: Checkout
    F->>A: POST /orders
    A->>DB: Create Order
    A->>Email: Send Confirmation
    Email-->>U: Order Email`,
        class: `classDiagram
    class Application {
        +Router router
        +Database db
        +start()
        +stop()
    }

    class Router {
        -routes Map
        +get(path, handler)
        +post(path, handler)
        +use(middleware)
    }

    class Controller {
        <<abstract>>
        #service Service
        +handle(req, res)*
    }

    class UserController {
        +getUser(req, res)
        +createUser(req, res)
        +updateUser(req, res)
        +deleteUser(req, res)
    }

    class Service {
        <<interface>>
        +find(id)
        +findAll()
        +create(data)
        +update(id, data)
        +delete(id)
    }

    class UserService {
        -repository UserRepository
        +find(id)
        +findAll()
        +create(data)
        +update(id, data)
        +delete(id)
    }

    class Repository {
        <<interface>>
        +findById(id)
        +save(entity)
    }

    class UserRepository {
        -db Database
        +findById(id)
        +save(entity)
    }

    Application --> Router
    Application --> Controller
    Controller <|-- UserController
    Controller --> Service
    Service <|.. UserService
    UserService --> Repository
    Repository <|.. UserRepository`,
        er: `erDiagram
    USER ||--o{ ORDER : places
    USER ||--o{ REVIEW : writes
    USER ||--o{ ADDRESS : has
    USER {
        int id PK
        string email UK
        string password_hash
        string first_name
        string last_name
        datetime created_at
        datetime updated_at
    }

    ORDER ||--|{ ORDER_ITEM : contains
    ORDER ||--o| PAYMENT : has
    ORDER ||--o| SHIPPING : has
    ORDER {
        int id PK
        int user_id FK
        string status
        decimal total_amount
        datetime order_date
        int shipping_address_id FK
    }

    PRODUCT ||--o{ ORDER_ITEM : "ordered in"

    // Initialize mermaid
    mermaid.initialize({
        startOnLoad: false,
        theme: 'default',
        securityLevel: 'loose',
        fontFamily: 'DM Mono, monospace'
    });

    let renderTimeout;

    async function renderDiagram() {
        const code = input.value.trim();
        if (!code) {
            output.innerHTML = '<p style="color: #888; text-align: center;">Mermaidコードを入力してください</p>';
            return;
        }

        try {
            // Clear previous content
            output.innerHTML = '';

            // Generate unique ID
            const id = 'mermaid-' + Date.now();

            // Render
            const { svg } = await mermaid.render(id, code);
            output.innerHTML = svg;
            resetView();
        } catch (error) {
            output.innerHTML = `<div class="error-message">
                <strong>Error:</strong> ${error.message || 'Invalid Mermaid syntax'}
            </div>`;
        }
    }

    // Debounced render
    input.addEventListener('input', () => {
        clearTimeout(renderTimeout);
        renderTimeout = setTimeout(renderDiagram, 500);
    });

    // Template buttons
    templateBtns.forEach(btn => {
        btn.addEventListener('click', () => {
            const template = btn.dataset.template;
            if (templates[template]) {
                input.value = templates[template];
                renderDiagram();
            }
        });
    });

    // Download SVG
    downloadSvgBtn.addEventListener('click', () => {
        const svg = output.querySelector('svg');
        if (!svg) {
            showToast('ダイアグラムがありません');
            return;
        }

        const svgData = new XMLSerializer().serializeToString(svg);
        const blob = new Blob([svgData], { type: 'image/svg+xml' });
        const url = URL.createObjectURL(blob);

        const link = document.createElement('a');
        link.download = `mermaid-${Date.now()}.svg`;
        link.href = url;
        link.click();

        URL.revokeObjectURL(url);
    });

    // Download PNG
    downloadPngBtn.addEventListener('click', async () => {
        const svg = output.querySelector('svg');
        if (!svg) {
            showToast('ダイアグラムがありません');
            return;
        }

        const svgData = new XMLSerializer().serializeToString(svg);
        const canvas = document.createElement('canvas');
        const ctx = canvas.getContext('2d');
        const img = new Image();

        img.onload = () => {
            canvas.width = img.width * 2;
            canvas.height = img.height * 2;
            ctx.fillStyle = 'white';
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            const link = document.createElement('a');
            link.download = `mermaid-${Date.now()}.png`;
            link.href = canvas.toDataURL('image/png');
            link.click();
        };

        img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
    });

    // Copy to clipboard
    copyBtn.addEventListener('click', async () => {
        const svg = output.querySelector('svg');
        if (!svg) {
            showToast('ダイアグラムがありません');
            return;
        }

        try {
            const svgData = new XMLSerializer().serializeToString(svg);
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            const img = new Image();

            img.onload = async () => {
                canvas.width = img.width * 2;
                canvas.height = img.height * 2;
                ctx.fillStyle = 'white';
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

                canvas.toBlob(async (blob) => {
                    try {
                        await navigator.clipboard.write([
                            new ClipboardItem({ 'image/png': blob })
                        ]);
                        showToast('コピーしました！');
                    } catch (err) {
                        showToast('コピーに失敗しました');
                    }
                }, 'image/png');
            };

            img.src = 'data:image/svg+xml;base64,' + btoa(unescape(encodeURIComponent(svgData)));
        } catch (err) {
            showToast('コピーに失敗しました');
        }
    });

    function showToast(message) {
        toast.textContent = message;
        toast.classList.add('show');
        setTimeout(() => toast.classList.remove('show'), 2000);
    }

    // Open in new tab (fullscreen)
    const fullscreenBtn = document.getElementById('fullscreen-btn');
    fullscreenBtn.addEventListener('click', () => {
        const svg = output.querySelector('svg');
        if (!svg) {
            showToast('ダイアグラムがありません');
            return;
        }

        const svgData = new XMLSerializer().serializeToString(svg);
        const html = `<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Mermaid Preview</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #f5f5f5;
            padding: 20px;
        }
        svg {
            max-width: 100%;
            max-height: 100vh;
            height: auto;
        }
    </style>
</head>
<body>${svgData}</body>
</html>`;

        const blob = new Blob([html], { type: 'text/html' });
        const url = URL.createObjectURL(blob);
        window.open(url, '_blank');
    });

    // Initial render
    renderDiagram();
</script>
</body>
</html>
